The information is directly available as soon as possible after occurrence of the milestone.", "hl": false}, {"id": "M16.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M16.effect.1", "field": "Effect", "text": "FSA and MVT messages are sent.", "hl": false}, {"id": "M16.procedures.1", "field": "Procedures", "text": "To inform all relevant Airport CDM Partners about the actual take off.", "hl": false}, {"id": "M16.procedures.2", "field": "Procedures", "text": "An airborne message is generated and the flight is removed from the departure sequence.", "hl": true}, {"id": "M16.procedures.3", "field": "Procedures", "text": "This process is triggered by Tower FDPS, A-SMGCS / Radar detection or ACARS.", "hl": false}, {"id": "M16.operational_status.1", "field": "Operational Status", "text": "DEPARTED / TAKE OFF", "hl": true}, {"id": "M16.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ATOT recorded", "hl": false}]}, {"id": "g081", "task": "precision", "model": "m06", "milestone": 14, "milestone_name": "Start Up Approved", "element": {"path": "Milestone.milestoneName", "kind": "attribute", "content": {"name": "milestoneName", "type": "String", "description": "The milestone's name, e.g. 'ATC Flight Plan Activated'."}, "class": {"name": "Milestone", "stereotype": "control", "package": "Milestones", "definition": "One of the sixteen CDM events, each with its trigger, timing rule, effect on operational status, and procedure."}}, "sentences": [{"id": "M14.definition.1", "field": "Definition", "text": "ASAT - Actual start up Approval Time.", "hl": false}, {"id": "M14.definition.2", "field": "Definition", "text": "This is the time that an aircraft receives its start up approval.", "hl": false}, {"id": "M14.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": true}, {"id": "M14.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M14.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M14.effect.1", "field": "Effect", "text": "On receipt of ATC approval, the aircraft will start up, push back and start to taxi.", "hl": true}, {"id": "M14.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual start up approval Time (ASAT) in the Airport CDM Platform and that the aircraft has received start up approval / push-back clearance.", "hl": false}, {"id": "M14.procedures.2", "field": "Procedures", "text": "Second step: To check if ASAT is in accordance to TSAT and to alert all relevant Airport CDM Partners when no start up has been granted.", "hl": false}, {"id": "M14.procedures.3", "field": "Procedures", "text": "Inform of ASAT when it occurs.", "hl": false}, {"id": "M14.procedures.4", "field": "Procedures", "text": "In case the start up approval is not granted at TSAT + tolerance, all relevant partners should be informed.", "hl": false}, {"id": "M14.procedures.5", "field": "Procedures", "text": "The flight will be re-sequenced.", "hl": false}, {"id": "M14.procedures.6", "field": "Procedures", "text": "Start up request by flight crew (voice or DCL) or a locally defined time around TSAT if Milestone Process 13 is omitted.", "hl": true}, {"id": "M14.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M14.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g082", "task": "precision", "model": "m01", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "FinalConfirmationOfTobt->Milestone [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "FinalConfirmationOfTobt", "target": "Milestone", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": false}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": true}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": false}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": true}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": true}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g083", "task": "precision", "model": "m15", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "NetworkOperations", "kind": "class", "content": {"name": "NetworkOperations", "stereotype": "entity", "package": "Stakeholders", "definition": "The network management party that issues CTOT, monitors flight progress via ETFMS/FUM, and receives DPI messages."}, "class": null}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": false}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": false}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": true}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": false}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": true}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": true}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": false}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": false}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g084", "task": "precision", "model": "m03", "milestone": 16, "milestone_name": "Take Off", "element": {"path": "Flight.direction", "kind": "attribute", "content": {"name": "direction", "type": "String", "description": "Whether this leg is an arrival or a departure."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single flight leg (arrival or departure) tracked through the CDM process from flight plan activation to take-off."}}, "sentences": [{"id": "M16.definition.1", "field": "Definition", "text": "ATOT - Actual Take Off Time.", "hl": false}, {"id": "M16.definition.2", "field": "Definition", "text": "This is the time that an aircraft takes off from the runway.", "hl": false}, {"id": "M16.definition.3", "field": "Definition", "text": "(Equivalent to ATC ATD-Actual Time of Departure, ACARS = OFF).", "hl": true}, {"id": "M16.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by ATC system or from ACARS equipped aircraft.", "hl": false}, {"id": "M16.timing.1", "field": "Timing", "text": "The information is directly available as soon as possible after occurrence of the milestone.", "hl": false}, {"id": "M16.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M16.effect.1", "field": "Effect", "text": "FSA and MVT messages are sent.", "hl": false}, {"id": "M16.procedures.1", "field": "Procedures", "text": "To inform all relevant Airport CDM Partners about the actual take off.", "hl": false}, {"id": "M16.procedures.2", "field": "Procedures", "text": "An airborne message is generated and the flight is removed from the departure sequence.", "hl": true}, {"id": "M16.procedures.3", "field": "Procedures", "text": "This process is triggered by Tower FDPS, A-SMGCS / Radar detection or ACARS.", "hl": false}, {"id": "M16.operational_status.1", "field": "Operational Status", "text": "DEPARTED / TAKE OFF", "hl": false}, {"id": "M16.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ATOT recorded", "hl": false}]}, {"id": "g085", "task": "precision", "model": "m08", "milestone": 4, "milestone_name": "Local Radar Update", "element": {"path": "ATCUnit", "kind": "class", "content": {"name": "ATCUnit", "stereotype": "entity", "package": "External Actors", "definition": "The Air Traffic Control unit (ACC, Approach, or Tower) responsible for radar detection, TSAT issue, and start-up approval."}, "class": null}, "sentences": [{"id": "M4.definition.1", "field": "Definition", "text": "The flight enters the FIR (Flight Information Region) or the local airspace of the destination airport.", "hl": false}, {"id": "M4.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit that is associated with an airport.", "hl": true}, {"id": "M4.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "hl": false}, {"id": "M4.timing.1", "field": "Timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "hl": false}, {"id": "M4.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M4.effect.1", "field": "Effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "hl": false}, {"id": "M4.effect.2", "field": "Effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "hl": false}, {"id": "M4.effect.3", "field": "Effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "hl": false}, {"id": "M4.effect.4", "field": "Effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "hl": false}, {"id": "M4.effect.5", "field": "Effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "hl": false}, {"id": "M4.effect.6", "field": "Effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.", "hl": false}, {"id": "M4.effect.7", "field": "Effect", "text": "Decisions such as the turn-round period, connecting passengers etc are taken and need to be stable at this event.", "hl": false}, {"id": "M4.effect.8", "field": "Effect", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "hl": false}, {"id": "M4.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M4.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M4.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": true}, {"id": "M4.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M4.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M4.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": false}, {"id": "M4.operational_status.1", "field": "Operational Status", "text": "FIR", "hl": false}, {"id": "M4.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g086", "task": "precision", "model": "m09", "milestone": 4, "milestone_name": "Local Radar Update", "element": {"path": "TurnRoundOperator->OffBlockTime [dependency]", "kind": "relationship", "content": {"type": "dependency", "source": "TurnRoundOperator", "target": "OffBlockTime", "label": "provides TOBT", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M4.definition.1", "field": "Definition", "text": "The flight enters the FIR (Flight Information Region) or the local airspace of the destination airport.", "hl": false}, {"id": "M4.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit that is associated with an airport.", "hl": false}, {"id": "M4.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the fl }, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": false}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": true}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": true}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": true}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g088", "task": "precision", "model": "m16", "milestone": 2, "milestone_name": "EOBT - 2 hr", "element": {"path": "Flight.regulated", "kind": "attribute", "content": {"name": "regulated", "type": "Boolean", "description": "Whether the flight is regulated and has received a CTOT; regulated flights usually have priority over unregulated flights (milestone 2)."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single flight movement, arriving or departing, tracked through the sixteen milestones of the CDM turn-round process."}}, "sentences": [{"id": "M2.definition.1", "field": "Definition", "text": "At EOBT-2 hr most flights will be known in the Airport CDM Platform including if they are regulated or not.", "hl": false}, {"id": "M2.definition.2", "field": "Definition", "text": "All regulated flights receive a CTOT from Network Operations.", "hl": true}, {"id": "M2.origin_and_priority.1", "field": "Origin and priority", "text": "The CTOT is issued by the Network Operations and is sent to relevant ATS units as well as the departure aerodrome.", "hl": false}, {"id": "M2.origin_and_priority.2", "field": "Origin and priority", "text": "CTOT flights usually have a priority over unregulated flights.", "hl": true}, {"id": "M2.timing.1", "field": "Timing", "text": "If the flight is regulated, a CTOT is issued at EOBT-2h.", "hl": true}, {"id": "M2.data_quality.1", "field": "Data Quality", "text": "Not applicable.", "hl": false}, {"id": "M2.effect.1", "field": "Effect", "text": "For inbound flights, ELDT is updated based on information provided by the FUM messages, taking into account the actual progress of the flight.", "hl": false}, {"id": "M2.procedures.1", "field": "Procedures", "text": "To check (before or after take off from outstation) whether AO/GH flight estimates are consistent with the ATC Flight Plan and to inform Network Operations about the updated take off time estimate, using a T-DPI Message.", "hl": false}, {"id": "M2.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan estimated off block time at EOBT-2 hrs.", "hl": false}, {"id": "M2.procedures.3", "field": "Procedures", "text": "At EOBT-2 hrs Network Operations is informed through the first T-DPI message.", "hl": false}, {"id": "M2.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT, if later than EOBT+EXOT.", "hl": false}, {"id": "M2.procedures.5", "field": "Procedures", "text": "In the case of manual input of TOBT, this estimate will override the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M2.procedures.6", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M2.procedures.7", "field": "Procedures", "text": "- a time stamp, at EOBT - 2h.", "hl": false}, {"id": "M2.operational_status.1", "field": "Operational Status", "text": "N. A.", "hl": false}, {"id": "M2.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETOT/TTOT/CTOT Mark appropriate fields as REGULATED", "hl": false}]}, {"id": "g089", "task": "precision", "model": "m15", "milestone": 10, "milestone_name": "TSAT Issued", "element": {"path": "DpiMessage->NetworkOperations [association]", "kind": "relationship", "content": {"type": "association", "source": "DpiMessage", "target": "NetworkOperations", "label": "sent to", "source_multiplicity": "*", "target_multiplicity": "1"}, "class": null}, "sentences": [{"id": "M10.definition.1", "field": "Definition", "text": "The time ATC issues the Target Start Up Approval Time", "hl": false}, {"id": "M10.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M10.timing.1", "field": "Timing", "text": "The information is provided t-minutes before EOBT, where t is a parameter agreed locally", "hl": false}, {"id": "M10.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M10.effect.1", "field": "Effect", "text": "The flight is stabilised into the pre-departure sequence.", "hl": true}, {"id": "M10.effect.2", "field": "Effect", "text": "The Aircraft Operator/ Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M10.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant partners of the TSAT that has been allocated to the flight.", "hl": false}, {"id": "M10.procedures.2", "field": "Procedures", "text": "The Network Operations is informed by a T-DPI-s for non regulated flights.", "hl": true}, {"id": "M10.procedures.3", "field": "Procedures", "text": "Second step: To check whether the number of TOBT updates exceeds a tolerance defined locally, after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.4", "field": "Procedures", "text": "First: The TSAT will indicate to the partners the time when the start up approval can be expected.", "hl": false}, {"id": "M10.procedures.5", "field": "Procedures", "text": "Network Operations will be informed with a T-DPI-s for non regulated flights.", "hl": true}, {"id": "M10.procedures.6", "field": "Procedures", "text": "No check is performed.", "hl": false}, {"id": "M10.procedures.7", "field": "Procedures", "text": "Second: A check shall be performed to see the number of TOBT updates after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.8", "field": "Procedures", "text": "In case the number of TOBT updates exceeds a threshold, then the TOBT input should be processed according to local procedure.", "hl": false}, {"id": "M10.procedures.9", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M10.procedures.10", "field": "Procedures", "text": "- A defined time (local parameter) before TOBT", "hl": false}, {"id": "M10.procedures.11", "field": "Procedures", "text": "- TOBT update after TSAT issue", "hl": false}, {"id": "M10.operational_status.1", "field": "Operational Status", "text": "SEQUENCED", "hl": false}, {"id": "M10.action_on_cdm.1", "field": "Action on CDM Operation", "text": "TTOT updated", "hl": false}]}, {"id": "g090", "task": "precision", "model": "m06", "milestone": 12, "milestone_name": "Aircraft Ready", "element": {"path": "ActualTime->TimeQuantity [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "ActualTime", "target": "TimeQuantity", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M12.definition.1", "field": "Definition", "text": "The time when all doors are closed, boarding bridge removed, push back vehicle connected, ready to taxi immediately upon reception of TWR instructions (ARDT).", "hl": true}, {"id": "M12.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by the Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M12.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M12.data_quality.1", "field": "Data Quality", "text": "Data is directly available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M12.effect.1", "field": "Effect", "text": "ATC refines the pre-departure sequence.", "hl": false}, {"id": "M12.effect.2", "field": "Effect", "text": "The pilot requests start up just before TSAT, following coordination with the Ground Handler.", "hl": false}, {"id": "M12.effect.3", "field": "Effect", "text": "(Dispatcher / Supervisor / Redcap).", "hl": false}, {"id": "M12.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Ready Time (ARDT) in the Airport CDM Platform and that the aircraft is ready for start up / push-back.", "hl": true}, {"id": "M12.procedures.2", "field": "Procedures", "text": "Second step: To inform the AO/GH that TOBT has passed and the Airport CDM Platform has not yet received ARDT or Ready Status (RDY).", "hl": false}, {"id": "M12.procedures.3", "field": "Procedures", "text": "Inform of ARDT or RDY confirming that the flight follows the indicated TOBT.", "hl": true}, {"id": "M12.procedures.4", "field": "Procedures", "text": "At TOBT + tolerance the AO/GH are informed that TOBT has passed and there has not been a ready status message yet.", "hl": false}, {"id": "M12.procedures.5", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M12.procedures.6", "field": "Procedures", "text": "- an input to the Airport CDM Platform.", "hl": false}, {"id": "M12.operational_status.1", "field": "Operational Status", "text": "READY", "hl": false}, {"id": "M12.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g091", "task": "precision", "model": "m10", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "OffBlockTime", "kind": "class", "content": {"name": "OffBlockTime", "stereotype": "entity", "package": "Timings", "definition": "The off-block time for the flight, held as SOBT, EOBT, TOBT or AOBT depending on its prefix."}, "class": null}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": false}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": true}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": true}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g092", "task": "precision", "model": "m02", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "AircraftOperator->Flight [association]", "kind": "relationship", "content": {"type": "association", "source": "AircraftOperator", "target": "Flight", "label": "operates", "source_multiplicity": "1", "target_multiplicity": "*"}, "class": null}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": true}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": true}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": true}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g093", "task": "precision", "model": "m16", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "Flight.operationalStatus", "kind": "attribute", "content": {"name": "operationalStatus", "type": "FlightOperationalStatus", "description": "The current operational status of the flight, changed at each milestone (e.g. INITIATED, AIRBORNE, FIR, FINAL, LANDED, IN-BLOCK, SEQUENCED, BOARDING, READY, OFF-BLOCK, DEPARTED / TAKE OFF)."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single flight movement, arriving or departing, tracked through the sixteen milestones of the CDM turn-round process."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": true}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": true}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": false}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": true}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g094", "task": "precision", "model": "m11", "milestone": 13, "milestone_name": "Start Up Requested", "element": {"path": "Milestone.timestamp", "kind": "attribute", "content": {"name": "timestamp", "type": "DateTime", "description": "Time at which the milestone occurred."}, "class": {"name": "Milestone", "stereotype": "entity", "package": "CDMProcess", "definition": "One of the 16 defined CDM milestone events in a flight's life-cycle, each with a definition, timing, trigger, and resulting operational status change."}}, "sentences": [{"id": "M13.definition.1", "field": "Definition", "text": "The time that start up is requested (ASRT).", "hl": true}, {"id": "M13.origin_and_priority.1", "field": "Origin and priority", "text": "ATC (based on pilot request).", "hl": false}, {"id": "M13.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": true}, {"id": "M13.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M13.effect.1", "field": "Effect", "text": "ATC confirms TSAT to the pilot in order to maintain the aircraft in the pre-departure sequence.", "hl": false}, {"id": "M13.effect.2", "field": "Effect", "text": "Provided the aircraft was ready on time (ARDT), it is now up to ATC to assure that a regulated flight can respect its CTOT.", "hl": false}, {"id": "M13.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Start up Request Time (ASRT) in the Airport CDM Platform.", "hl": false}, {"id": "M13.procedures.2", "field": "Procedures", "text": "Second step: to alert all relevant Airport CDM Partners when no start up has been re-quested inside the locally agreed TSAT tolerance window.", "hl": false}, {"id": "M13.procedures.3", "field": "Procedures", "text": "Inform of ASRT when it occurs.", "hl": false}, {"id": "M13.procedures.4", "field": "Procedures", "text": "If the start up request is not made by TSAT + tolerance, the AO/GH is informed that no start up has been requested, and should update TOBT.", "hl": false}, {"id": "M13.procedures.5", "field": "Procedures", "text": "Timestamp when the tolerance window has passed at TSAT.", "hl": true}, {"id": "M13.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M13.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g095", "task": "precision", "model": "m03", "milestone": 4, "milestone_name": "Local Radar Update", "element": {"path": "GroundHandler", "kind": "class", "content": {"name": "GroundHandler", "stereotype": "entity", "package": "Stakeholders", "definition": "The ground handling party that, with the Aircraft Operator, manages the turn-round and provides TOBT and ground status updates."}, "class": null}, "sentences": [{"id": "M4.definition.1", "field": "Definition", "text": "The flight enters the FIR (Flight Information Region) or the local airspace of the destination airport.", "hl": false}, {"id": "M4.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit that is associated with an airport.", "hl": false}, {"id": "M4.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "hl": false}, {"id": "M4.timing.1", "field": "Timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "hl": false}, {"id": "M4.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M4.effect.1", "field": "Effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "hl": true}, {"id": "M4.effect.2", "field": "Effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "hl": false}, {"id": "M4.effect.3", "field": "Effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "hl": false}, {"id": "M4.effect.4", "field": "Effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "hl": false}, {"id": "M4.effect.5", "field": "Effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "hl": false}, {"id": "M4.effect.6", "field": "Effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.", "hl": true}, {"id": "M4.effect.7", "field": "Effect", "text": "Decisions such as the turn-round period, connecting passengers etc are taken and need to be stable at this event.", "hl": false}, {"id": "M4.effect.8", "field": "Effect", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "hl": false}, {"id": "M4.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M4.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M4.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": false}, {"id": "M4.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M4.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M4.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": false}, {"id": "M4.operational_status.1", "field": "Operational Status", "text": "FIR", "hl": false}, {"id": "M4.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g096", "task": "precision", "model": "m02", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "Flight.updateOperationalStatus()", "kind": "operation", "content": {"signature": "updateOperationalStatus(newStatus: FlightOperationalStatus): void", "description": "The flight's operational status changes to the value defined by each milestone as it occurs, e.g. INITIATED (milestone 1), AIRBORNE (milestone 3), FIR (milestone 4), FINAL (milestone 5), LANDED (milestone 6), IN-BLOCK (milestones 7, 8, 9), SEQUENCED (milestone 10), BOARDING (milestone 11), READY (milestone 12), OFF-BLOCK (milestone 15), DEPARTED/TAKE OFF (milestone 16)."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single arriving or departing operation of an aircraft, tracked through the sixteen milestones and carrying an operational status."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": true}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": true}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": false}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": true}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g097", "task": "precision", "model": "m13", "milestone": 12, "milestone_name": "Aircraft Ready", "element": {"path": "Aircrew->AirportCDMPartner [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "Aircrew", "target": "AirportCDMPartner", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M12.definition.1", "field": "Definition", "text": "The time when all doors are closed, boarding bridge removed, push back vehicle connected, ready to taxi immediately upon reception of TWR instructions (ARDT).", "hl": false}, {"id": "M12.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by the Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M12.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M12.data_quality.1", "field": "Data Quality", "text": "Data is directly available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M12.effect.1", "field": "Effect", "text": "ATC refines the pre-departure sequence.", "hl": false}, {"id": "M12.effect.2", "field": "Effect", "text": "The pilot requests start up just before TSAT, following coordination with the Ground Handler.", "hl": false}, {"id": "M12.effect.3", "field": "Effect", "text": "(Dispatcher / Supervisor / Redcap).", "hl": false}, {"id": "M12.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Ready Time (ARDT) in the Airport CDM Platform and that the aircraft is ready for start up / push-back.", "hl": true}, {"id": "M12.procedures.2", "field": "Procedures", "text": "Second step: To inform the AO/GH that TOBT has passed and the Airport CDM Platform has not yet received ARDT or Ready Status (RDY).", "hl": true}, {"id": "M12.procedures.3", "field": "Procedures", "text": "Inform of ARDT or RDY confirming that the flight follows the indicated TOBT.", "hl": false}, {"id": "M12.procedures.4", "field": "Procedures", "text": "At TOBT + tolerance the AO/GH are informed that TOBT has passed and there has not been a ready status message yet.", "hl": false}, {"id": "M12.procedures.5", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M12.procedures.6", "field": "Procedures", "text": "- an input to the Airport CDM Platform.", "hl": true}, {"id": "M12.operational_status.1", "field": "Operational Status", "text": "READY", "hl": false}, {"id": "M12.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g098", "task": "precision", "model": "m17", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "Aerodrome.coordinated", "kind": "attribute", "content": {"name": "coordinated", "type": "Boolean", "description": "Whether the aerodrome is coordinated; for coordinated airports the outbound flight is already known, for non-coordinated airports the flight plan initiates the outbound flight (m1)."}, "class": {"name": "Aerodrome", "stereotype": "entity", "package": "Flights", "definition": "A departure or destination aerodrome, which may be coordinated (slot-controlled) or non-coordinated."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": true}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": true}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": true}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g099", "task": "precision", "model": "m02", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "MilestoneTakeOffFromOutstation.calculateTTOT()", "kind": "operation", "content": {"signature": "calculateTTOT(eibt: TimeQuantity, mttt: DurationEstimate, exot: DurationEstimate, eobt: TimeQuantity, tobt: TimeQuantity): TimeQuantity", "description": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT. In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT. Where TOBT is available this prediction overrules the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT (milestone 3)."}, "class": {"name": "MilestoneTakeOffFromOutstation", "stereotype": "control", "package": "Milestones", "definition": "Milestone 3: the ATOT from the outstation is used to check estimated landing time consistency with the outbound ATC Flight Plan and, if the TTOT tolerance is exceeded, inform Network Operations via a T-DPI-t."}}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": false}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": false}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": false}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": false}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": false}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": false}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": true}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": true}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": true}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": false}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g100", "task": "precision", "model": "m16", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "TimePrefix", "kind": "enumeration", "content": {"name": "TimePrefix", "package": "Timings", "literals": ["Scheduled", "Estimated", "Target", "Actual", "Calculated"]}, "class": null}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": true}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": false}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": false}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": true}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": false}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": false}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": false}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": false}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": true}]}, {"id": "g101", "task": "precision", "model": "m17", "milestone": 2, "milestone_name": "EOBT - 2 hr", "element": {"path": "Milestone.effect", "kind": "attribute", "content": {"name": "effect", "type": "String", "description": "The effect the milestone has on flight data and downstream decisions."}, "class": {"name": "Milestone", "stereotype": "control", "package": "Milestones", "definition": "An abstract CDM milestone event with its trigger, timing rule, effect, and procedure."}}, "sentences": [{"id": "M2.definition.1", "field": "Definition", "text": "At EOBT-2 hr most flights will be known in the Airport CDM Platform including if they are regulated or not.", "hl": true}, {"id": "M2.definition.2", "field": "Definition", "text": "All regulated flights receive a CTOT from Network Operations.", "hl": true}, {"id": "M2.origin_and_priority.1", "field": "Origin and priority", "text": "The CTOT is issued by the Network Operations and is sent to relevant ATS units as well as the departure aerodrome.", "hl": false}, {"id": "M2.origin_and_priority.2", "field": "Origin and priority", "text": "CTOT flights usually have a priority over unregulated flights.", "hl": true}, {"id": "M2.timing.1", "field": "Timing", "text": "If the flight is regulated, a CTOT is issued at EOBT-2h.", "hl": false}, {"id": "M2.data_quality.1", "field": "Data Quality", "text": "Not applicable.", "hl": false}, {"id": "M2.effect.1", "field": "Effect", "text": "For inbound flights, ELDT is updated based on information provided by the FUM messages, taking into account the actual progress of the flight.", "hl": false}, {"id": "M2.procedures.1", "field": "Procedures", "text": "To check (before or after take off from outstation) whether AO/GH flight estimates are consistent with the ATC Flight Plan and to inform Network Operations about the updated take off time estimate, using a T-DPI Message.", "hl": false}, {"id": "M2.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan estimated off block time at EOBT-2 hrs.", "hl": false}, {"id": "M2.procedures.3", "field": "Procedures", "text": "At EOBT-2 hrs Network Operations is informed through the first T-DPI message.", "hl": false}, {"id": "M2.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT, if later than EOBT+EXOT.", "hl": false}, {"id": "M2.procedures.5", "field": "Procedures", "text": "In the case of manual input of TOBT, this estimate will override the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M2.procedures.6", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M2.procedures.7", "field": "Procedures", "text": "- a time stamp, at EOBT - 2h.", "hl": false}, {"id": "M2.operational_status.1", "field": "Operational Status", "text": "N. A.", "hl": false}, {"id": "M2.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETOT/TTOT/CTOT Mark appropriate fields as REGULATED", "hl": false}]}, {"id": "g102", "task": "precision", "model": "m12", "milestone": 10, "milestone_name": "TSAT Issued", "element": {"path": "AtcUnit.issueTsat()", "kind": "operation", "content": {"signature": "issueTsat(flight: Flight): DateTime", "description": "Issues the Target Start-Up Approval Time for the flight, sequencing it into the pre-departure sequence."}, "class": {"name": "AtcUnit", "stereotype": "entity", "package": "Actors", "definition": "An Air Traffic Control unit (tower, ACC/Approach) that provides radar detections, TSAT, ASAT and other ATC-controlled milestone data."}}, "sentences": [{"id": "M10.definition.1", "field": "Definition", "text": "The time ATC issues the Target Start Up Approval Time", "hl": true}, {"id": "M10.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M10.timing.1", "field": "Timing", "text": "The information is provided t-minutes before EOBT, where t is a parameter agreed locally", "hl": false}, {"id": "M10.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M10.effect.1", "field": "Effect", "text": "The flight is stabilised into the pre-departure sequence.", "hl": true}, {"id": "M10.effect.2", "field": "Effect", "text": "The Aircraft Operator/ Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M10.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant partners of the TSAT that has been allocated to the flight.", "hl": false}, {"id": "M10.procedures.2", "field": "Procedures", "text": "The Network Operations is informed by a T-DPI-s for non regulated flights.", "hl": false}, {"id": "M10.procedures.3", "field": "Procedures", "text": "Second step: To check whether the number of TOBT updates exceeds a tolerance defined locally, after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.4", "field": "Procedures", "text": "First: The TSAT will indicate to the partners the time when the start up approval can be expected.", "hl": false}, {"id": "M10.procedures.5", "field": "Procedures", "text": "Network Operations will be informed with a T-DPI-s for non regulated flights.", "hl": false}, {"id": "M10.procedures.6", "field": "Procedures", "text": "No check is performed.", "hl": false}, {"id": "M10.procedures.7", "field": "Procedures", "text": "Second: A check shall be performed to see the number of TOBT updates after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.8", "field": "Procedures", "text": "In case the number of TOBT updates exceeds a threshold, then the TOBT input should be processed according to local procedure.", "hl": false}, {"id": "M10.procedures.9", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M10.procedures.10", "field": "Procedures", "text": "- A defined time (local parameter) before TOBT", "hl": false}, {"id": "M10.procedures.11", "field": "Procedures", "text": "- TOBT update after TSAT issue", "hl": true}, {"id": "M10.operational_status.1", "field": "Operational Status", "text": "SEQUENCED", "hl": false}, {"id": "M10.action_on_cdm.1", "field": "Action on CDM Operation", "text": "TTOT updated", "hl": false}]}, {"id": "g103", "task": "precision", "model": "m16", "milestone": 14, "milestone_name": "Start Up Approved", "element": {"path": "Milestone", "kind": "class", "content": {"name": "Milestone", "stereotype": "control", "package": "Milestones", "definition": "One of the sixteen defined events of the CDM turn-round process, each with a trigger, timing rule, effect, and procedure."}, "class": null}, "sentences": [{"id": "M14.definition.1", "field": "Definition", "text": "ASAT - Actual start up Approval Time.", "hl": false}, {"id": "M14.definition.2", "field": "Definition", "text": "This is the time that an aircraft receives its start up approval.", "hl": false}, {"id": "M14.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M14.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M14.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M14.effect.1", "field": "Effect", "text": "On receipt of ATC approval, the aircraft will start up, push back and start to taxi.", "hl": false}, {"id": "M14.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual start up approval Time (ASAT) in the Airport CDM Platform and that the aircraft has received start up approval / push-back clearance.", "hl": true}, {"id": "M14.procedures.2", "field": "Procedures", "text": "Second step: To check if ASAT is in accordance to TSAT and to alert all relevant Airport CDM Partners when no start up has been granted.", "hl": true}, {"id": "M14.procedures.3", "field": "Procedures", "text": "Inform of ASAT when it occurs.", "hl": false}, {"id": "M14.procedures.4", "field": "Procedures", "text": "In case the start up approval is not granted at TSAT + tolerance, all relevant partners should be informed.", "hl": false}, {"id": "M14.procedures.5", "field": "Procedures", "text": "The flight will be re-sequenced.", "hl": false}, {"id": "M14.procedures.6", "field": "Procedures", "text": "Start up request by flight crew (voice or DCL) or a locally defined time around TSAT if Milestone Process 13 is omitted.", "hl": true}, {"id": "M14.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M14.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g104", "task": "precision", "model": "m04", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "TimeQuantity.recordedAt", "kind": "attribute", "content": {"name": "recordedAt", "type": "DateTime", "description": "The time this value was recorded; every successive value is appended rather than overwriting the prior one, so the turn-round can be analysed afterwards."}, "class": {"name": "TimeQuantity", "stereotype": "entity", "package": "Timings", "definition": "An abstract time value describing a flight's progress, recorded with its prefix, originator and time of update, with every successive value kept rather than overwritten."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": true}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": true}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": true}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft
