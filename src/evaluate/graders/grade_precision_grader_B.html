 the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g137", "task": "precision", "model": "m07", "milestone": 8, "milestone_name": "Ground Handling Started", "element": {"path": "GroundHandlingTime.timeOfUpdate", "kind": "attribute", "content": {"name": "timeOfUpdate", "type": "DateTime", "description": "The time at which this value was recorded."}, "class": {"name": "GroundHandlingTime", "stereotype": "entity", "package": "Timings", "definition": "The actual commence of ground handling time (ACGT), applicable to first-of-day or long-parked flights."}}, "sentences": [{"id": "M8.definition.1", "field": "Definition", "text": "Commence of Ground Handling Operations (ACGT).", "hl": true}, {"id": "M8.definition.2", "field": "Definition", "text": "Note: this milestone is specific to flights that are the first operation of the day or that have been long term parked.", "hl": false}, {"id": "M8.definition.3", "field": "Definition", "text": "For flights that are on a normal turn-round ACGT is considered to commence at AIBT.", "hl": true}, {"id": "M8.origin_and_priority.1", "field": "Origin and priority", "text": "Aircraft Operator / Ground Handler will provide the information.", "hl": false}, {"id": "M8.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M8.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M8.effect.1", "field": "Effect", "text": "The occurrence of ACGT triggers an update of downstream estimates: TOBT is updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the estimated turn-round period for the departing flight.", "hl": false}, {"id": "M8.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M8.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M8.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M8.procedures.6", "field": "Procedures", "text": "- Actual Commence of Ground Handling: ACGT", "hl": true}, {"id": "M8.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M8.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETTT/TOBT, TTOT updated", "hl": false}]}, {"id": "g138", "task": "precision", "model": "m14", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "Flight.eobt", "kind": "attribute", "content": {"name": "eobt", "type": "Eobt", "description": "The flight's Estimated Off-Block Time, used as the reference point for milestone triggers such as EOBT-3hr and EOBT-2hr (milestones 1,2,3,9,10)."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single scheduled arrival or departure operation of an aircraft, tracked through the sixteen milestones with an operational status."}}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": false}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": false}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": false}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": true}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": false}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": false}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": true}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": false}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": true}]}, {"id": "g139", "task": "precision", "model": "m04", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "AtcFlightPlanActivation", "kind": "class", "content": {"name": "AtcFlightPlanActivation", "stereotype": "control", "package": "Milestones", "definition": "The milestone at which the ATC Flight Plan is submitted and the Airport CDM Platform is initiated for the flight."}, "class": null}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": true}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": true}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": true}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g140", "task": "precision", "model": "m17", "milestone": 16, "milestone_name": "Take Off", "element": {"path": "Milestone->Flight [association]", "kind": "relationship", "content": {"type": "association", "source": "Milestone", "target": "Flight", "label": "applies to", "source_multiplicity": "1", "target_multiplicity": "1..*"}, "class": null}, "sentences": [{"id": "M16.definition.1", "field": "Definition", "text": "ATOT - Actual Take Off Time.", "hl": false}, {"id": "M16.definition.2", "field": "Definition", "text": "This is the time that an aircraft takes off from the runway.", "hl": false}, {"id": "M16.definition.3", "field": "Definition", "text": "(Equivalent to ATC ATD-Actual Time of Departure, ACARS = OFF).", "hl": false}, {"id": "M16.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by ATC system or from ACARS equipped aircraft.", "hl": false}, {"id": "M16.timing.1", "field": "Timing", "text": "The information is directly available as soon as possible after occurrence of the milestone.", "hl": true}, {"id": "M16.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M16.effect.1", "field": "Effect", "text": "FSA and MVT messages are sent.", "hl": false}, {"id": "M16.procedures.1", "field": "Procedures", "text": "To inform all relevant Airport CDM Partners about the actual take off.", "hl": false}, {"id": "M16.procedures.2", "field": "Procedures", "text": "An airborne message is generated and the flight is removed from the departure sequence.", "hl": true}, {"id": "M16.procedures.3", "field": "Procedures", "text": "This process is triggered by Tower FDPS, A-SMGCS / Radar detection or ACARS.", "hl": false}, {"id": "M16.operational_status.1", "field": "Operational Status", "text": "DEPARTED / TAKE OFF", "hl": false}, {"id": "M16.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ATOT recorded", "hl": false}]}, {"id": "g141", "task": "precision", "model": "m01", "milestone": 10, "milestone_name": "TSAT Issued", "element": {"path": "Flight", "kind": "class", "content": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single flight (arrival or departure) that is tracked through the CDM milestones with its operational status and time quantities."}, "class": null}, "sentences": [{"id": "M10.definition.1", "field": "Definition", "text": "The time ATC issues the Target Start Up Approval Time", "hl": false}, {"id": "M10.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M10.timing.1", "field": "Timing", "text": "The information is provided t-minutes before EOBT, where t is a parameter agreed locally", "hl": false}, {"id": "M10.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M10.effect.1", "field": "Effect", "text": "The flight is stabilised into the pre-departure sequence.", "hl": true}, {"id": "M10.effect.2", "field": "Effect", "text": "The Aircraft Operator/ Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M10.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant partners of the TSAT that has been allocated to the flight.", "hl": false}, {"id": "M10.procedures.2", "field": "Procedures", "text": "The Network Operations is informed by a T-DPI-s for non regulated flights.", "hl": true}, {"id": "M10.procedures.3", "field": "Procedures", "text": "Second step: To check whether the number of TOBT updates exceeds a tolerance defined locally, after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.4", "field": "Procedures", "text": "First: The TSAT will indicate to the partners the time when the start up approval can be expected.", "hl": false}, {"id": "M10.procedures.5", "field": "Procedures", "text": "Network Operations will be informed with a T-DPI-s for non regulated flights.", "hl": true}, {"id": "M10.procedures.6", "field": "Procedures", "text": "No check is performed.", "hl": false}, {"id": "M10.procedures.7", "field": "Procedures", "text": "Second: A check shall be performed to see the number of TOBT updates after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.8", "field": "Procedures", "text": "In case the number of TOBT updates exceeds a threshold, then the TOBT input should be processed according to local procedure.", "hl": false}, {"id": "M10.procedures.9", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M10.procedures.10", "field": "Procedures", "text": "- A defined time (local parameter) before TOBT", "hl": false}, {"id": "M10.procedures.11", "field": "Procedures", "text": "- TOBT update after TSAT issue", "hl": false}, {"id": "M10.operational_status.1", "field": "Operational Status", "text": "SEQUENCED", "hl": false}, {"id": "M10.action_on_cdm.1", "field": "Action on CDM Operation", "text": "TTOT updated", "hl": false}]}, {"id": "g142", "task": "precision", "model": "m05", "milestone": 8, "milestone_name": "Ground Handling Started", "element": {"path": "Flight.groundHandlingTime", "kind": "attribute", "content": {"name": "groundHandlingTime", "type": "GroundHandlingTime", "description": "The flight's ACGT."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "An arriving or departing flight leg of a turn-round, tracked through the milestones with its operational status and time quantities."}}, "sentences": [{"id": "M8.definition.1", "field": "Definition", "text": "Commence of Ground Handling Operations (ACGT).", "hl": true}, {"id": "M8.definition.2", "field": "Definition", "text": "Note: this milestone is specific to flights that are the first operation of the day or that have been long term parked.", "hl": false}, {"id": "M8.definition.3", "field": "Definition", "text": "For flights that are on a normal turn-round ACGT is considered to commence at AIBT.", "hl": true}, {"id": "M8.origin_and_priority.1", "field": "Origin and priority", "text": "Aircraft Operator / Ground Handler will provide the information.", "hl": false}, {"id": "M8.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M8.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M8.effect.1", "field": "Effect", "text": "The occurrence of ACGT triggers an update of downstream estimates: TOBT is updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the estimated turn-round period for the departing flight.", "hl": false}, {"id": "M8.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M8.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M8.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M8.procedures.6", "field": "Procedures", "text": "- Actual Commence of Ground Handling: ACGT", "hl": true}, {"id": "M8.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M8.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETTT/TOBT, TTOT updated", "hl": false}]}, {"id": "g143", "task": "precision", "model": "m13", "milestone": 14, "milestone_name": "Start Up Approved", "element": {"path": "AirportCDMPlatform->Milestone [association]", "kind": "relationship", "content": {"type": "association", "source": "AirportCDMPlatform", "target": "Milestone", "label": "executes", "source_multiplicity": "1", "target_multiplicity": "*"}, "class": null}, "sentences": [{"id": "M14.definition.1", "field": "Definition", "text": "ASAT - Actual start up Approval Time.", "hl": false}, {"id": "M14.definition.2", "field": "Definition", "text": "This is the time that an aircraft receives its start up approval.", "hl": false}, {"id": "M14.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M14.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": true}, {"id": "M14.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M14.effect.1", "field": "Effect", "text": "On receipt of ATC approval, the aircraft will start up, push back and start to taxi.", "hl": false}, {"id": "M14.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual start up approval Time (ASAT) in the Airport CDM Platform and that the aircraft has received start up approval / push-back clearance.", "hl": true}, {"id": "M14.procedures.2", "field": "Procedures", "text": "Second step: To check if ASAT is in accordance to TSAT and to alert all relevant Airport CDM Partners when no start up has been granted.", "hl": true}, {"id": "M14.procedures.3", "field": "Procedures", "text": "Inform of ASAT when it occurs.", "hl": false}, {"id": "M14.procedures.4", "field": "Procedures", "text": "In case the start up approval is not granted at TSAT + tolerance, all relevant partners should be informed.", "hl": false}, {"id": "M14.procedures.5", "field": "Procedures", "text": "The flight will be re-sequenced.", "hl": false}, {"id": "M14.procedures.6", "field": "Procedures", "text": "Start up request by flight crew (voice or DCL) or a locally defined time around TSAT if Milestone Process 13 is omitted.", "hl": false}, {"id": "M14.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M14.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g144", "task": "precision", "model": "m14", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "EtfmsSystem", "kind": "class", "content": {"name": "EtfmsSystem", "stereotype": "boundary", "package": "Systems", "definition": "The Network Operations system (ETFMS) that monitors a flight's progress within three hours of the destination and sends Flight Update Messages."}, "class": null}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": false}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": false}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": true}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": false}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": true}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": true}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": false}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": false}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g145", "task": "precision", "model": "m12", "milestone": 12, "milestone_name": "Aircraft Ready", "element": {"path": "Flight.ardt", "kind": "attribute", "content": {"name": "ardt", "type": "DateTime", "description": "Actual Ready Time, when the aircraft is ready to taxi."}, "class": {"name": "Flight", "stereotype": "entity", "package": "CDMCore", "definition": "An individual arriving or departing flight tracked through its operational milestones on the Airport CDM Platform."}}, "sentences": [{"id": "M12.definition.1", "field": "Definition", "text": "The time when all doors are closed, boarding bridge removed, push back vehicle connected, ready to taxi immediately upon reception of TWR instructions (ARDT).", "hl": true}, {"id": "M12.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by the Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M12.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M12.data_quality.1", "field": "Data Quality", "text": "Data is directly available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M12.effect.1", "field": "Effect", "text": "ATC refines the pre-departure sequence.", "hl": false}, {"id": "M12.effect.2", "field": "Effect", "text": "The pilot requests start up just before TSAT, following coordination with the Ground Handler.", "hl": false}, {"id": "M12.effect.3", "field": "Effect", "text": "(Dispatcher / Supervisor / Redcap).", "hl": false}, {"id": "M12.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Ready Time (ARDT) in the Airport CDM Platform and that the aircraft is ready for start up / push-back.", "hl": true}, {"id": "M12.procedures.2", "field": "Procedures", "text": "Second step: To inform the AO/GH that TOBT has passed and the Airport CDM Platform has not yet received ARDT or Ready Status (RDY).", "hl": false}, {"id": "M12.procedures.3", "field": "Procedures", "text": "Inform of ARDT or RDY confirming that the flight follows the indicated TOBT.", "hl": true}, {"id": "M12.procedures.4", "field": "Procedures", "text": "At TOBT + tolerance the AO/GH are informed that TOBT has passed and there has not been a ready status message yet.", "hl": false}, {"id": "M12.procedures.5", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M12.procedures.6", "field": "Procedures", "text": "- an input to the Airport CDM Platform.", "hl": false}, {"id": "M12.operational_status.1", "field": "Operational Status", "text": "READY", "hl": false}, {"id": "M12.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g146", "task": "precision", "model": "m12", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "DpiMessage.timestamp", "kind": "attribute", "content": {"name": "timestamp", "type": "DateTime", "description": "Time the DPI message was generated/sent."}, "class": {"name": "DpiMessage", "stereotype": "entity", "package": "Messaging", "definition": "A Departure Planning Information message exchanged between the Airport CDM Platform and Network Operations to communicate updated take-off time estimates."}}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": true}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": false}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": true}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": false}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": false}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": true}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": false}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": false}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g147", "task": "precision", "model": "m07", "milestone": 6, "milestone_name": "Landed", "element": {"path": "TobtCheckMilestone.informNetworkOperationsOfTtotChange()", "kind": "operation", "content": {"signature": "informNetworkOperationsOfTtotChange(newTtot: DateTime, tolerance: Duration): void", "description": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance (milestones 4-9)."}, "class": {"name": "TobtCheckMilestone", "stereotype": "control", "package": "Milestones", "definition": "The common TOBT-feasibility check and TTOT-tolerance notification performed at each milestone from Local Radar Update through Final Confirmation of the TOBT: verify that TOBT is consistent with the ATC Flight Plan and inform Network Operations when TTOT changes by more than the agreed tolerance."}}, "sentences": [{"id": "M6.definition.1", "field": "Definition", "text": "ALDT - Actual Landing Time.", "hl": false}, {"id": "M6.definition.2", "field": "Definition", "text": "This is the time that an aircraft touches down on a runway.", "hl": false}, {"id": "M6.definition.3", "field": "Definition", "text": "(Equivalent to ATC ATA - Actual Time of Arrival landing, ACARS=ON).", "hl": false}, {"id": "M6.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by ATC system or by ACARS from equipped aircraft.", "hl": false}, {"id": "M6.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M6.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M6.effect.1", "field": "Effect", "text": "The occurrence of ALDT triggers an update of downstream estimates: TOBT and TTOT are updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the defined turn-round period for the departing flight.", "hl": false}, {"id": "M6.effect.2", "field": "Effect", "text": "The EIBT can be updated according to the ALDT +EXIT.", "hl": false}, {"id": "M6.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M6.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": true}, {"id": "M6.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M6.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": true}, {"id": "M6.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M6.procedures.6", "field": "Procedures", "text": "- Actual Landing Time: ALDT", "hl": false}, {"id": "M6.operational_status.1", "field": "Operational Status", "text": "LANDED", "hl": false}, {"id": "M6.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT changes to ALDT, EIBT, TOBT and TTOT updated", "hl": true}]}, {"id": "g148", "task": "precision", "model": "m02", "milestone": 8, "milestone_name": "Ground Handling Started", "element": {"path": "Flight.estimatedTurnRoundTime", "kind": "attribute", "content": {"name": "estimatedTurnRoundTime", "type": "DurationEstimate", "description": "The Estimated Turn-round Time (ETTT) used to update TOBT after ground handling starts (milestone 8)."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single arriving or departing operation of an aircraft, tracked through the sixteen milestones and carrying an operational status."}}, "sentences": [{"id": "M8.definition.1", "field": "Definition", "text": "Commence of Ground Handling Operations (ACGT).", "hl": false}, {"id": "M8.definition.2", "field": "Definition", "text": "Note: this milestone is specific to flights that are the first operation of the day or that have been long term parked.", "hl": false}, {"id": "M8.definition.3", "field": "Definition", "text": "For flights that are on a normal turn-round ACGT is considered to commence at AIBT.", "hl": true}, {"id": "M8.origin_and_priority.1", "field": "Origin and priority", "text": "Aircraft Operator / Ground Handler will provide the information.", "hl": false}, {"id": "M8.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M8.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M8.effect.1", "field": "Effect", "text": "The occurrence of ACGT triggers an update of downstream estimates: TOBT is updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the estimated turn-round period for the departing flight.", "hl": true}, {"id": "M8.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M8.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M8.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M8.procedures.6", "field": "Procedures", "text": "- Actual Commence of Ground Handling: ACGT", "hl": false}, {"id": "M8.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M8.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETTT/TOBT, TTOT updated", "hl": true}]}, {"id": "g149", "task": "precision", "model": "m08", "milestone": 12, "milestone_name": "Aircraft Ready", "element": {"path": "AirportCDMPlatform.notifyPartners()", "kind": "operation", "content": {"signature": "notifyPartners(flight: Flight, message: String): void", "description": "Informs all relevant Airport CDM Partners of an actual time or status change (e.g., ASBT, ARDT, ASRT, ASAT, AOBT)."}, "class": {"name": "AirportCDMPlatform", "stereotype": "control", "package": "CDM Process", "definition": "The central Airport Collaborative Decision Making system that is initiated for each flight, processes information and executes the milestone procedures."}}, "sentences": [{"id": "M12.definition.1", "field": "Definition", "text": "The time when all doors are closed, boarding bridge removed, push back vehicle connected, ready to taxi immediately upon reception of TWR instructions (ARDT).", "hl": false}, {"id": "M12.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by the Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M12.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M12.data_quality.1", "field": "Data Quality", "text": "Data is directly available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M12.effect.1", "field": "Effect", "text": "ATC refines the pre-departure sequence.", "hl": false}, {"id": "M12.effect.2", "field": "Effect", "text": "The pilot requests start up just before TSAT, following coordination with the Ground Handler.", "hl": false}, {"id": "M12.effect.3", "field": "Effect", "text": "(Dispatcher / Supervisor / Redcap).", "hl": false}, {"id": "M12.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Ready Time (ARDT) in the Airport CDM Platform and that the aircraft is ready for start up / push-back.", "hl": true}, {"id": "M12.procedures.2", "field": "Procedures", "text": "Second step: To inform the AO/GH that TOBT has passed and the Airport CDM Platform has not yet received ARDT or Ready Status (RDY).", "hl": true}, {"id": "M12.procedures.3", "field": "Procedures", "text": "Inform of ARDT or RDY confirming that the flight follows the indicated TOBT.", "hl": true}, {"id": "M12.procedures.4", "field": "Procedures", "text": "At TOBT + tolerance the AO/GH are informed that TOBT has passed and there has not been a ready status message yet.", "hl": false}, {"id": "M12.procedures.5", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M12.procedures.6", "field": "Procedures", "text": "- an input to the Airport CDM Platform.", "hl": false}, {"id": "M12.operational_status.1", "field": "Operational Status", "text": "READY", "hl": false}, {"id": "M12.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g150", "task": "precision", "model": "m01", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "TimeQuantity.calculateEldtFromAtot()", "kind": "operation", "content": {"signature": "calculateEldtFromAtot(atot: TimeQuantity, estimatedElapsedTime: Duration): DateTime", "description": "Using the ATOT, ELDT is calculated using the Estimated Elapsed Time on the FPL (M3)."}, "class": {"name": "TimeQuantity", "stereotype": "entity", "package": "Timings", "definition": "A single dated value of a named time quantity (identified by prefix and event) for a flight, recorded with its originator, accuracy and update time; every successive value is kept rather than overwritten."}}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": true}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": false}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": false}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": true}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": false}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": false}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": false}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": false}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": true}]}, {"id": "g151", "task": "precision", "model": "m04", "milestone": 15, "milestone_name": "Off-Block", "element": {"path": "NetworkOperations->AirportCdmPartner [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "NetworkOperations", "target": "AirportCdmPartner", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M15.definition.1", "field": "Definition", "text": "AOBT - Actual Off-Block Time.", "hl": false}, {"id": "M15.definition.2", "field": "Definition", "text": "The time the aircraft pushes back/vacates the parking position (Equivalent to Airline/Handler ATD - Actual Time of Departure ACARS=OUT).", "hl": false}, {"id": "M15.origin_and_priority.1", "field": "Origin and priority", "text": "ACARS equipped aircraft or automated docking systems or ATC systems (e.g. A-SMGCS) or by manual input.", "hl": false}, {"id": "M15.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M15.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M15.effect.1", "field": "Effect", "text": "TTOT updated considering the EXOT.", "hl": false}, {"id": "M15.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Off-Block Time (AOBT) in the Airport CDM Platform and that the aircraft has commenced push-back / taxi from parking position.", "hl": true}, {"id": "M15.procedures.2", "field": "Procedures", "text": "Second step: To check if TTOT changes by more than the agreed tolerance and inform Network Operations.", "hl": true}, {"id": "M15.procedures.3", "field": "Procedures", "text": "Inform of AOBT when it occurs.", "hl": false}, {"id": "M15.procedures.4", "field": "Procedures", "text": "AOBT always triggers an A-DPI message to Network Operations or in the case of remote holding at a defined time prior to TTOT.", "hl": true}, {"id": "M15.procedures.5", "field": "Procedures", "text": "After a first A-DPI is sent this check shall be performed to check TTOT updates against the TTOT tolerance before Network Operations is informed, with a new A-DPI, of the updated TTOT.", "hl": false}, {"id": "M15.procedures.6", "field": "Procedures", "text": "This process is triggered by AOBT detection.", "hl": false}, {"id": "M15.operational_status.1", "field": "Operational Status", "text": "OFF-BLOCK", "hl": false}, {"id": "M15.action_on_cdm.1", "field": "Action on CDM Operation", "text": "AOBT recorded", "hl": false}]}, {"id": "g152", "task": "precision", "model": "m00", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "Flight.direction", "kind": "attribute", "content": {"name": "direction", "type": "String", "description": "Whether the flight is an arrival or a departure within its turn-round."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "An arriving or departing flight tracked through the CDM process from ATC Flight Plan activation to take-off."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": true}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": true}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": true}]}, {"id": "g153", "task": "precision", "model": "m09", "milestone": 12, "milestone_name": "Aircraft Ready", "element": {"path": "AircraftReadyMilestone->Milestone [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "AircraftReadyMilestone", "target": "Milestone", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M12.definition.1", "field": "Definition", "text": "The time when all doors are closed, boarding bridge removed, push back vehicle connected, ready to taxi immediately upon reception of TWR instructions (ARDT).", "hl": false}, {"id": "M12.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by the Aircraft Operator/ Ground Handler.", "hl": true}, {"id": "M12.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": true}, {"id": "M12.data_quality.1", "field": "Data Quality", "text": "Data is directly available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M12.effect.1", "field": "Effect", "text": "ATC refines the pre-departure sequence.", "hl": false}, {"id": "M12.effect.2", "field": "Effect", "text": "The pilot requests start up just before TSAT, following coordination with the Ground Handler.", "hl": false}, {"id": "M12.effect.3", "field": "Effect", "text": "(Dispatcher / Supervisor / Redcap).", "hl": false}, {"id": "M12.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Ready Time (ARDT) in the Airport CDM Platform and that the aircraft is ready for start up / push-back.", "hl": false}, {"id": "M12.procedures.2", "field": "Procedures", "text": "Second step: To inform the AO/GH that TOBT has passed and the Airport CDM Platform has not yet received ARDT or Ready Status (RDY).", "hl": false}, {"id": "M12.procedures.3", "field": "Procedures", "text": "Inform of ARDT or RDY confirming that the flight follows the indicated TOBT.", "hl": false}, {"id": "M12.procedures.4", "field": "Procedures", "text": "At TOBT + tolerance the AO/GH are informed that TOBT has passed and there has not been a ready status message yet.", "hl": false}, {"id": "M12.procedures.5", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M12.procedures.6", "field": "Procedures", "text": "- an input to the Airport CDM Platform.", "hl": false}, {"id": "M12.operational_status.1", "field": "Operational Status", "text": "READY", "hl": true}, {"id": "M12.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g154", "task": "precision", "model": "m13", "milestone": 2, "milestone_name": "EOBT - 2 hr", "element": {"path": "ELDT", "kind": "class", "content": {"name": "ELDT", "stereotype": "entity", "package": "Timings", "definition": "Estimated Landing Time, updated at flight-plan activation, EOBT-2h, take-off, radar detection and final approach."}, "class": null}, "sentences": [{"id": "M2.definition.1", "field": "Definition", "text": "At EOBT-2 hr most flights will be known in the Airport CDM Platform including if they are regulated or not.", "hl": false}, {"id": "M2.definition.2", "field": "Definition", "text": "All regulated flights receive a CTOT from Network Operations.", "hl": false}, {"id": "M2.origin_and_priority.1", "field": "Origin and priority", "text": "The CTOT is issued by the Network Operations and is sent to relevant ATS units as well as the departure aerodrome.", "hl": false}, {"id": "M2.origin_and_priority.2", "field": "Origin and priority", "text": "CTOT flights usually have a priority over unregulated flights.", "hl": false}, {"id": "M2.timing.1", "field": "Timing", "text": "If the flight is regulated, a CTOT is issued at EOBT-2h.", "hl": true}, {"id": "M2.data_quality.1", "field": "Data Quality", "text": "Not applicable.", "hl": false}, {"id": "M2.effect.1", "field": "Effect", "text": "For inbound flights, ELDT is updated based on information provided by the FUM messages, taking into account the actual progress of the flight.", "hl": false}, {"id": "M2.procedures.1", "field": "Procedures", "text": "To check (before or after take off from outstation) whether AO/GH flight estimates are consistent with the ATC Flight Plan and to inform Network Operations about the updated take off time estimate, using a T-DPI Message.", "hl": false}, {"id": "M2.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan estimated off block time at EOBT-2 hrs.", "hl": true}, {"id": "M2.procedures.3", "field": "Procedures", "text": "At EOBT-2 hrs Network Operations is informed through the first T-DPI message.", "hl": false}, {"id": "M2.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT, if later than EOBT+EXOT.", "hl": false}, {"id": "M2.procedures.5", "field": "Procedures", "text": "In the case of manual input of TOBT, this estimate will override the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M2.procedures.6", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M2.procedures.7", "field": "Procedures", "text": "- a time stamp, at EOBT - 2h.", "hl": true}, {"id": "M2.operational_status.1", "field": "Operational Status", "text": "N. A.", "hl": false}, {"id": "M2.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETOT/TTOT/CTOT Mark appropriate fields as REGULATED", "hl": false}]}, {"id": "g155", "task": "precision", "model": "m09", "milestone": 15, "milestone_name": "Off-Block", "element": {"path": "TimeQuantity.recordedAt", "kind": "attribute", "content": {"name": "recordedAt", "type": "DateTime", "description": "The time this value was recorded; updates append a new value rather than overwrite so a turn-round can be analysed afterwards."}, "class": {"name": "TimeQuantity", "stereotype": "entity", "package": "Timings", "definition": "A time value describing a flight's progress, named by a prefix (Scheduled, Estimated, Target, Actual, Calculated) and an event, keeping every successive value with its originator and time of update."}}, "sentences": [{"id": "M15.definition.1", "field": "Definition", "text": "AOBT - Actual Off-Block Time.", "hl": false}, {"id": "M15.definition.2", "field": "Definition", "text": "The time the aircraft pushes back/vacates the parking position (Equivalent to Airline/Handler ATD - Actual Time of Departure ACARS=OUT).", "hl": false}, {"id": "M15.origin_and_priority.1", "field": "Origin and priority", "text": "ACARS equipped aircraft or automated docking systems or ATC systems (e.g. A-SMGCS) or by manual input.", "hl": false}, {"id": "M15.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M15.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M15.effect.1", "field": "Effect", "text": "TTOT updated considering the EXOT.", "hl": false}, {"id": "M15.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Off-Block Time (AOBT) in the Airport CDM Platform and that the aircraft has commenced push-back / taxi from parking position.", "hl": false}, {"id": "M15.procedures.2", "field": "Procedures", "text": "Second step: To check if TTOT changes by more than the agreed tolerance and inform Network Operations.", "hl": true}, {"id": "M15.procedures.3", "field": "Procedures", "text": "Inform of AOBT when it occurs.", "hl": false}, {"id": "M15.procedures.4", "field": "Procedures", "text": "AOBT always triggers an A-DPI message to Network Operations or in the case of remote holding at a defined time prior to TTOT.", "hl": false}, {"id": "M15.procedures.5", "field": "Procedures", "text": "After a first A-DPI is sent this check shall be performed to check TTOT updates against the TTOT tolerance before Network Operations is informed, with a new A-DPI, of the updated TTOT.", "hl": true}, {"id": "M15.procedures.6", "field": "Procedures", "text": "This process is triggered by AOBT detection.", "hl": false}, {"id": "M15.operational_status.1", "field": "Operational Status", "text": "OFF-BLOCK", "hl": false}, {"id": "M15.action_on_cdm.1", "field": "Action on CDM Operation", "text": "AOBT recorded", "hl": true}]}, {"id": "g156", "task": "precision", "model": "m00", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "TimeQuantity.calculateEIBT()", "kind": "operation", "content": {"signature": "calculateEIBT(eldt: DateTime, exit: Duration): DateTime", "description": "EIBT is computed using ELDT (or ALDT) and the estimated/actual taxi-in time (EXIT)."}, "class": {"name": "TimeQuantity", "stereotype": "entity", "package": "Timings", "definition": "A named time quantity (prefixed Scheduled, Estimated, Target, Actual, or Calculated, for an event such as Off-Block, In-Block, Landing, or Take-Off) that describes a flight's progress, with its origin, accuracy, and tolerance; every successive value is kept, an update appends rather than overwrites."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": true}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": true}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": false}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": true}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": false}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g157", "task": "precision", "model": "m11", "milestone": 2, "milestone_name": "EOBT - 2 hr", "element": {"path": "Flight.ctot", "kind": "attribute", "content": {"name": "ctot", "type": "DateTime", "description": "Calculated Take-Off Time issued by Network Operations for regulated flights at EOBT-2h."}, "class": {"name": "Flight", "stereotype": "entity", "package": "FlightData", "definition": "A single flight (arrival or departure leg) tracked through the CDM milestone process with all its estimated and actual times."}}, "sentences": [{"id": "M2.definition.1", "field": "Definition", "text": "At EOBT-2 hr most flights will be known in the Airport CDM Platform including if they are regulated or not.", "hl": false}, {"id": "M2.definition.2", "field": "Definition", "text": "All regulated flights receive a CTOT from Network Operations.", "hl": true}, {"id": "M2.origin_and_priority.1", "field": "Origin and priority", "text": "The CTOT is issued by the Network Operations and is sent to relevant ATS units as well as the departure aerodrome.", "hl": false}, {"id": "M2.origin_and_priority.2", "field": "Origin and priority", "text": "CTOT flights usually have a priority over unregulated flights.", "hl": element": {"path": "Milestone.resultingStatus", "kind": "attribute", "content": {"name": "resultingStatus", "type": "FlightOperationalStatus", "description": "The operational status the flight changes to when this milestone occurs."}, "class": {"name": "Milestone", "stereotype": "control", "package": "Milestones", "definition": "An abstract representation of one of the sixteen defined events in the CDM process, each with its own trigger, timing rule, effect and procedure."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": false}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": true}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": true}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": true}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": false}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g159", "task": "precision", "model": "m03", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "Flight.destinationAerodrome", "kind": "attribute", "content": {"name": "destinationAerodrome", "type": "String", "description": "ICAO destination aerodrome."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single flight leg (arrival or departure) tracked through the CDM process from flight plan activation to take-off."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": true}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": true}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": true}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g160", "task": "precision", "model": "m06", "milestone": 8, "milestone_name": "Ground Handling Started", "element": {"path": "Flight.tobt", "kind": "attribute", "content": {"name": "tobt", "type": "TargetTime", "description": "Target Off-Block Time, entered by AO/GH or calculated automatically, updated at multiple milestones."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "An arriving or departing flight tracked through the CDM process, carrying its operational status and time quantities."}}, "sentences": [{"id": "M8.definition.1", "field": "Definition", "text": "Commence of Ground Handling Operations (ACGT).", "hl": false}, {"id": "M8.definition.2", "field": "Definition", "text": "Note: this milestone is specific to flights that are the first operation of the day or that have been long term parked.", "hl": false}, {"id": "M8.definition.3", "field": "Definition", "text": "For flights that are on a normal turn-round ACGT is considered to commence at AIBT.", "hl": false}, {"id": "M8.origin_and_priority.1", "field": "Origin and priority", "text": "Aircraft Operator / Ground Handler will provide the information.", "hl": false}, {"id": "M8.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M8.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M8.effect.1", "field": "Effect", "text": "The occurrence of ACGT triggers an update of downstream estimates: TOBT is updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the estimated turn-round period for the departing flight.", "hl": true}, {"id": "M8.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M8.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M8.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M8.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M8.procedures.6", "field": "Procedures", "text": "- Actual Commence of Ground Handling: ACGT", "hl": false}, {"id": "M8.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M8.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETTT/TOBT, TTOT updated", "hl": true}]}, {"id": "g161", "task": "precision", "model": "m16", "milestone": 16, "milestone_name": "Take Off", "element": {"path": "ACARS->Flight [dependency]", "kind": "relationship", "content": {"type": "dependency", "source": "ACARS", "target": "Flight", "label": "reports times for", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M16.definition.1", "field": "Definition", "text": "ATOT - Actual Take Off Time.", "hl": false}, {"id": "M16.definition.2", "field": "Definition", "text": "This is the time that an aircraft takes off from the runway.", "hl": false}, {"id": "M16.definition.3", "field": "Definition", "text": "(Equivalent to ATC ATD-Actual Time of Departure, ACARS = OFF).", "hl": true}, {"id": "M16.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by ATC system or from ACARS equipped aircraft.", "hl": true}, {"id": "M16.timing.1", "field": "Timing", "text": "The information is directly available as soon as possible after occurrence of the milestone.", "hl": false}, {"id": "M16.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M16.effect.1", "field": "Effect", "text": "FSA and MVT messages are sent.", "hl": false}, {"id": "M16.procedures.1", "field": "Procedures", "text": "To inform all relevant Airport CDM Partners about the actual take off.", "hl": false}, {"id": "M16.procedures.2", "field": "Procedures", "text": "An airborne message is generated and the flight is removed from the departure sequence.", "hl": false}, {"id": "M16.procedures.3", "field": "Procedures", "text": "This process is triggered by Tower FDPS, A-SMGCS / Radar detection or ACARS.", "hl": true}, {"id": "M16.operational_status.1", "field": "Operational Status", "text": "DEPARTED / TAKE OFF", "hl": false}, {"id": "M16.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ATOT recorded", "hl": false}]}, {"id": "g162", "task": "precision", "model": "m14", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "AirportCDMPlatform.initiateForFlight()", "kind": "operation", "content": {"signature": "initiateForFlight(flight: Flight): void", "description": "The Airport CDM Platform is initiated for this flight, and all available information is processed (milestone 1)."}, "class": {"name": "AirportCDMPlatform", "stereotype": "control", "package": "Systems", "definition": "The central Airport CDM system that processes flight information, performs the consistency checks and calculations of each milestone, and triggers CDM Operation actions."
