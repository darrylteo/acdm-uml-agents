<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grading: precision sample</title>
<style>
:root{--bg:#fafafa;--ink:#222;--muted:#666;--line:#ddd;--sel:#1a73e8;--hl:#fff3b0;--ok:#2e7d32;--font:"Segoe UI",Arial,sans-serif;--mono:Consolas,monospace}
body{margin:0;font:13.5px/1.45 var(--font);color:var(--ink);background:var(--bg)}
#top{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
#top b{font-size:14px} .muted{color:var(--muted)} #top button,#top input{font:inherit;padding:3px 10px}
#progress{flex:1;min-width:140px;height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden}#progress div{height:100%;background:var(--ok);width:0}
#wrap{display:grid;grid-template-columns:1fr 1.4fr;height:calc(100vh - 46px)}
.pane{overflow:auto;padding:14px 18px}.pane.left{border-right:1px solid var(--line);background:#fff}
h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.passage{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.passage .f{color:var(--muted);font-weight:600;margin-top:8px;font-size:12px}
.passage .s{display:block;padding:2px 0;color:#555}.passage .s.hl{background:var(--hl);color:var(--ink);font-weight:600;padding:4px 6px;border-radius:4px}
.q{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--sel);padding:12px 0 6px;margin-top:14px}
.q p{margin:0 0 8px;font-weight:600}
.grades button{font:inherit;padding:8px 14px;margin-right:6px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;text-align:left}
.grades button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.grades small{display:block;font-weight:400;color:var(--muted)}.grades button.on small{color:#e3ecff}
.note{width:100%;box-sizing:border-box;margin-top:8px;padding:6px;border:1px solid var(--line);border-radius:4px;font:inherit}
.cand{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;display:grid;grid-template-columns:18px 1fr;gap:8px;cursor:pointer}
.cand.ticked{background:#e8f0fe;border-color:var(--sel)} .cand code{font:12.5px var(--mono)} .cand .d{color:var(--muted);font-size:12.5px}
.k{font-size:10.5px;color:#fff;border-radius:3px;padding:0 4px;margin-right:6px}
.k.attribute{background:#2e7d32}.k.operation{background:#1565c0}.k.relationship{background:#6d4c41}.k.class{background:#7a3e9d}.k.enumeration{background:#9c6b00}
.filter{width:100%;box-sizing:border-box;padding:6px;border:1px solid var(--line);border-radius:4px;margin:10px 0 8px;font:inherit}
.tree .cls{border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:6px}
.tree .hd{display:flex;gap:8px;align-items:center;padding:6px 10px;cursor:pointer}.tree .hd .pk{color:var(--muted)}.tree .hd .st{color:#7a3e9d}.tree .hd .nm{font-weight:600}
.tree .body{display:none;padding:2px 10px 8px 28px;border-top:1px dashed var(--line)}.cls.open .body{display:block}
.tree .def{color:var(--muted);font-style:italic;margin:4px 0 6px}
.mem{display:grid;grid-template-columns:18px 1fr;gap:6px;padding:3px 0;align-items:start;cursor:pointer}.mem.ticked,.hd.ticked{background:#e8f0fe;border-radius:4px}
.mem code{font:12.5px var(--mono)}.mem .d{color:var(--muted);font-size:12.5px}
.el{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.keys{font-size:12px;color:var(--muted)}
details.help{margin-bottom:10px}details.help summary{cursor:pointer;color:var(--sel)}details.help p{margin:6px 0}
</style>
</head>

eld": "Timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "hl": false}, {"id": "M4.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M4.effect.1", "field": "Effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "hl": false}, {"id": "M4.effect.2", "field": "Effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "hl": false}, {"id": "M4.effect.3", "field": "Effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "hl": false}, {"id": "M4.effect.4", "field": "Effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "hl": false}, {"id": "M4.effect.5", "field": "Effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "hl": false}, {"id": "M4.effect.6", "field": "Effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.", "hl": true}, {"id": "M4.effect.7", "field": "Effect", "text": "Decisions such as the turn-round period, connecting passengers etc are taken and need to be stable at this event.", "hl": false}, {"id": "M4.effect.8", "field": "Effect", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "hl": false}, {"id": "M4.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Fl om Outstation", "element": {"path": "M3TakeOffFromOutstation->Milestone [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "M3TakeOffFromOutstation", "target": "Milestone", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": true}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": true}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": false}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": false}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": false}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": false}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": false}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": true}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g006", "task": "precision", "model": "m09", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "ETFMS", "kind": "class", "content": {"name": "ETFMS", "stereotype": "boundary", "package": "Systems", "definition": "The Network Operations system used to monitor a flight's progress and send Flight Update Messages."}, "class": null}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": false}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": false}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": true}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": false}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": true}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": true}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": false}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": false}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g007", "task": "precision", "model": "m17", "milestone": 14, "milestone_name": "Start Up Approved", "element": {"path": "Milestone->Flight [association]", "kind": "relationship", "content": {"type": "association", "source": "Milestone", "target": "Flight", "label": "applies to", "source_multiplicity": "1", "target_multiplicity": "1..*"}, "class": null}, "sentences": [{"id": "M14.definition.1", "field": "Definition", "text": "ASAT - Actual start up Approval Time.", "hl": false}, {"id": "M14.definition.2", "field": "Definition", "text": "This is the time that an aircraft receives its start up approval.", "hl": false}, {"id": "M14.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M14.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": true}, {"id": "M14.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M14.effect.1", "field": "Effect", "text": "On receipt of ATC approval, the aircraft will start up, push back and start to taxi.", "hl": false}, {"id": "M14.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual start up approval Time (ASAT) in the Airport CDM Platform and that the aircraft has received start up approval / push-back clearance.", "hl": false}, {"id": "M14.procedures.2", "field": "Procedures", "text": "Second step: To check if ASAT is in accordance to TSAT and to alert all relevant Airport CDM Partners when no start up has been granted.", "hl": false}, {"id": "M14.procedures.3", "field": "Procedures", "text": "Inform of ASAT when it occurs.", "hl": false}, {"id": "M14.procedures.4", "field": "Procedures", "text": "In case the start up approval is not granted at TSAT + tolerance, all relevant partners should be informed.", "hl": false}, {"id": "M14.procedures.5", "field": "Procedures", "text": "The flight will be re-sequenced.", "hl": true}, {"id": "M14.procedures.6", "field": "Procedures", "text": "Start up request by flight crew (voice or DCL) or a locally defined time around TSAT if Milestone Process 13 is omitted.", "hl": true}, {"id": "M14.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M14.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g008", "task": "precision", "model": "m12", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "Flight.eobt", "kind": "attribute", "content": {"name": "eobt", "type": "DateTime", "description": "Estimated Off-Block Time."}, "class": {"name": "Flight", "stereotype": "entity", "package": "CDMCore", "definition": "An individual arriving or departing flight tracked through its operational milestones on the Airport CDM Platform."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": true}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": true}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": true}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g009", "task": "precision", "model": "m03", "milestone": 13, "milestone_name": "Start Up Requested", "element": {"path": "Stakeholder.role", "kind": "attribute", "content": {"name": "role", "type": "String", "description": "The role this stakeholder plays in the CDM process."}, "class": {"name": "Stakeholder", "stereotype": "entity", "package": "Stakeholders", "definition": "An abstract party that takes part in the CDM process and originates or receives its information."}}, "sentences": [{"id": "M13.definition.1", "field": "Definition", "text": "The time that start up is requested (ASRT).", "hl": false}, {"id": "M13.origin_and_priority.1", "field": "Origin and priority", "text": "ATC (based on pilot request).", "hl": false}, {"id": "M13.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M13.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M13.effect.1", "field": "Effect", "text": "ATC confirms TSAT to the pilot in order to maintain the aircraft in the pre-departure sequence.", "hl": false}, {"id": "M13.effect.2", "field": "Effect", "text": "Provided the aircraft was ready on time (ARDT), it is now up to ATC to assure that a regulated flight can respect its CTOT.", "hl": false}, {"id": "M13.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Start up Request Time (ASRT) in the Airport CDM Platform.", "hl": true}, {"id": "M13.procedures.2", "field": "Procedures", "text": "Second step: to alert all relevant Airport CDM Partners when no start up has been re-quested inside the locally agreed TSAT tolerance window.", "hl": true}, {"id": "M13.procedures.3", "field": "Procedures", "text": "Inform of ASRT when it occurs.", "hl": false}, {"id": "M13.procedures.4", "field": "Procedures", "text": "If the start up request is not made by TSAT + tolerance, the AO/GH is informed that no start up has been requested, and should update TOBT.", "hl": false}, {"id": "M13.procedures.5", "field": "Procedures", "text": "Timestamp when the tolerance window has passed at TSAT.", "hl": false}, {"id": "M13.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M13.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g010", "task": "precision", "model": "m06", "milestone": 15, "milestone_name": "Off-Block", "element": {"path": "NetworkOperations->CdmPartner [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "NetworkOperations", "target": "CdmPartner", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M15.definition.1", "field": "Definition", "text": "AOBT - Actual Off-Block Time.", "hl": false}, {"id": "M15.definition.2", "field": "Definition", "text": "The time the aircraft pushes back/vacates the parking position (Equivalent to Airline/Handler ATD - Actual Time of Departure ACARS=OUT).", "hl": false}, {"id": "M15.origin_and_priority.1", "field": "Origin and priority", "text": "ACARS equipped aircraft or automated docking systems or ATC systems (e.g. A-SMGCS) or by manual input.", "hl": false}, {"id": "M15.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M15.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M15.effect.1", "field": "Effect", "text": "TTOT updated considering the EXOT.", "hl": false}, {"id": "M15.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Off-Block Time (AOBT) in the Airport CDM Platform and that the aircraft has commenced push-back / taxi from parking position.", "hl": true}, {"id": "M15.procedures.2", "field": "Procedures", "text": "Second step: To check if TTOT changes by more than the agreed tolerance and inform Network Operations.", "hl": true}, {"id": "M15.procedures.3", "field": "Procedures", "text": "Inform of AOBT when it occurs.", "hl": false}, {"id": "M15.procedures.4", "field": "Procedures", "text": "AOBT always triggers an A-DPI message to Network Operations or in the case of remote holding at a defined time prior to TTOT.", "hl": true}, {"id": "M15.procedures.5", "field": "Procedures", "text": "After a first A-DPI is sent this check shall be performed to check TTOT updates against the TTOT tolerance before Network Operations is informed, with a new A-DPI, of the updated TTOT.", "hl": false}, {"id": "M15.procedures.6", "field": "Procedures", "text": "This process is triggered by AOBT detection.", "hl": false}, {"id": "M15.operational_status.1", "field": "Operational Status", "text": "OFF-BLOCK", "hl": false}, {"id": "M15.action_on_cdm.1", "field": "Action on CDM Operation", "text": "AOBT recorded", "hl": false}]}, {"id": "g011", "task": "precision", "model": "m16", "milestone": 7, "milestone_name": "In-Block", "element": {"path": "TimeQuantity.updateTime", "kind": "attribute", "content": {"name": "updateTime", "type": "DateTime", "description": "The time this value was recorded."}, "class": {"name": "TimeQuantity", "stereotype": "entity", "package": "Timings", "definition": "A time value describing a flight's progress, carrying its prefix, origin, accuracy, and update time; every successive value is kept rather than overwritten so a turn-round can be analysed afterwards."}}, "sentences": [{"id": "M7.definition.1", "field": "Definition", "text": "AIBT - Actual In-Block Time.", "hl": true}, {"id": "M7.definition.2", "field": "Definition", "text": "This is the time that an aircraft arrives in-blocks.", "hl": true}, {"id": "M7.definition.3", "field": "Definition", "text": "(Equivalent to Airline/Handler ATA - Actual Time of Arrival, ACARS = IN) Note: ACGT is considered to commence at AIBT", "hl": false}, {"id": "M7.origin_and_priority.1", "field": "Origin and priority", "text": "ACARS equipped aircraft or automated docking systems or ATC systems (e.g. A-SMGCS) or by manual input.", "hl": false}, {"id": "M7.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M7.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M7.effect.1", "field": "Effect", "text": "The occurrence of AIBT should trigger an update of downstream estimates: TOBT and TTOT are updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the estimated turn-round period for the departing flight.", "hl": false}, {"id": "M7.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M7.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M7.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M7.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M7.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M7.procedures.6", "field": "Procedures", "text": "- Actual In Blocks Time: AIBT", "hl": true}, {"id": "M7.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M7.action_on_cdm.1", "field": "Action on CDM Operation", "text": "EIBT changes to AIBT TOBT and TTOT updated", "hl": false}]}, {"id": "g012", "task": "precision", "model": "m16", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "DPIProcess->NetworkOperations [dependency]", "kind": "relationship", "content": {"type": "dependency", "source": "DPIProcess", "target": "NetworkOperations", "label": "sends messages to", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": true}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": true}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": true}]}, {"id": "g013", "task": "precision", "model": "m08", "milestone": 14, "milestone_name": "Start Up Approved", "element": {"path": "Flight.asat", "kind": "attribute", "content": {"name": "asat", "type": "DateTime", "description": "Actual Start-up Approval Time received from ATC."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flight Management", "definition": "An individual flight (arrival or departure leg) tracked through the Airport CDM Platform from flight-plan activation to take off."}}, "sentences": [{"id": "M14.definition.1", "field": "Definition", "text": "ASAT - Actual start up Approval Time.", "hl": true}, {"id": "M14.definition.2", "field": "Definition", "text": "This is the time that an aircraft receives its start up approval.", "hl": false}, {"id": "M14.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M14.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M14.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M14.effect.1", "field": "Effect", "text": "On receipt of ATC approval, the aircraft will start up, push back and start to taxi.", "hl": true}, {"id": "M14.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual start up approval Time (ASAT) in the Airport CDM Platform and that the aircraft has received start up approval / push-back clearance.", "hl": false}, {"id": "M14.procedures.2", "field": "Procedures", "text": "Second step: To check if ASAT is in accordance to TSAT and to alert all relevant Airport CDM Partners when no start up has been granted.", "hl": false}, {"id": "M14.procedures.3", "field": "Procedures", "text": "Inform of ASAT when it occurs.", "hl": true}, {"id": "M14.procedures.4", "field": "Procedures", "text": "In case the start up approval is not granted at TSAT + tolerance, all relevant partners should be informed.", "hl": false}, {"id": "M14.procedures.5", "field": "Procedures", "text": "The flight will be re-sequenced.", "hl": false}, {"id": "M14.procedures.6", "field": "Procedures", "text": "Start up request by flight crew (voice or DCL) or a locally defined time around TSAT if Milestone Process 13 is omitted.", "hl": false}, {"id": "M14.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M14.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g014", "task": "precision", "model": "m06", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "Flight.exit", "kind": "attribute", "content": {"name": "exit", "type": "Duration", "description": "Estimated taxi-in time used with ELDT to compute EIBT and, with ALDT, to update EIBT (Milestones 4, 6)."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "An arriving or departing flight tracked through the CDM process, carrying its operational status and time quantities."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": true}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": true}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": true}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g015", "task": "precision", "model": "m06", "milestone": 11, "milestone_name": "Boarding Starts", "element": {"path": "EventType", "kind": "enumeration", shall be performed to check the boarding status.", "hl": true}, {"id": "M11.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M11.procedures.6", "field": "Procedures", "text": "- a time variable <value> minutes before TOBT.", "hl": false}, {"id": "M11.operational_status.1", "field": "Operational Status", "text": "BOARDING", "hl": false}, {"id": "M11.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g016", "task": "precision", "model": "m04", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "FlightOperationalStatus", "kind": "enumeration", "content": {"name": "FlightOperationalStatus", "package": "Flights", "literals": ["INITIATED", "AIRBORNE", "FIR", "FINAL", "LANDED", "IN-BLOCK", "SEQUENCED", "BOARDING", "READY", "OFF-BLOCK", "DEPARTED/TAKE OFF"]}, "class": null}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": true}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": true}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shar er the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": true}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g017", "task": "precision", "model": "m14", "milestone": 10, "milestone_name": "TSAT Issued", "element": {"path": "Flight.tobt", "kind": "attribute", "content": {"name": "tobt", "type": "Tobt", "description": "The flight's Target Off-Block Time, provided and updated by the AO/GH and checked at every downstream milestone (milestones 2-13)."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single scheduled arrival or departure operation of an aircraft, tracked through the sixteen milestones with an operational status."}}, "sentences": [{"id": "M10.definition.1", "field": "Definition", "text": "The time ATC issues the Target Start Up Approval Time", "hl": false}, {"id": "M10.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M10.timing.1", "field": "Timing", "text": "The information is provided t-minutes before EOBT, where t is a parameter agreed locally", "hl": false}, {"id": "M10.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M10.effect.1", "field": "Effect", "text": "The flight is stabilised into the pre-departure sequence.", "hl": false}, {"id": "M10.effect.2", "field": "Effect", "text": "The Aircraft Operator/ Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M10.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant partners of the TSAT that has been allocated to the flight.", "hl": false}, {"id": "M10.procedures.2", "field": "Procedures", "text": "The Network Operations is informed by a T-DPI-s for non regulated flights.", "hl": false}, {"id": "M10.procedures.3", "field": "Procedures", "text": "Second step: To check whether the number of TOBT updates exceeds a tolerance defined locally, after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.4", "field": "Procedures", "text": "First: The TSAT will indicate to the partners the time when the start up approval can be expected.", "hl": false}, {"id": "M10.procedures.5", "field": "Procedures", "text": "Network Operations will be informed with a T-DPI-s for non regulated flights.", "hl": false}, {"id": "M10.procedures.6", "field": "Procedures", "text": "No check is performed.", "hl": false}, {"id": "M10.procedures.7", "field": "Procedures", "text": "Second: A check shall be performed to see the number of TOBT updates after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.8", "field": "Procedures", "text": "In case the number of TOBT updates exceeds a threshold, then the TOBT input should be processed according to local procedure.", "hl": false}, {"id": "M10.procedures.9", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M10.procedures.10", "field": "Procedures", "text": "- A defined time (local parameter) before TOBT", "hl": true}, {"id": "M10.procedures.11", "field": "Procedures", "text": "- TOBT update after TSAT issue", "hl": true}, {"id": "M10.operational_status.1", "field": "Operational Status", "text": "SEQUENCED", "hl": false}, {"id": "M10.action_on_cdm.1", "field": "Action on CDM Operation", "text": "TTOT updated", "hl": true}]}, {"id": "g018", "task": "precision", "model": "m11", "milestone": 13, "milestone_name": "Start Up Requested", "element": {"path": "AirportCDMPlatform", "kind": "class", "content": {"name": "AirportCDMPlatform", "hl": false}, {"id": "M13.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M13.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g019", "task": "precision", "model": "m04", "milestone": 16, "milestone_name": "Take Off", "element": {"path": "AirTrafficControl->AirportCdmPartner [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "AirTrafficControl", "target": "AirportCdmPartner", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M16.definition.1", "field": "Definition", "text": "ATOT - Actual Take Off Time.", "hl": false}, {"id": "M16.definition.2", "field": "Definition", "text": "This is the time that an aircraft takes off from the runway.", "hl": false}, {"id": "M16.definition.3", "field": "Definition", "text": "(Equivalent to ATC ATD-Actual Time of Departure, ACARS = OFF).", "hl": true}, {"id": "M16.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by ATC system or from ACARS equipped aircraft.", "hl": true}, {"id": "M16.timing.1", "field": "Timing", "text": "The information is directly available as soon as possible after occurrence of the milestone.", "hl": false}, {"id": "M16.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M16.effect.1", "field": "Effect", "text": "FSA and MVT messages are sent.", "hl": false}, {"id": "M16.procedures.1", "field": "Procedures", "text": "To inform all relevant Airport CDM Partners about the actual take off.", "hl": true}, {"id": "M16.procedures.2", "field": "Procedures", "text": "An airborne message is generated and the flight is removed from the departure sequence.", "hl": false}, {"id": "M16.procedures.3", "field": "Procedures", "text": "This process is triggered by Tower FDPS, A-SMGCS / Radar detection or ACARS.", "hl": false}, {"id": "M16.operational_status.1", "field": "Operational Status", "text": "DEPARTED / TAKE OFF", "hl": false}, {"id": "M16.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ATOT recorded", "hl": false}]}, {"id": "g020", "task": "precision", "model": "m17", "milestone": 11, "milestone_name": "Boarding Starts", "element": {"path": "TimeQuantity.value", "kind": "attribute", "content": {"name": "value", "type": "DateTime", "description": "The value of the time quantity."}, "class": {"name": "TimeQuantity", "stereotype": "entity", "package": "Timings", "definition": "An abstract time quantity (a prefix such as Scheduled, Estimated, Target, Actual, or Calculated applied to an event) that keeps every successive value with its originator and time of update."}}, "sentences": [{"id": "M11.definition.1", "field": "Definition", "text": "The gate is open for passengers to physically start boarding (independent of whether boarding takes place via an air-bridge/pier, aircraft steps or coaching to a stand).", "hl": false}, {"id": "M11.definition.2", "field": "Definition", "text": "This is not to be confused with the time passengers are pre-called to the gate via flight information display systems (FIDS) or public address systems.", "hl": true}, {"id": "M11.origin_and_priority.1", "field": "Origin and priority", "text": "Automatic from airport system or manual input by Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M11.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M11.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M11.effect.1", "field": "Effect", "text": "When boarding commences it gives the Airport CDM Partners a good indication of whether the TOBT/TSAT will be respected.", "hl": false}, {"id": "M11.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Start Boarding Time (ASBT).", "hl": false}, {"id": "M11.procedures.2", "field": "Procedures", "text": "Second step: To check whether boarding starts in time to respect TOBT and inform the AO/GH in case TOBT needs to be updated.", "hl": false}, {"id": "M11.procedures.3", "field": "Procedures", "text": "Inform of Actual Start Boarding Time (ASBT) when it occurs.", "hl": true}, {"id": "M11.procedures.4", "field": "Procedures", "text": "At a certain time before TOBT (local variable e.g. corresponding to aircraft type) a check shall be performed to check the boarding status.", "hl": false}, {"id": "M11.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M11.procedures.6", "field": "Procedures", "text": "- a time variable <value> minutes before TOBT.", "hl": true}, {"id": "M11.operational_status.1", "field": "Operational Status", "text": "BOARDING", "hl": false}, {"id": "M11.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g021", "task": "precision", "model": "m10", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "Flight.isReadyWithin15MinOfEOBT()", "kind": "operation", "content": {"signature": "isReadyWithin15MinOfEOBT(): Boolean", "description": "The flight is ready not later than 15 minutes after the planned EOBT (M1)."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single arrival or departure flight tracked through the CDM process from ATC Flight Plan activation to take-off, carrying its operational status and successive time estimates."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": true}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": true}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": true}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g022", "task": "precision", "model": "m14", "milestone": 6, "milestone_name": "Landed", "element": {"path": "Exit->TimeQuantity [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "Exit", "target": "TimeQuantity", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M6.definition.1", "field": "Definition", "text": "ALDT - Actual Landing Time.", "hl": true}, {"id": "M6.definition.2", "field": "Definition", "text": "This is the time that an aircraft touches down on a runway.", "hl": false}, {"id": "M6.definition.3", "field": "Definition", "text": "(Equivalent to ATC ATA - Actual Time of Arrival landing, ACARS=ON).", "hl": false}, {"id": "M6.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by ATC system or by ACARS from equipped aircraft.", "hl": false}, {"id": "M6.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M6.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M6.effect.1", "field": "Effect", "text": "The occurrence of ALDT triggers an update of downstream estimates: TOBT and TTOT are updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the defined turn-round period for the departing flight.", "hl": false}, {"id": "M6.effect.2", "field": "Effect", "text": "The EIBT can be updated according to the ALDT +EXIT.", "hl": true}, {"id": "M6.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M6.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M6.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M6.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M6.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M6.procedures.6", "field": "Procedures", "text": "- Actual Landing Time: ALDT", "hl": false}, {"id": "M6.operational_status.1", "field": "Operational Status", "text": "LANDED", "hl": false}, {"id": "M6.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT changes to ALDT, EIBT, TOBT and TTOT updated", "hl": true}]}, {"id": "g023", "task": "precision", "model": "m07", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "TakeOffTime.prefix", "kind": "attribute", "content": {"name": "prefix", "type": "TimePrefix", "description": "Whether this take-off time is estimated (ETOT), target (TTOT), calculated (CTOT), or actual (ATOT)."}, "class": {"name": "TakeOffTime", "stereotype": "entity", "package": "Timings", "definition": "A time quantity for the take-off event (ETOT, TTOT, CTOT, or ATOT), recorded with its prefix, origin, and time of update."}}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": true}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": false}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": false}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": true}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": false}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": false}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": false}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": false}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": true}]}, {"id": "g024", "task": "precision", "model": "m03", "milestone": 10, "milestone_name": "TSAT Issued", "element": {"path": "TSAT->TimeQuantity [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "TSAT", "target": "TimeQuantity", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M10.definition.1", "field": "Definition", "text": "The time ATC issues the Target Start Up Approval Time", "hl": true}, {"id": "M10.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M10.timing.1", "field": "Timing", "text": "The information is provided t-minutes before EOBT, where t is a parameter agreed locally", "hl": false}, {"id": "M10.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M10.effect.1", "field": "Effect", "text": "The flight is stabilised into the pre-departure sequence.", "hl": false}, {"id": "M10.effect.2", "field": "Effect", "text": "The Aircraft Operator/ Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M10.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant partners of the TSAT that has been allocated to the flight.", "hl": false}, {"id": "M10.procedures.2", "field": "Procedures", "text": "The Network Operations is informed by a T-DPI-s for non regulated flights.", "hl": false}, {"id": "M10.procedures.3", "field": "Procedures", "text": "Second step: To check whether the number of TOBT updates exceeds a tolerance defined locally, after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.4", "field": "Procedures", "text": "First: The TSAT will indicate to the partners the time when the start up approval can be expected.", "hl": true}, {"id": "M10.procedures.5", "field": "Procedures", "text": "Network Operations will be informed with a T-DPI-s for non regulated flights.", "hl": false}, {"id": "M10.procedures.6", "field": "Procedures", "text": "No check is performed.", "hl": false}, {"id": "M10.procedures.7", "field": "Procedures", "text": "Second: A check shall be performed to see the number of TOBT updates after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.8", "field": "Procedures", "text": "In case the number of TOBT updates exceeds a threshold, then the TOBT input should be processed according to local procedure.", "hl": false}, {"id": "M10.procedures.9", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M10.procedures.10", "field": "Procedures", "text": "- A defined time (local parameter) before TOBT", "hl": false}, {"id": "M10.procedures.11", "field": "Procedures", "text": "- TOBT update after TSAT issue", "hl": true}, {"id": "M10.operational_status.1", "field": "Operational Status", "text": "SEQUENCED", "hl": false}, {"id": "M10.action_on_cdm.1", "field": "Action on CDM Operation", "text": "TTOT updated", "hl": false}]}, {"id": "g025", "task": "precision", "model": "m06", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "Flight.direction", "kind": "attribute", "content": {"name": "direction", "type": "String", "description": "Arrival or departure leg of a turn-round."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "An arriving or departing flight tracked through the CDM process, carrying its operational status and time quantities."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": true}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": true}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": true}]}, {"id": "g026", "task": "precision", "model": "m14", "milestone": 2, "milestone_name": "EOBT - 2 hr", "element": {"path": "Ttot.calculateAtEobtMinus2Hr()", "kind": "operation", "content": {"signature": "calculateAtEobtMinus2Hr(eibt: Eibt, mttt: Mttt, exot: Exot, eobt: Eobt, tobt: Tobt): DateTime", "description": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT, if later than EOBT+EXOT. In the case of manual input of TOBT, this estimate will override the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT (milestone 2)."}, "class": {"name": "Ttot", "stereotype": "entity", "package": "Timings", "definition": "The Target/Calculated Take-Off Time, computed from EIBT+MTTT+EXOT or TOBT+EXOT and reported to Network Operations when it changes beyond tolerance."}}, "sentences": [{"id": "M2.definition.1", "field": "Definition", "text": "At EOBT-2 hr most flights will be known in the Airport CDM Platform including if they are regulated or not.", "hl": true}, {"id": "M2.definition.2", "field": "Definition", "text": "All regulated flights receive a CTOT from Network Operations.", "hl": false}, {"id": "M2.origin_and_priority.1", "field": "Origin and priority", "text": "The CTOT is issued by the Network Operations and is sent to relevant ATS units as well as the departure aerodrome.", "hl": false}, {"id": "M2.origin_and_priority.2", "field": "Origin and priority", "text": "CTOT flights usually have a priority over unregulated flights.", "hl": false}, {"id": "M2.timing.1", "field": "Timing", "text": "If the flight is regulated, a CTOT is issued at EOBT-2h.", "hl": false}, {"id": "M2.data_quality.1", "field": "Data Quality", "text": "Not applicable.", "hl": false}, {"id": "M2.effect.1", "field": "Effect", "text": "For inbound flights, ELDT is updated based on information provided by the FUM messages, taking into account the actual progress of the flight.", "hl": false}, {"id": "M2.procedures.1", "field": "Procedures", "text": "To check (before or after take off from outstation) whether AO/GH flight estimates are consistent with the ATC Flight Plan and to inform Network Operations about the updated take off time estimate, using a T-DPI Message.", "hl": false}, {"id": "M2.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan estimated off block time at EOBT-2 hrs.", "hl": false}, {"id": "M2.procedures.3", "field": "Procedures", "text": "At EOBT-2 hrs Network Operations is informed through the first T-DPI message.", "hl": false}, {"id": "M2.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT, if later than EOBT+EXOT.", "hl": true}, {"id": "M2.procedures.5", "field": "Procedures", "text": "In the case of manual input of TOBT, this estimate will override the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": true}, {"id": "M2.procedures.6", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M2.procedures.7", "field": "Procedures", "text": "- a time stamp, at EOBT - 2h.", "hl": false}, {"id": "M2.operational_status.1", "field": "Operational Status", "text": "N. A.", "hl": false}, {"id": "M2.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETOT/TTOT/CTOT Mark appropriate fields as REGULATED", "hl": false}]}, {"id": "g027", "task": "precision", "model": "m06", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "AircraftOperator.submitFlightPlan()", "kind": "operation", "content": {"signature": "submitFlightPlan(flightPlan: AtcFlightPlan): void", "description": "Submits the ICAO ATC Flight Plan; the AO must provide correct information before the first E-DPI (Milestone 1)."}, "class": {"name": "AircraftOperator", "stereotype": "entity", "package": "Stakeholders", "definition": "The airline that submits the ATC Flight Plan and provides estimates such as TOBT."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": true}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": false}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": false}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": true}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": false}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g028", "task": "precision", "model": "m08", "milestone": 12, "milestone_name": "Aircraft Ready", "element": {"path": "Flight.ardt", "kind": "attribute", "content": {"name": "ardt", "type": "DateTime", "description": "Actual Ready Time - doors closed, bridge removed, ready to taxi immediately upon TWR instruction."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flight Management", "definition": "An individual flight (arrival or departure leg) tracked through the Airport CDM Platform from flight-plan activation to take off."}}, "sentences": [{"id": "M12.definition.1", "field": "Definition", "text": "The time when all doors are closed, boarding bridge removed, push back vehicle connected, ready to taxi immediately upon reception of TWR instructions (ARDT).", "hl": true}, {"id": "M12.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by the Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M12.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M12.data_quality.1", "field": "Data Quality", "text": "Data is directly available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M12.effect.1", "field": "Effect", "text": "ATC refines the pre-departure sequence.", "hl": false}, {"id": "M12.effect.2", "field": "Effect", "text": "The pilot requests start up just before TSAT, following coordination with the Ground Handler.", "hl": false}, {"id": "M12.effect.3", "field": "Effect", "text": "(Dispatcher / Supervisor / Redcap).", "hl": false}, {"id": "M12.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Ready Time (ARDT) in the Airport CDM Platform and that the aircraft is ready for start up / push-back.", "hl": true}, {"id": "M12.procedures.2", "field": "Procedures", "text": "Second step: To inform the AO/GH that TOBT has passed and the Airport CDM Platform has not yet received ARDT or Ready Status (RDY).", "hl": false}, {"id": "M12.procedures.3", "field": "Procedures", "text": "Inform of ARDT or RDY confirming that the flight follows the indicated TOBT.", "hl": true}, {"id": "M12.procedures.4", "field": "Procedures", "text": "At TOBT + tolerance the AO/GH are informed that TOBT has passed and there has not been a ready status message yet.", "hl": false}, {"id": "M12.procedures.5", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M12.procedures.6", "field": "Procedures", "text": "- an input to the Airport CDM Platform.", "hl": false}, {"id": "M12.operational_status.1", "field": "Operational Status", "text": "READY", "hl": false}, {"id": "M12.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g029", "task": "precision", "model": "m04", "milestone": 4, "milestone_name": "Local Radar Update", "element": {"path": "AircraftOperator", "kind": "class", "content": {"name": "AircraftOperator", "stereotype": "entity", "package": "Stakeholders", "definition": "The airline or operator that submits the ATC Flight Plan, provides TOBT and turn-round estimates, and manages the aircraft's turn-round."}, "class": null}, "sentences": [{"id": "M4.definition.1", "field": "Definition", "text": "The flight enters the FIR (Flight Information Region) or the local airspace of the destination airport.", "hl": false}, {"id": "M4.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit that is associated with an airport.", "hl": false}, {"id": "M4.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "hl": false}, {"id": "M4.timing.1", "field": "Timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "hl": false}, {"id": "M4.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M4.effect.1", "field": "Effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "hl": false}, {"id": "M4.effect.2", "field": "Effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "hl": false}, {"id": "M4.effect.3", "field": "Effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "hl": false}, {"id": "M4.effect.4", "field": "Effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "hl": false}, {"id": "M4.effect.5", "field": "Effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "hl": false}, {"id": "M4.effect.6", "field": "Effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.",
