ld": "Origin and priority", "text": "CTOT flights usually have a priority over unregulated flights.", "hl": false}, {"id": "M2.timing.1", "field": "Timing", "text": "If the flight is regulated, a CTOT is issued at EOBT-2h.", "hl": false}, {"id": "M2.data_quality.1", "field": "Data Quality", "text": "Not applicable.", "hl": false}, {"id": "M2.effect.1", "field": "Effect", "text": "For inbound flights, ELDT is updated based on information provided by the FUM messages, taking into account the actual progress of the flight.", "hl": false}, {"id": "M2.procedures.1", "field": "Procedures", "text": "To check (before or after take off from outstation) whether AO/GH flight estimates are consistent with the ATC Flight Plan and to inform Network Operations about the updated take off time estimate, using a T-DPI Message.", "hl": false}, {"id": "M2.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan estimated off block time at EOBT-2 hrs.", "hl": true}, {"id": "M2.procedures.3", "field": "Procedures", "text": "At EOBT-2 hrs Network Operations is informed through the first T-DPI message.", "hl": false}, {"id": "M2.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT, if later than EOBT+EXOT.", "hl": true}, {"id": "M2.procedures.5", "field": "Procedures", "text": "In the case of manual input of TOBT, this estimate will override the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": true}, {"id": "M2.procedures.6", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M2.procedures.7", "field": "Procedures", "text": "- a time stamp, at EOBT - 2h.", "hl": false}, {"id": "M2.operational_status.1", "field": "Operational Status", "text": "N. A.", "hl": false}, {"id": "M2.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETOT/TTOT/CTOT Mark appropriate fields as REGULATED", "hl": false}]}, {"id": "g188", "task": "precision", "model": "m09", "milestone": 4, "milestone_name": "Local Radar Update", "element": {"path": "ATCSystem.detectFlight()", "kind": "operation", "content": {"signature": "detectFlight(flight: Flight): void", "description": "Detects the flight by radar in FIR, TMA, or on Final Approach, or via A-SMGCS/Radar at take-off (milestones 4, 5, 16)."}, "class": {"name": "ATCSystem", "stereotype": "boundary", "package": "Systems", "definition": "The ATC technical system (including radar and A-SMGCS) that detects a flight's position and calculates the Estimated Taxi-Out Time."}}, "sentences": [{"id": "M4.definition.1", "field": "Definition", "text": "The flight enters the FIR (Flight Information Region) or the local airspace of the destination airport.", "hl": false}, {"id": "M4.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit that is associated with an airport.", "hl": false}, {"id": "M4.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "hl": true}, {"id": "M4.timing.1", "field": "Timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "hl": false}, {"id": "M4.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": true}, {"id": "M4.effect.1", "field": "Effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "hl": false}, {"id": "M4.effect.2", "field": "Effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "hl": false}, {"id": "M4.effect.3", "field": "Effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "hl": false}, {"id": "M4.effect.4", "field": "Effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "hl": false}, {"id": "M4.effect.5", "field": "Effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "hl": false}, {"id": "M4.effect.6", "field": "Effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.", "hl": false}, {"id": "M4.effect.7", "field": "Effect", "text": "Decisions such as the turn-round period, connecting passengers etc are taken and need to be stable at this event.", "hl": false}, {"id": "M4.effect.8", "field": "Effect", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "hl": false}, {"id": "M4.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M4.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M4.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": false}, {"id": "M4.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M4.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M4.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": true}, {"id": "M4.operational_status.1", "field": "Operational Status", "text": "FIR", "hl": false}, {"id": "M4.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g189", "task": "precision", "model": "m12", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "AirportCDMPlatform.initiateFlight()", "kind": "operation", "content": {"signature": "initiateFlight(flightPlan: ATCFlightPlan): void", "description": "Initiates processing for a flight upon activation of its ATC Flight Plan, setting status to INITIATED."}, "class": {"name": "AirportCDMPlatform", "stereotype": "control", "package": "Control", "definition": "The Airport CDM Platform that is initiated for a flight, processes all available information and orchestrates the milestone processes."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": true}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": true}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": true}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g190", "task": "precision", "model": "m09", "milestone": 13, "milestone_name": "Start Up Requested", "element": {"path": "AirTrafficControl.confirmTSATToPilot()", "kind": "operation", "content": {"signature": "confirmTSATToPilot(flight: Flight): void", "description": "ATC confirms TSAT to the pilot in order to maintain the aircraft in the pre-departure sequence (milestone 13)."}, "class": {"name": "AirTrafficControl", "stereotype": "entity", "package": "Stakeholders", "definition": "The air traffic control organisation, including ACC, Approach Control Unit and Tower units, that issues TSAT, approves start-up, and sequences departing flights."}}, "sentences": [{"id": "M13.definition.1", "field": "Definition", "text": "The time that start up is requested (ASRT).", "hl": false}, {"id": "M13.origin_and_priority.1", "field": "Origin and priority", "text": "ATC (based on pilot request).", "hl": false}, {"id": "M13.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M13.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M13.effect.1", "field": "Effect", "text": "ATC confirms TSAT to the pilot in order to maintain the aircraft in the pre-departure sequence.", "hl": true}, {"id": "M13.effect.2", "field": "Effect", "text": "Provided the aircraft was ready on time (ARDT), it is now up to ATC to assure that a regulated flight can respect its CTOT.", "hl": true}, {"id": "M13.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Start up Request Time (ASRT) in the Airport CDM Platform.", "hl": false}, {"id": "M13.procedures.2", "field": "Procedures", "text": "Second step: to alert all relevant Airport CDM Partners when no start up has been re-quested inside the locally agreed TSAT tolerance window.", "hl": false}, {"id": "M13.procedures.3", "field": "Procedures", "text": "Inform of ASRT when it occurs.", "hl": false}, {"id": "M13.procedures.4", "field": "Procedures", "text": "If the start up request is not made by TSAT + tolerance, the AO/GH is informed that no start up has been requested, and should update TOBT.", "hl": false}, {"id": "M13.procedures.5", "field": "Procedures", "text": "Timestamp when the tolerance window has passed at TSAT.", "hl": true}, {"id": "M13.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M13.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g191", "task": "precision", "model": "m15", "milestone": 16, "milestone_name": "Take Off", "element": {"path": "AirTrafficControlUnit->TakeOff [association]", "kind": "relationship", "content": {"type": "association", "source": "AirTrafficControlUnit", "target": "TakeOff", "label": "detects", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M16.definition.1", "field": "Definition", "text": "ATOT - Actual Take Off Time.", "hl": true}, {"id": "M16.definition.2", "field": "Definition", "text": "This is the time that an aircraft takes off from the runway.", "hl": false}, {"id": "M16.definition.3", "field": "Definition", "text": "(Equivalent to ATC ATD-Actual Time of Departure, ACARS = OFF).", "hl": true}, {"id": "M16.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by ATC system or from ACARS equipped aircraft.", "hl": false}, {"id": "M16.timing.1", "field": "Timing", "text": "The information is directly available as soon as possible after occurrence of the milestone.", "hl": false}, {"id": "M16.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M16.effect.1", "field": "Effect", "text": "FSA and MVT messages are sent.", "hl": false}, {"id": "M16.procedures.1", "field": "Procedures", "text": "To inform all relevant Airport CDM Partners about the actual take off.", "hl": false}, {"id": "M16.procedures.2", "field": "Procedures", "text": "An airborne message is generated and the flight is removed from the departure sequence.", "hl": false}, {"id": "M16.procedures.3", "field": "Procedures", "text": "This process is triggered by Tower FDPS, A-SMGCS / Radar detection or ACARS.", "hl": false}, {"id": "M16.operational_status.1", "field": "Operational Status", "text": "DEPARTED / TAKE OFF", "hl": true}, {"id": "M16.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ATOT recorded", "hl": false}]}, {"id": "g192", "task": "precision", "model": "m13", "milestone": 7, "milestone_name": "In-Block", "element": {"path": "Flight.aibt", "kind": "attribute", "content": {"name": "aibt", "type": "AIBT", "description": "Actual In-Block Time recorded on arrival at the stand."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "An arriving or departing operation of an aircraft turn-round, tracked through the sixteen CDM milestones with its operational status and time quantities."}}, "sentences": [{"id": "M7.definition.1", "field": "Definition", "text": "AIBT - Actual In-Block Time.", "hl": true}, {"id": "M7.definition.2", "field": "Definition", "text": "This is the time that an aircraft arrives in-blocks.", "hl": false}, {"id": "M7.definition.3", "field": "Definition", "text": "(Equivalent to Airline/Handler ATA - Actual Time of Arrival, ACARS = IN) Note: ACGT is considered to commence at AIBT", "hl": false}, {"id": "M7.origin_and_priority.1", "field": "Origin and priority", "text": "ACARS equipped aircraft or automated docking systems or ATC systems (e.g. A-SMGCS) or by manual input.", "hl": false}, {"id": "M7.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M7.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M7.effect.1", "field": "Effect", "text": "The occurrence of AIBT should trigger an update of downstream estimates: TOBT and TTOT are updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the estimated turn-round period for the departing flight.", "hl": false}, {"id": "M7.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M7.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M7.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M7.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M7.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M7.procedures.6", "field": "Procedures", "text": "- Actual In Blocks Time: AIBT", "hl": true}, {"id": "M7.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M7.action_on_cdm.1", "field": "Action on CDM Operation", "text": "EIBT changes to AIBT TOBT and TTOT updated", "hl": true}]}, {"id": "g193", "task": "precision", "model": "m08", "milestone": 8, "milestone_name": "Ground Handling Started", "element": {"path": "Flight.ttot", "kind": "attribute", "content": {"name": "ttot", "type": "DateTime", "description": "Target Take Off Time, calculated from EIBT+MTTT+EXOT or TOBT+EXOT and updated at multiple milestones."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flight Management", "definition": "An individual flight (arrival or departure leg) tracked through the Airport CDM Platform from flight-plan activation to take off."}}, "sentences": [{"id": "M8.definition.1", "field": "Definition", "text": "Commence of Ground Handling Operations (ACGT).", "hl": false}, {"id": "M8.definition.2", "field": "Definition", "text": "Note: this milestone is specific to flights that are the first operation of the day or that have been long term parked.", "hl": false}, {"id": "M8.definition.3", "field": "Definition", "text": "For flights that are on a normal turn-round ACGT is considered to commence at AIBT.", "hl": false}, {"id": "M8.origin_and_priority.1", "field": "Origin and priority", "text": "Aircraft Operator / Ground Handler will provide the information.", "hl": false}, {"id": "M8.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M8.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M8.effect.1", "field": "Effect", "text": "The occurrence of ACGT triggers an update of downstream estimates: TOBT is updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the estimated turn-round period for the departing flight.", "hl": true}, {"id": "M8.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M8.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": true}, {"id": "M8.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M8.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M8.procedures.6", "field": "Procedures", "text": "- Actual Commence of Ground Handling: ACGT", "hl": false}, {"id": "M8.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M8.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETTT/TOBT, TTOT updated", "hl": true}]}, {"id": "g194", "task": "precision", "model": "m17", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "AirportCDMPlatform.updateELDTAndEIBTForArrival()", "kind": "operation", "content": {"signature": "updateELDTAndEIBTForArrival(flight: Flight): void", "description": "Updates ELDT and EIBT for an arrival and ETOT for a departure (m1)."}, "class": {"name": "AirportCDMPlatform", "stereotype": "control", "package": "Systems", "definition": "The Airport CDM Platform that is initiated for each flight, processes all available information, and carries out the ACISP actions defined at each milestone."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available .procedures.6", "field": "Procedures", "text": "No check is performed.", "hl": false}, {"id": "M10.procedures.7", "field": "Procedures", "text": "Second: A check shall be performed to see the number of TOBT updates after TSAT has been issued.", "hl": true}, {"id": "M10.procedures.8", "field": "Procedures", "text": "In case the number of TOBT updates exceeds a threshold, then the TOBT input should be processed according to local procedure.", "hl": false}, {"id": "M10.procedures.9", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M10.procedures.10", "field": "Procedures", "text": "- A defined time (local parameter) before TOBT", "hl": false}, {"id": "M10.procedures.11", "field": "Procedures", "text": "- TOBT update after TSAT issue", "hl": true}, {"id": "M10.operational_status.1", "field": "Operational Status", "text": "SEQUENCED", "hl": false}, {"id": "M10.action_on_cdm.1", "field": "Action on CDM Operation", "text": "TTOT updated", "hl": false}]}, {"id": "g199", "task": "precision", "model": "m09", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "AirportCDMPlatform.updateDepartureEstimates()", "kind": "operation", "content": {"signature": "updateDepartureEstimates(flight: Flight): void", "description": "EOBT and ETOT updated for a departure (milestone 1 ACISP action)."}, "class": {"name": "AirportCDMPlatform", "stereotype": "control", "package": "Systems", "definition": "The Airport CDM Platform that is initiated for each flight, processes all available flight information, and performs the ACISP actions defined for each milestone."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": true}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority" ht to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": true}]}, {"id": "g200", "task": "precision", "model": "m05", "milestone": 11, "milestone_name": "Boarding Starts", "element": {"path": "Flight.boardingTime", "kind": "attribute", "content": {"name": "boardingTime", "type": "BoardingTime", "description": "The flight's ASBT."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "An arriving or departing flight leg of a turn-round, tracked through the milestones with its operational status and time quantities."}}, "sentences": [{"id": "M11.definition.1", "field": "Definition", "text": "The gate is open for passengers to physically start boarding (independent of whether boarding takes place via an air-bridge/pier, aircraft steps or coaching to a stand).", "hl": false}, {"id": "M11.definition.2", "field": "Definition", "text": "This is not to be confused with the time passengers are pre-called to the gate via flight information display systems (FIDS) or public address systems.", "hl": false}, {"id": "M11.origin_and_priority.1", "field": "Origin and priority", "text": "Automatic from airport system or manual input by Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M11.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M11.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M11.effect.1", "field": "Effect", "text": "When boarding commences it gives the Airport CDM Partners a good indication of whether the TOBT/TSAT will be respected.", "hl": false}, {"id": "M11.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Start Boarding Time (ASBT).", "hl": true}, {"id": "M11.procedures.2", "field": "Procedures", "text": "Second step: To check whether boarding starts in time to respect TOBT and inform the AO/GH in case TOBT needs to be updated.", "hl": false}, {"id": "M11.procedures.3", "field": "Procedures", "text": "Inform of Actual Start Boarding Time (ASBT) when it occurs.", "hl": true}, {"id": "M11.procedures.4", "field": "Procedures", "text": "At a certain time before TOBT (local variable e.g. corresponding to aircraft type) a check shall be performed to check the boarding status.", "hl": false}, {"id": "M11.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M11.procedures.6", "field": "Procedures", "text": "- a time variable <value> minutes before TOBT.", "hl": false}, {"id": "M11.operational_status.1", "field": "Operational Status", "text": "BOARDING", "hl": true}, {"id": "M11.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}], "models": {}, "grader": "grader_B", "fingerprint": "0a51bcbcfc", "start": {"grader": "grader_B", "task": "precision", "seed": 0, "exported": "2026-09-19T15:30:54.720Z", "grades": {"g001": {"credit": 1, "elements": [], "note": "", "seconds": 118, "all": false, "graded_at": "2026-09-19T09:53:24.543Z"}, "g004": {"credit": 1, "elements": [], "note": "", "seconds": 38, "graded_at": "2026-09-19T09:54:46.890Z"}, "g005": {"credit": 1, "elements": [], "note": "", "seconds": 18, "graded_at": "2026-09-19T09:54:56.336Z"}, "g006": {"credit": 1, "elements": [], "note": "", "seconds": 32, "graded_at": "2026-09-19T09:55:12.503Z"}, "g007": {"credit": 0.5, "elements": [], "note": "", "seconds": 61, "graded_at": "2026-09-19T09:55:43.069Z"}, "g008": {"credit": 1, "elements": [], "note": "", "seconds": 11, "graded_at": "2026-09-19T09:55:52.012Z"}, "g009": {"credit": 1, "elements": [], "note": "", "seconds": 99, "graded_at": "2026-09-19T09:56:39.787Z"}, "g011": {"credit": 1, "elements": [], "note": "", "seconds": 32, "graded_at": "2026-09-19T09:57:02.110Z"}, "g012": {"credit": 1, "elements": [], "note": "", "seconds": 130, "graded_at": "2026-09-19T09:58:07.178Z"}, "g014": {"credit": 1, "elements": [], "note": "", "seconds": 6, "graded_at": "2026-09-19T09:58:26.325Z"}, "g017": {"credit": 1, "elements": [], "note": "", "seconds": 38, "graded_at": "2026-09-19T09:59:16.364Z"}, "g018": {"credit": 1, "elements": [], "note": "", "seconds": 204, "graded_at": "2026-09-19T10:00:58.129Z"}, "g022": {"credit": 0.5, "elements": [], "note": "", "seconds": 34, "graded_at": "2026-09-19T10:02:55.571Z"}, "g023": {"credit": 1, "elements": [], "note": "", "seconds": 53, "graded_at": "2026-09-19T10:03:22.215Z"}, "g024": {"credit": 1, "element <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ITEMS = DATA.items, TASK = DATA.task;
// the key carries a fingerprint of the items, so a page rebuilt from a changed sample never picks up grades made on the old one
const KEY = 'grade_' + TASK + '_' + DATA.seed + '_' + (DATA.grader || '') + '_' + DATA.fingerprint;
let S = load(); let cur = S.cur || 0; let shownAt = Date.now();
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return s; } catch (e) {}
  // a starting state baked in at build time (grades carried over from an earlier pass), so the grader opens straight into it
  return {grader: DATA.grader || '', grades: (DATA.start && DATA.start.grades) || {}, cur: 0}; }
function save(){ S.cur = cur; S.grader = document.getElementById('grader').value;
  try { localStorage.setItem(KEY, JSON.stringify(S)); document.getElementById('saved').textContent = 'saved ' + new Date().toLocaleTimeString(); }
  catch (e) { document.getElementById('saved').textContent = 'autosave unavailable: export often'; } renderTop(); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G = id => S.grades[id] || (S.grades[id] = {credit: null, elements: [], note: '', seconds: 0});
const graded = () => ITEMS.filter(it => G(it.id).credit != null).length;
function renderTop(){ const d = graded(); document.querySelector('#progress div').style.width = (100 * d / ITEMS.length) + '%';
  document.getElementById('count').textContent = `${d} / ${ITEMS.length} graded`;
  document.getElementById('title').textContent = `Item ${cur + 1} of ${ITEMS.length}`; }
const RECALL = [['1','1','held, as an element where the claim suggests'],['0.5','0.5','present but partly, or in a weaker form'],['0','0','absent from the model']];
const PREC = [['1','1','the document states it'],['0.5','0.5','implied, not stated; or the description adds what the document does not give'],['0','0','neither']];
function gradeBox(it){ const g = G(it.id); const labels = TASK === 'recall' ? RECALL : PREC;
  return `<div class="q"><p>${TASK === 'recall' ? 'Does the model hold the information in this claim?' : 'Does the document support this element?'}</p>
  <div class="grades">${labels.map(([v,l,d]) => `<button class="${String(g.credit) === v ? 'on' : ''}" data-g="${v}"><b>${l}</b><small>${d}</small></button>`).join('')}</div>
  <input class="note" placeholder="note (optional: why, or what you were unsure about)" value="${esc(g.note)}"></div>`; }
function contentLines(c){ return Object.entries(c).filter(([k, v]) => v !== '' && v != null && !(Array.isArray(v) && !v.length)).map(([k, v]) => `<div><span class="muted">${esc(k)}</span> ${esc(Array.isArray(v) ? v.join(', ') : v)}</div>`).join(''); }
function render(){
  const it = ITEMS[cur]; const w = document.getElementById('wrap'); const g = G(it.id); shownAt = Date.now();
  document.getElementById('sub').textContent = `model ${it.model} · M${it.milestone} ${it.milestone_name}` + (it.field ? ` · ${it.field}` : '');
  if (TASK === 'recall') {
    const model = DATA.models[it.model] || []; const ticked = new Set(g.elements);
    const findEl = p => { for (const c of model) { if (c.path === p) return {label: c.path, kind: c.kind, desc: c.definition, cls: ''}; for (const m of c.members) if (m.path === p) return {label: m.label, kind: m.kind, desc: m.desc, cls: c.kind === 'relationships' ? '' : c.path}; } return {label: p, kind: 'class', desc: '', cls: ''}; };
    const c = it.claim;
    w.innerHTML = `<div class="pane left">
      <details class="help"><summary>how to grade</summary><p>Tick the element(s) that hold the claim's information, then grade. <b>1</b>: held as an element a developer would find where the claim's kind and owner suggest; names need not match. <b>0.5</b>: present but only in a description, on another class, only part of the content, or a relationship only as a typed attribute. <b>0</b>: absent. The candidates are a shortlist and may be incomplete: <b>your grade is against the model, not the list</b>. Before grading 0, type a word of the claim in the filter box.</p></details>
      <h3>the claim</h3><div class="el"><span class="k ${esc(c.kind)}">${esc(c.kind)}</span>${esc(c.text)}${c.owner ? `<div class="muted" style="margin-top:4px">owner: ${esc(c.owner)}</div>` : ''}${c.kind === 'relationship' ? `<div class="muted">type: ${esc(c.rel_type || 'other')}</div>` : ''}</div>
      <h3>its sentence, in the ${esc(it.field)} field of milestone ${it.milestone}</h3><div class="passage">${it.field_sentences.map(s => `<span class="s ${s.hl ? 'hl' : ''}">${esc(s.text)}</span>`).join('')}</div>
      ${gradeBox(it)}<p class="keys">keys: 1 · 2 (=0.5) · 3 (=0), or 1 · 5 · 0 · j/→ next · k/← back · n next ungraded · space ticks the focused candidate. Grading does not move on; press j when done.</p></div>
    <div class="pane"><h3>candidate elements of ${it.model} (a shortlist; tick the one(s) that hold the claim)</h3>
      ${it.candidates.map(p => { const e = findEl(p); return `<div class="cand ${ticked.has(p) ? 'ticked' : ''}" data-p="${esc(p)}" tabindex="0"><input type="checkbox" ${ticked.has(p) ? 'checked' : ''}><div>${e.cls ? `<span class="muted">${esc(e.cls)} · </span>` : ''}<span class="k ${e.kind}">${e.kind[0]}</span><code>${esc(e.label)}</code><div class="d">${esc(e.desc)}</div></div></div>`; }).join('') || '<div class="muted">no candidates: search the model below</div>'}
      <h3 style="margin-top:14px">the whole model ${it.model}</h3>
      <input class="filter" id="filter" placeholder="filter every class and member (e.g. TTOT, taxi, off-block)" value="${esc(g.filter || '')}">
      <div class="tree" id="tree"></div></div>`;
    const tree = w.querySelector('#tree');
    const drawTree = () => { const q = (w.querySelector('#filter').value || '').toLowerCase().trim();
      const hit = s => !q || String(s).toLowerCase().includes(q);
      tree.innerHTML = model.map(c => { const ms = c.members.filter(m => !q || hit(m.label) || hit(m.desc) || hit(c.path)); if (q && !ms.length && !hit(c.path) && !hit(c.definition)) return '';
        const open = !!q || c.kind === 'relationships' && false;
        return `<div class="cls ${open ? 'open' : ''}"><div class="hd ${ticked.has(c.path) ? 'ticked' : ''}" data-p="${esc(c.path)}">${c.kind === 'relationships' ? '' : `<input type="checkbox" ${ticked.has(c.path) ? 'checked' : ''}>`}<span class="pk">${esc(c.package || '')}</span><span class="st">${c.kind === 'relationships' ? '' : '«' + esc(c.stereotype) + '»'}</span><span class="nm">${c.kind === 'relationships' ? 'relationships' : esc(c.path)}</span><span class="muted" style="margin-left:auto">${ms.length}</span></div>
          <div class="body">${c.definition ? `<div class="def">${esc(c.definition)}</div>` : ''}${ms.map(m => `<div class="mem ${ticked.has(m.path) ? 'ticked' : ''}" data-p="${esc(m.path)}"><input type="checkbox" ${ticked.has(m.path) ? 'checked' : ''}><div><span class="k ${m.kind}">${m.kind[0]}</span><code>${esc(m.label)}</code>${m.desc ? `<div class="d">${esc(m.desc)}</div>` : ''}</div></div>`).join('')}</div></div>`; }).join('');
      tree.querySelectorAll('.hd').forEach(h => h.onclick = e => { if (e.target.tagName === 'INPUT') { toggle(h.dataset.p, e.target.checked); return; } h.parentElement.classList.toggle('open'); });
      tree.querySelectorAll('.mem').forEach(m => m.onclick = e => { const cb = m.querySelector('input'); if (e.target !== cb) cb.checked = !cb.checked; toggle(m.dataset.p, cb.checked); }); };
    const toggle = (p, on) => { const set = new Set(g.elements); on ? set.add(p) : set.delete(p); g.elements = [...set]; ticked.clear(); g.elements.forEach(x => ticked.add(x)); save();
      w.querySelectorAll(`[data-p="${CSS.escape(p)}"]`).forEach(el => { el.classList.toggle('ticked', on); const cb = el.querySelector('input[type=checkbox]'); if (cb) cb.checked = on; }); };
    w.querySelectorAll('.cand').forEach(cd => cd.onclick = e => { const cb = cd.querySelector('input'); if (e.target !== cb) cb.checked = !cb.checked; toggle(cd.dataset.p, cb.checked); });
    w.querySelector('#filter').oninput = () => { g.filter = w.querySelector('#filter').value; save(); drawTree(); };
    drawTree();
  } else {
    const e = it.element; const all = g.all !== false;   // full milestone by default (19 Sep: graders usually needed it)
    w.innerHTML = `<div class="pane left">
      <details class="help"><summary>how to grade</summary><p>Judge against the document as a whole; this milestone, the one among those the element cites that names it best, is where to look first, and anything stated in any of the sixteen milestones counts in full (search the PDF if it is not here). <b>1</b>: the document states the thing, the value, the rule or condition in the operation's description, or the link. <b>0.5</b>: the text implies it without stating it, or the name is the text's but the description adds a formula or condition the text does not give. <b>0</b>: neither. The whole milestone is shown, with the sentences most related to the element highlighted; start from those, but read the rest before grading 0, since what you need is often elsewhere in the table. For an enumeration, grade whether the document names the status or any of its values; the list of literals is not graded. Structure the models were told to build (value, originator, time of update and accuracy on every time; identifiers; a common base class for times, milestones, messages and stakeholders) is 1 when the document names the underlying thing. <b>Not graded here:</b> whether the model chose a class, an attribute, or an enumeration for it, and its stereotype and package; these are shown only so you know what the element is. The stereotypes are Jacobson's, as the models were told them: <i>entity</i> holds information that persists across the process; <i>boundary</i> models an interface between the system and something outside it (a stakeholder, an external system, a message); <i>control</i> holds the logic of a procedure (sequencing, checking, computation).</p></details>
      <h3>the element, with everything ${it.model} says about it</h3>
      <div class="el">${e.class ? `<div class="muted">${esc(e.class.package)} · «${esc(e.class.stereotype)}» <b>${esc(e.class.name)}</b></div><div class="muted" style="font-style:italic;margin:2px 0 8px">${esc(e.class.definition)}</div>` : ''}
      <span class="k ${esc(e.kind)}">${esc(e.kind)}</span> <code style="font:13px var(--mono)">${esc(e.path)}</code><div style="margin-top:6px">${contentLines(e.content)}</div></div>
      ${gradeBox(it)}<p class="keys">keys: 1 · 2 (=0.5) · 3 (=0), or 1 · 5 · 0 · j/→ next · k/← back · n next ungraded. Grading does not move on; press j when done.</p></div>
    <div class="pane"><h3>milestone ${it.milestone}: ${esc(it.milestone_name)}, where to look first. The sentences sharing most words with the element are highlighted; support anywhere in the document counts.</h3>
      <label class="muted" style="display:block;margin-bottom:8px"><input type="checkbox" id="allsent" ${all ? 'checked' : ''}> show every sentence of the milestone (${it.sentences.length} sentences); untick to see only the highlighted ones</label>
      <div class="passage">${(() => { let f = ''; return it.sentences.filter(s => s.hl || all).map(s => { const h = s.field !== f ? `<div class="f">${esc(s.field)}</div>` : ''; f = s.field; return h + `<span class="s ${s.hl ? 'hl' : ''}">${esc(s.text)}</span>`; }).join(''); })()}</div></div>`;
    w.querySelector('#allsent').onchange = ev => { g.all = ev.target.checked; save(); render(); };
  }
  w.querySelectorAll('.grades button').forEach(b => b.onclick = () => setGrade(b.dataset.g));
  w.querySelector('.note').oninput = ev => { g.note = ev.target.value; save(); };
  renderTop();
}
function setGrade(v){ const it = ITEMS[cur]; const g = G(it.id);
  g.credit = parseFloat(v); g.seconds = (g.seconds || 0) + Math.round((Date.now() - shownAt) / 1000); g.graded_at = new Date().toISOString(); save();
  document.querySelectorAll('.grades button').forEach(x => x.classList.toggle('on', x.dataset.g === v)); renderTop(); }
function go(i){ if (i < 0 || i >= ITEMS.length) return; const g = G(ITEMS[cur].id); g.seconds = (g.seconds || 0) + Math.round((Date.now() - shownAt) / 1000); cur = i; save(); render(); }
function nextUngraded(){ for (let k = 1; k <= ITEMS.length; k++) { const i = (cur + k) % ITEMS.length; if (G(ITEMS[i].id).credit == null) { go(i); return; } } renderTop(); }
document.getElementById('prev').onclick = () => go(cur - 1); document.getElementById('next').onclick = () => go(cur + 1); document.getElementById('nextun').onclick = nextUngraded;
document.addEventListener('keydown', ev => { if (ev.target.matches('input[type=text], textarea, .note, .filter')) return;
  if (ev.key === '1') setGrade('1'); else if (ev.key === '2' || ev.key === '5') setGrade('0.5'); else if (ev.key === '3' || ev.key === '0') setGrade('0');
  else if (ev.key === 'ArrowLeft' || ev.key === 'k') go(cur - 1); else if (ev.key === 'ArrowRight' || ev.key === 'j') go(cur + 1); else if (ev.key === 'n') nextUngraded();
  else if (ev.key === ' ' && document.activeElement.classList.contains('cand')) { document.activeElement.click(); ev.preventDefault(); } else return; });
document.getElementById('grader').value = S.grader || DATA.grader || ''; document.getElementById('grader').oninput = save;
if (DATA.grader) document.getElementById('grader').readOnly = true;
document.getElementById('export').onclick = () => {
  const out = {grader: S.grader, task: TASK, seed: DATA.seed, exported: new Date().toISOString(), grades: S.grades};
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'}));
  a.download = `grades_${TASK}_${(S.grader || 'grader').toLowerCase().replace(/\W+/g, '_')}.json`; a.click(); };
document.getElementById('import').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = ev => { const f = ev.target.files[0]; if (!f) return; f.text().then(t => { const d = JSON.parse(t); S = {grader: d.grader || S.grader, grades: d.grades || {}, cur}; save(); render(); }); };
render();
</script>
