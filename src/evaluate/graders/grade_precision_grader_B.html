", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": true}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": true}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": true}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g130", "task": "precision", "model": "m05", "milestone": 4, "milestone_name": "Local Radar Update", "element": {"path": "TimeValue.accuracy", "kind": "attribute", "content": {"name": "accuracy", "type": "String", "description": "The stated accuracy of this value, e.g. +/-1 minute for actual times."}, "class": {"name": "TimeValue", "stereotype": "entity", "package": "Timings", "definition": "One recorded value of a time quantity, with the prefix that identifies its kind, its originator, and its accuracy."}}, "sentences": [{"id": "M4.definition.1", "field": "Definition", "text": "The flight enters the FIR (Flight Information Region) or the local airspace of the destination airport.", "hl": false}, {"id": "M4.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit that is associated with an airport.", "hl": false}, {"id": "M4.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "hl": false}, {"id": "M4.timing.1", "field": "Timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "hl": false}, {"id": "M4.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": true}, {"id": "M4.effect.1", "field": "Effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "hl": false}, {"id": "M4.effect.2", "field": "Effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "hl": false}, {"id": "M4.effect.3", "field": "Effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "hl": true}, {"id": "M4.effect.4", "field": "Effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "hl": true}, {"id": "M4.effect.5", "field": "Effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "hl": false}, {"id": "M4.effect.6", "field": "Effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.", "hl": false}, {"id": "M4.effect.7", "field": "Effect", "text": "Decisions such as the turn-round period, connecting passengers etc are taken and need to be stable at this event.", "hl": false}, {"id": "M4.effect.8", "field": "Effect", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "hl": false}, {"id": "M4.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M4.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M4.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": false}, {"id": "M4.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M4.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M4.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": false}, {"id": "M4.operational_status.1", "field": "Operational Status", "text": "FIR", "hl": false}, {"id": "M4.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g131", "task": "precision", "model": "m00", "milestone": 4, "milestone_name": "Local Radar Update", "element": {"path": "MilestoneEvent.milestoneNumber", "kind": "attribute", "content": {"name": "milestoneNumber", "type": "Integer", "description": "Number of the milestone (1-16)."}, "class": {"name": "MilestoneEvent", "stereotype": "control", "package": "Milestones", "definition": "One of the sixteen defined events in the CDM process, each with its own trigger, timing rule, effect, and procedure."}}, "sentences": [{"id": "M4.definition.1", "field": "Definition", "text": "The flight enters the FIR (Flight Information Region) or the local airspace of the destination airport.", "hl": false}, {"id": "M4.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit that is associated with an airport.", "hl": false}, {"id": "M4.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "hl": false}, {"id": "M4.timing.1", "field": "Timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "hl": false}, {"id": "M4.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M4.effect.1", "field": "Effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "hl": false}, {"id": "M4.effect.2", "field": "Effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "hl": false}, {"id": "M4.effect.3", "field": "Effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "hl": false}, {"id": "M4.effect.4", "field": "Effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "hl": true}, {"id": "M4.effect.5", "field": "Effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "hl": false}, {"id": "M4.effect.6", "field": "Effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.", "hl": true}, {"id": "M4.effect.7", "field": "Effect", "text": "Decisions such as the turn-round period, connecting passengers etc are taken and need to be stable at this event.", "hl": true}, {"id": "M4.effect.8", "field": "Effect", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "hl": false}, {"id": "M4.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M4.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M4.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": false}, {"id": "M4.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M4.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M4.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": false}, {"id": "M4.operational_status.1", "field": "Operational Status", "text": "FIR", "hl": false}, {"id": "M4.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g132", "task": "precision", "model": "m11", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "OperationalStatus", "kind": "enumeration", "content": {"name": "OperationalStatus", "package": "FlightData", "literals": ["INITIATED", "REGULATED", "AIRBORNE", "FIR", "FINAL", "LANDED", "IN_BLOCK", "SEQUENCED", "BOARDING", "READY", "OFF_BLOCK", "DEPARTED"]}, "class": null}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": true}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": true}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": true}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": false}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g133", "task": "precision", "model": "m01", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "AtcFlightPlanActivated.checkConsistency()", "kind": "operation", "content": {"signature": "checkConsistency(flightPlan: AtcFlightPlan, slot: AirportSlot, flight: Flight): Boolean", "description": "Checks consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent."}, "class": {"name": "AtcFlightPlanActivated", "stereotype": "control", "package": "Milestones", "definition": "Milestone 1: the ICAO flight plan is submitted to ATC and the Airport CDM Platform is initiated for the flight."}}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": true}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": true}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": true}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g134", "task": "precision", "model": "m07", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "TobtCheckMilestone.checkTobtConsistency()", "kind": "operation", "content": {"signature": "checkTobtConsistency(tobt: DateTime, atcFlightPlan: FlightPlan): Boolean", "description": "Checks whether the AO/GH TOBT is consistent with the ATC Flight Plan; shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT (milestones 4-9)."}, "class": {"name": "TobtCheckMilestone", "stereotype": "control", "package": "Milestones", "definition": "The common TOBT-feasibility check and TTOT-tolerance notification performed at each milestone from Local Radar Update through Final Confirmation of the TOBT: verify that TOBT is consistent with the ATC Flight Plan and inform Network Operations when TTOT changes by more than the agreed tolerance."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": false}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": false}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": true}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": true}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": false}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g135", "task": "precision", "model": "m07", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "OffBlockTime.accuracy", "kind": "attribute", "content": {"name": "accuracy", "type": "Duration", "description": "The accuracy of the value; AOBT is available with an accuracy of +/- 1 minute (milestone 15)."}, "class": {"name": "OffBlockTime", "stereotype": "entity", "package": "Timings", "definition": "A time quantity for the off-block event (SOBT, EOBT, TOBT, or AOBT), recorded with its prefix, origin, and time of update; every successive value is kept."}}, "sentences": [{"
