", "hl": false}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g163", "task": "precision", "model": "m12", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "Flight->OperationalStatus [association]", "kind": "relationship", "content": {"type": "association", "source": "Flight", "target": "OperationalStatus", "label": "has status", "source_multiplicity": "1", "target_multiplicity": "1"}, "class": null}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": false}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": true}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": true}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": false}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": true}]}, {"id": "g164", "task": "precision", "model": "m00", "milestone": 4, "milestone_name": "Local Radar Update", "element": {"path": "MilestoneEvent", "kind": "class", "content": {"name": "MilestoneEvent", "stereotype": "control", "package": "Milestones", "definition": "One of the sixteen defined events in the CDM process, each with its own trigger, timing rule, effect, and procedure."}, "class": null}, "sentences": [{"id": "M4.definition.1", "field": "Definition", "text": "The flight enters the FIR (Flight Information Region) or the local airspace of the destination airport.", "hl": false}, {"id": "M4.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit that is associated with an airport.", "hl": false}, {"id": "M4.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "hl": false}, {"id": "M4.timing.1", "field": "Timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "hl": false}, {"id": "M4.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M4.effect.1", "field": "Effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "hl": true}, {"id": "M4.effect.2", "field": "Effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "hl": false}, {"id": "M4.effect.3", "field": "Effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "hl": false}, {"id": "M4.effect.4", "field": "Effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "hl": false}, {"id": "M4.effect.5", "field": "Effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "hl": false}, {"id": "M4.effect.6", "field": "Effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.", "hl": false}, {"id": "M4.effect.7", "field": "Effect", "text": "Decisions such as the turn-round period, connecting passengers etc are taken and need to be stable at this event.", "hl": true}, {"id": "M4.effect.8", "field": "Effect", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "hl": false}, {"id": "M4.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M4.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M4.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": false}, {"id": "M4.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M4.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M4.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": false}, {"id": "M4.operational_status.1", "field": "Operational Status", "text": "FIR", "hl": false}, {"id": "M4.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g165", "task": "precision", "model": "m14", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "Eobt", "kind": "class", "content": {"name": "Eobt", "stereotype": "entity", "package": "Timings", "definition": "The Estimated Off-Block Time of a flight, used as the reference point for milestone triggers such as EOBT-3hr and EOBT-2hr."}, "class": null}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": true}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": true}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": true}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g166", "task": "precision", "model": "m05", "milestone": 11, "milestone_name": "Boarding Starts", "element": {"path": "TimeValue.accuracy", "kind": "attribute", "content": {"name": "accuracy", "type": "String", "description": "The stated accuracy of this value, e.g. +/-1 minute for actual times."}, "class": {"name": "TimeValue", "stereotype": "entity", "package": "Timings", "definition": "One recorded value of a time quantity, with the prefix that identifies its kind, its originator, and its accuracy."}}, "sentences": [{"id": "M11.definition.1", "field": "Definition", "text": "The gate is open for passengers to physically start boarding (independent of whether boarding takes place via an air-bridge/pier, aircraft steps or coaching to a stand).", "hl": false}, {"id": "M11.definition.2", "field": "Definition", "text": "This is not to be confused with the time passengers are pre-called to the gate via flight information display systems (FIDS) or public address systems.", "hl": false}, {"id": "M11.origin_and_priority.1", "field": "Origin and priority", "text": "Automatic from airport system or manual input by Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M11.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M11.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": true}, {"id": "M11.effect.1", "field": "Effect", "text": "When boarding commences it gives the Airport CDM Partners a good indication of whether the TOBT/TSAT will be respected.", "hl": false}, {"id": "M11.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Start Boarding Time (ASBT).", "hl": false}, {"id": "M11.procedures.2", "field": "Procedures", "text": "Second step: To check whether boarding starts in time to respect TOBT and inform the AO/GH in case TOBT needs to be updated.", "hl": false}, {"id": "M11.procedures.3", "field": "Procedures", "text": "Inform of Actual Start Boarding Time (ASBT) when it occurs.", "hl": true}, {"id": "M11.procedures.4", "field": "Procedures", "text": "At a certain time before TOBT (local variable e.g. corresponding to aircraft type) a check shall be performed to check the boarding status.", "hl": false}, {"id": "M11.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M11.procedures.6", "field": "Procedures", "text": "- a time variable <value> minutes before TOBT.", "hl": true}, {"id": "M11.operational_status.1", "field": "Operational Status", "text": "BOARDING", "hl": false}, {"id": "M11.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g167", "task": "precision", "model": "m10", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "TakeOffTime", "kind": "class", "content": {"name": "TakeOffTime", "stereotype": "entity", "package": "Timings", "definition": "The take-off time for the flight, held as ETOT, TTOT, CTOT or ATOT depending on its prefix."}, "class": null}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": true}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": false}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": true}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": true}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": false}]}, {"id": "g168", "task": "precision", "model": "m04", "milestone": 3, "milestone_name": "Take Off from Outstation", "element": {"path": "TakeOffFromOutstation->Milestone [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "TakeOffFromOutstation", "target": "Milestone", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M3.definition.1", "field": "Definition", "text": "The ATOT from the outstation (ADEP)", "hl": true}, {"id": "M3.origin_and_priority.1", "field": "Origin and priority", "text": "The outstation provides ATOT to the Network Operations and Aircraft Operator.", "hl": true}, {"id": "M3.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M3.data_quality.1", "field": "Data Quality", "text": "The accuracy of ATOT is +/- 1 minute.", "hl": false}, {"id": "M3.effect.1", "field": "Effect", "text": "If the departure airport is more than 3hrs flying time from the destination airport the ATOT is received from either the Network Operations FUM or via the Aircraft Operator / Ground Handler.", "hl": false}, {"id": "M3.effect.2", "field": "Effect", "text": "Using the ATOT an ELDT can be calculated by using the Estimated Elapsed Time on the FPL.", "hl": false}, {"id": "M3.effect.3", "field": "Effect", "text": "If the flight is within 3hrs flying time of the destination airport the Network Operations monitors progress of the flight using the ETFMS and send a Flight Update Message (FUM) that provides updates of the flight's progress.", "hl": false}, {"id": "M3.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH estimated landing time after take off from outstation are consistent with the outbound ATC Flight Plan, and when needed inform the Network Operations about the updated take off time estimates using a T-DPI-t Message.", "hl": false}, {"id": "M3.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan at take off from outstation.", "hl": false}, {"id": "M3.procedures.3", "field": "Procedures", "text": "A TTOT tolerance of 5 minutes is respected before Network Operations is informed of the updated TTOT.", "hl": false}, {"id": "M3.procedures.4", "field": "Procedures", "text": "Calculation basis for the TTOT shall take into account EIBT+MTTT+EXOT.", "hl": false}, {"id": "M3.procedures.5", "field": "Procedures", "text": "In case EOBT is later than EIBT+MTTT, TTOT equals EOBT+EXOT.", "hl": false}, {"id": "M3.procedures.6", "field": "Procedures", "text": "In the case where TOBT is available this prediction will overrule the EIBT+MTTT estimate, hence TTOT equals TOBT+EXOT.", "hl": false}, {"id": "M3.procedures.7", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M3.procedures.8", "field": "Procedures", "text": "- the take off from outstation.", "hl": true}, {"id": "M3.operational_status.1", "field": "Operational Status", "text": "AIRBORNE", "hl": false}, {"id": "M3.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g169", "task": "precision", "model": "m07", "milestone": 5, "milestone_name": "Final Approach", "element": {"path": "FinalApproachMilestone", "kind": "class", "content": {"name": "FinalApproachMilestone", "stereotype": "control", "package": "Milestones", "definition": "Milestone 5: commences the TOBT process on radar detection of the flight on final approach."}, "class": null}, "sentences": [{"id": "M5.definition.1", "field": "Definition", "text": "The flight enters the Final Approach phase at the destination airport.", "hl": false}, {"id": "M5.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from ATC.", "hl": false}, {"id": "M5.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system detects a flight based upon the assigned SSR code and identifies when the flight crosses either a defined range / position or passes/leaves a predetermined level.", "hl": false}, {"id": "M5.timing.1", "field": "Timing", "text": "Dependent upon local parameters that are defined by ATC.", "hl": false}, {"id": "M5.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M5.effect.1", "field": "Effect", "text": "Update of the ELDT to determine a new TOBT.", "hl": false}, {"id": "M5.effect.2", "field": "Effect", "text": "When a flight reaches this stage it is usually between 2 and 5 minutes from landing (depending on the parameter set by ATC).", "hl": false}, {"id": "M5.effect.3", "field": "Effect", "text": "This is often the prompt for many partners to start moving resources connected with the flight, such as positioning a parking marshal and ground handling services.", "hl": false}, {"id": "M5.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M5.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M5.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": true}, {"id": "M5.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M5.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M5.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": true}, {"id": "M5.operational_status.1", "field": "Operational Status", "text": "FINAL", "hl": false}, {"id": "M5.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g170", "task": "precision", "model": "m04", "milestone": 7, "milestone_name": "In-Block", "element": {"path": "InBlockTime", "kind": "class", "content": {"name": "InBlockTime", "stereotype": "entity", "package": "Timings", "definition": "The estimated or actual value of the in-block event (EIBT, AIBT) for an arriving flight."}, "class": null}, "sentences": [{"id": "M7.definition.1", "field": "Definition", "text": "AIBT - Actual In-Block Time.", "hl": true}, {"id": "M7.definition.2", "field": "Definition", "text": "This is the time that an aircraft arrives in-blocks.", "hl": false}, {"id": "M7.definition.3", "field": "Definition", "text": "(Equivalent to Airline/Handler ATA - Actual Time of Arrival, ACARS = IN) Note: ACGT is considered to commence at AIBT", "hl": false}, {"id": "M7.origin_and_priority.1", "field": "Origin and priority", "text": "ACARS equipped aircraft or automated docking systems or ATC systems (e.g. A-SMGCS) or by manual input.", "hl": false}, {"id": "M7.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M7.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M7.effect.1", "field": "Effect", "text": "The occurrence of AIBT should trigger an update of downstream estimates: TOBT and TTOT are updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the estimated turn-round period for the departing flight.", "hl": false}, {"id": "M7.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M7.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M7.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M7.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M7.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M7.procedures.6", "field": "Procedures", "text": "- Actual In Blocks Time: AIBT", "hl": true}, {"id": "M7.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M7.action_on_cdm.1", "field": "Action on CDM Operation", "text": "EIBT changes to AIBT TOBT and TTOT updated", "hl": true}]}, {"id": "g171", "task": "precision", "model": "m01", "milestone": 5, "milestone_name": "Final Approach", "element": {"path": "AircraftOperator", "kind": "class", "content": {"name": "AircraftOperator", "stereotype": "entity", "package": "Stakeholders", "definition": "The airline or operator that submits the ATC flight plan, provides TOBT and turn-round information, and manages the aircraft's turn-round."}, "class": null}, "sentences": [{"id": "M5.definition.1", "field": "Definition", "text": "The flight enters the Final Approach phase at the destination airport.", "hl": false}, {"id": "M5.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from ATC.", "hl": true}, {"id": "M5.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system detects a flight based upon the assigned SSR code and identifies when the flight crosses either a defined range / position or passes/leaves a predetermined level.", "hl": false}, {"id": "M5.timing.1", "field": "Timing", "text": "Dependent upon local parameters that are defined by ATC.", "hl": false}, {"id": "M5.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M5.effect.1", "field": "Effect", "text": "Update of the ELDT to determine a new TOBT.", "hl": false}, {"id": "M5.effect.2", "field": "Effect", "text": "When a flight reaches this stage it is usually between 2 and 5 minutes from landing (depending on the parameter set by ATC).", "hl": false}, {"id": "M5.effect.3", "field": "Effect", "text": "This is often the prompt for many partners to start moving resources connected with the flight, such as positioning a parking marshal and ground handling services.", "hl": false}, {"id": "M5.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M5.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M5.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": true}, {"id": "M5.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M5.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M5.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": false}, {"id": "M5.operational_status.1", "field": "Operational Status", "text": "FINAL", "hl": false}, {"id": "M5.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g172", "task": "precision", "model": "m09", "milestone": 14, "milestone_name": "Start Up Approved", "element": {"path": "AirportCDMPlatform->Milestone [dependency]", "kind": "relationship", "content": {"type": "dependency", "source": "AirportCDMPlatform", "target": "Milestone", "label": "performs the ACISP action for", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M14.definition.1", "field": "Definition", "text": "ASAT - Actual start up Approval Time.", "hl": false}, {"id": "M14.definition.2", "field": "Definition", "text": "This is the time that an aircraft receives its start up approval.", "hl": false}, {"id": "M14.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": false}, {"id": "M14.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": true}, {"id": "M14.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M14.effect.1", "field": "Effect", "text": "On receipt of ATC approval, the aircraft will start up, push back and start to taxi.", "hl": false}, {"id": "M14.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual start up approval Time (ASAT) in the Airport CDM Platform and that the aircraft has received start up approval / push-back clearance.", "hl": true}, {"id": "M14.procedures.2", "field": "Procedures", "text": "Second step: To check if ASAT is in accordance to TSAT and to alert all relevant Airport CDM Partners when no start up has been granted.", "hl": true}, {"id": "M14.procedures.3", "field": "Procedures", "text": "Inform of ASAT when it occurs.", "hl": false}, {"id": "M14.procedures.4", "field": "Procedures", "text": "In case the start up approval is not granted at TSAT + tolerance, all relevant partners should be informed.", "hl": false}, {"id": "M14.procedures.5", "field": "Procedures", "text": "The flight will be re-sequenced.", "hl": false}, {"id": "M14.procedures.6", "field": "Procedures", "text": "Start up request by flight crew (voice or DCL) or a locally defined time around TSAT if Milestone Process 13 is omitted.", "hl": false}, {"id": "M14.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M14.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g173", "task": "precision", "model": "m16", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "Flight.updateOperationalStatus()", "kind": "operation", "content": {"signature": "updateOperationalStatus(newStatus: FlightOperationalStatus): void", "description": "Changes the flight's operational status as each milestone occurs."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "A single flight movement, arriving or departing, tracked through the sixteen milestones of the CDM turn-round process."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": false}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": false}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": false}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": true}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": true}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": true}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g174", "task": "precision", "model": "m10", "milestone": 13, "milestone_name": "Start Up Requested", "element": {"path": "StartUpApprovalTime", "kind": "class", "content": {"name": "StartUpApprovalTime", "stereotype": "entity", "package": "Timings", "definition": "The start-up approval time for the flight, held as TSAT or ASAT depending on its prefix."}, "class": null}, "sentences": [{"id": "M13.definition.1", "field": "Definition", "text": "The time that start up is requested (ASRT).", "hl": true}, {"id": "M13.origin_and_priority.1", "field": "Origin and priority", "text": "ATC (based on pilot request).", "hl": false}, {"id": "M13.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M13.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M13.effect.1", "field": "Effect", "text": "ATC confirms TSAT to the pilot in order to maintain the aircraft in the pre-departure sequence.", "hl": false}, {"id": "M13.effect.2", "field": "Effect", "text": "Provided the aircraft was ready on time (ARDT), it is now up to ATC to assure that a regulated flight can respect its CTOT.", "hl": false}, {"id": "M13.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Start up Request Time (ASRT) in the Airport CDM Platform.", "hl": false}, {"id": "M13.procedures.2", "field": "Procedures", "text": "Second step: to alert all relevant Airport CDM Partners when no start up has been re-quested inside the locally agreed TSAT tolerance window.", "hl": false}, {"id": "M13.procedures.3", "field": "Procedures", "text": "Inform of ASRT when it occurs.", "hl": true}, {"id": "M13.procedures.4", "field": "Procedures", "text": "If the start up request is not made by TSAT + tolerance, the AO/GH is informed that no start up has been requested, and should update TOBT.", "hl": false}, {"id": "M13.procedures.5", "field": "Procedures", "text": "Timestamp when the tolerance window has passed at TSAT.", "hl": true}, {"id": "M13.operational_status.1", "field": "Operational Status", "text": "N.A", "hl": false}, {"id": "M13.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g175", "task": "precision", "model": "m01", "milestone": 8, "milestone_name": "Ground Handling Started", "element": {"path": "Milestone.dataQuality", "kind": "attribute", "content": {"name": "dataQuality", "type": "String", "description": "The stated data quality/accuracy for information at this milestone."}, "class": {"name": "Milestone", "stereotype": "control", "package": "Milestones", "definition": "A superclass for the sixteen CDM milestone events, each with a definition, timing rule, trigger, effect, and procedure that changes the flight's operational status."}}, "sentences": [{"id": "M8.definition.1", "field": "Definition", "text": "Commence of Ground Handling Operations (ACGT).", "hl": false}, {"id": "M8.definition.2", "field": "Definition", "text": "Note: this milestone is specific to flights that are the first operation of the day or that have been long term parked.", "hl": false}, {"id": "M8.definition.3", "field": "Definition", "text": "For flights that are on a normal turn-round ACGT is considered to commence at AIBT.", "hl": false}, {"id": "M8.origin_and_priority.1", "field": "Origin and priority", "text": "Aircraft Operator / Ground Handler will provide the information.", "hl": true}, {"id": "M8.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": true}, {"id": "M8.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": true}, {"id": "M8.effect.1", "field": "Effect", "text": "The occurrence of ACGT triggers an update of downstream estimates: TOBT is updated automatically or inserted manually by the Aircraft Operator / Ground Handler, calculated on the basis of the estimated turn-round period for the departing flight.", "hl": false}, {"id": "M8.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M8.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the updated TOBT or ATC Flight Plan.", "hl": false}, {"id": "M8.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M8.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M8.procedures.6", "field": "Procedures", "text": "- Actual Commence of Ground Handling: ACGT", "hl": false}, {"id": "M8.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M8.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ETTT/TOBT, TTOT updated", "hl": false}]}, {"id": "g176", "task": "precision", "model": "m00", "milestone": 11, "milestone_name": "Boarding Starts", "element": {"path": "Flight.flightId", "kind": "attribute", "content": {"name": "flightId", "type": "String", "description": "Identifier of the flight."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "An arriving or departing flight tracked through the CDM process from ATC Flight Plan activation to take-off."}}, "sentences": [{"id": "M11.definition.1", "field": "Definition", "text": "The gate is open for passengers to physically start boarding (independent of whether boarding takes place via an air-bridge/pier, aircraft steps or coaching to a stand).", "hl": false}, {"id": "M11.definition.2", "field": "Definition", "text": "This is not to be confused with the time passengers are pre-called to the gate via flight information display systems (FIDS) or public address systems.", "hl": true}, {"id": "M11.origin_and_priority.1", "field": "Origin and priority", "text": "Automatic from airport system or manual input by Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M11.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M11.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M11.effect.1", "field": "Effect", "text": "When boarding commences it gives the Airport CDM Partners a good indication of whether the TOBT/TSAT will be respected.", "hl": false}, {"id": "M11.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Start Boarding Time (ASBT).", "hl": false}, {"id": "M11.procedures.2", "field": "Procedures", "text": "Second step: To check whether boarding starts in time to respect TOBT and inform the AO/GH in case TOBT needs to be updated.", "hl": false}, {"id": "M11.procedures.3", "field": "Procedures", "text": "Inform of Actual Start Boarding Time (ASBT) when it occurs.", "hl": false}, {"id": "M11.procedures.4", "field": "Procedures", "text": "At a certain time before TOBT (local variable e.g. corresponding to aircraft type) a check shall be performed to check the boarding status.", "hl": false}, {"id": "M11.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M11.procedures.6", "field": "Procedures", "text": "- a time variable <value> minutes before TOBT.", "hl": false}, {"id": "M11.operational_status.1", "field": "Operational Status", "text": "BOARDING", "hl": false}, {"id": "M11.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g177", "task": "precision", "model": "m06", "milestone": 16, "milestone_name": "Take Off", "element": {"path": "AtcSystem.systemType", "kind": "attribute", "content": {"name": "systemType", "type": "String", "description": "e.g. ACC, Approach Control Unit, A-SMGCS, Tower FDPS, Radar."}, "class": {"name": "AtcSystem", "stereotype": "boundary", "package": "Systems", "definition": "The ATC/radar/A-SMGCS system that detects a flight and provides actual times such as ATOT, ALDT and AIBT."}}, "sentences": [{"id": "M16.definition.1", "field": "Definition", "text": "ATOT - Actual Take Off Time.", "hl": false}, {"id": "M16.definition.2", "field": "Definition", "text": "This is the time that an aircraft takes off from the runway.", "hl": false}, {"id": "M16.definition.3", "field": "Definition", "text": "(Equivalent to ATC ATD-Actual Time of Departure, ACARS = OFF).", "hl": true}, {"id": "M16.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by ATC system or from ACARS equipped aircraft.", "hl": true}, {"id": "M16.timing.1", "field": "Timing", "text": "The information is directly available as soon as possible after occurrence of the milestone.", "hl": false}, {"id": "M16.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M16.effect.1", "field": "Effect", "text": "FSA and MVT messages are sent.", "hl": false}, {"id": "M16.procedures.1", "field": "Procedures", "text": "To inform all relevant Airport CDM Partners about the actual take off.", "hl": false}, {"id": "M16.procedures.2", "field": "Procedures", "text": "An airborne message is generated and the flight is removed from the departure sequence.", "hl": false}, {"id": "M16.procedures.3", "field": "Procedures", "text": "This process is triggered by Tower FDPS, A-SMGCS / Radar detection or ACARS.", "hl": true}, {"id": "M16.operational_status.1", "field": "Operational Status", "text": "DEPARTED / TAKE OFF", "hl": false}, {"id": "M16.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ATOT recorded", "hl": false}]}, {"id": "g178", "task": "precision", "model": "m16", "milestone": 11, "milestone_name": "Boarding Starts", "element": {"path": "Flight->BoardingTime [association]", "kind": "relationship", "content": {"type": "association", "source": "Flight", "target": "BoardingTime", "label": "has", "source_multiplicity": "1", "target_multiplicity": "0..1"}, "class": null}, "sentences": [{"id": "M11.definition.1", "field": "Definition", "text": "The gate is open for passengers to physically start boarding (independent of whether boarding takes place via an air-bridge/pier, aircraft steps or coaching to a stand).", "hl": false}, {"id": "M11.definition.2", "field": "Definition", "text": "This is not to be confused with the time passengers are pre-called to the gate via flight information display systems (FIDS) or public address systems.", "hl": true}, {"id": "M11.origin_and_priority.1", "field": "Origin and priority", "text": "Automatic from airport system or manual input by Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M11.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M11.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M11.effect.1", "field": "Effect", "text": "When boarding commences it gives the Airport CDM Partners a good indication of whether the TOBT/TSAT will be respected.", "hl": false}, {"id": "M11.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Start Boarding Time (ASBT).", "hl": false}, {"id": "M11.procedures.2", "field": "Procedures", "text": "Second step: To check whether boarding starts in time to respect TOBT and inform the AO/GH in case TOBT needs to be updated.", "hl": false}, {"id": "M11.procedures.3", "field": "Procedures", "text": "Inform of Actual Start Boarding Time (ASBT) when it occurs.", "hl": true}, {"id": "M11.procedures.4", "field": "Procedures", "text": "At a certain time before TOBT (local variable e.g. corresponding to aircraft type) a check shall be performed to check the boarding status.", "hl": false}, {"id": "M11.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M11.procedures.6", "field": "Procedures", "text": "- a time variable <value> minutes before TOBT.", "hl": false}, {"id": "M11.operational_status.1", "field": "Operational Status", "text": "BOARDING", "hl": true}, {"id": "M11.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g179", "task": "precision", "model": "m08", "milestone": 4, "milestone_name": "Local Radar Update", "element": {"path": "MilestoneProcess.milestoneNumber", "kind": "attribute", "content": {"name": "milestoneNumber", "type": "int", "description": "Sequence number of the milestone (1-16)."}, "class": {"name": "MilestoneProcess", "stereotype": "control", "package": "CDM Process", "definition": "One of the sixteen defined milestone procedures, each with a trigger, a consistency check, resulting operational status change and CDM actions."}}, "sentences": [{"id": "M4.definition.1", "field": "Definition", "text": "The flight enters the FIR (Flight Information Region) or the local airspace of the destination airport.", "hl": false}, {"id": "M4.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit that is associated with an airport.", "hl": false}, {"id": "M4.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "hl": false}, {"id": "M4.timing.1", "field": "Timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "hl": false}, {"id": "M4.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M4.effect.1", "field": "Effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "hl": false}, {"id": "M4.effect.2", "field": "Effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "hl": false}, {"id": "M4.effect.3", "field": "Effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "hl": false}, {"id": "M4.effect.4", "field": "Effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "hl": true}, {"id": "M4.effect.5", "field": "Effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "hl": false}, {"id": "M4.effect.6", "field": "Effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.", "hl": true}, {"id": "M4.effect.7", "field": "Effect", "text": "Decisions such as the turn-round period, connecting passengers etc are taken and need to be stable at this event.", "hl": false}, {"id": "M4.effect.8", "field": "Effect", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "hl": false}, {"id": "M4.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M4.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M4.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": false}, {"id": "M4.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M4.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": true}, {"id": "M4.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": false}, {"id": "M4.operational_status.1", "field": "Operational Status", "text": "FIR", "hl": false}, {"id": "M4.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g180", "task": "precision", "model": "m03", "milestone": 1, "milestone_name": "ATC Flight Plan Activated", "element": {"path": "ELDT->TimeQuantity [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "ELDT", "target": "TimeQuantity", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M1.definition.1", "field": "Definition", "text": "The ICAO flight plan is submitted to ATC.", "hl": false}, {"id": "M1.definition.2", "field": "Definition", "text": "The Airport CDM Platform is initiated for this flight, and all available information is processed.", "hl": false}, {"id": "M1.origin_and_priority.1", "field": "Origin and priority", "text": "The ATC Flight Plan is submitted by the Aircraft Operator and distributed by the IFPS.", "hl": false}, {"id": "M1.origin_and_priority.2", "field": "Origin and priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "hl": false}, {"id": "M1.timing.1", "field": "Timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "hl": false}, {"id": "M1.timing.2", "field": "Timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "hl": false}, {"id": "M1.data_quality.1", "field": "Data Quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "hl": false}, {"id": "M1.effect.1", "field": "Effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "hl": false}, {"id": "M1.effect.2", "field": "Effect", "text": "For coordinated airports, the outbound flight is already known.", "hl": false}, {"id": "M1.effect.3", "field": "Effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "hl": false}, {"id": "M1.effect.4", "field": "Effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "hl": true}, {"id": "M1.effect.5", "field": "Effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "hl": false}, {"id": "M1.effect.6", "field": "Effect", "text": "The flight is ready not later than 15 minutes after the planned EOBT.", "hl": true}, {"id": "M1.effect.7", "field": "Effect", "text": "The DPI process commences the correct messaging with Network Operations (if implemented - see attachment 2 for details).", "hl": false}, {"id": "M1.procedures.1", "field": "Procedures", "text": "To check consistency between ATC Flight Plan, Airport Slot and Airport flight data and then confirm the flight to the Network Operations and allow further local processing of the flight.", "hl": false}, {"id": "M1.procedures.2", "field": "Procedures", "text": "This check shall be performed to verify the consistency between the ATC Flight Plan, Airport Slot and Airport flight data before the first E-DPI is sent.", "hl": false}, {"id": "M1.procedures.3", "field": "Procedures", "text": "The AO must provide correct information before this first E-DPI message, in order to feed Network Operations with consistent SOBT, aircraft registration, and first destination data, as early in time as possible.", "hl": false}, {"id": "M1.procedures.4", "field": "Procedures", "text": "The E-DPI message should not be sent if no or inconsistent information is provided.", "hl": false}, {"id": "M1.procedures.5", "field": "Procedures", "text": "This process is triggered by:", "hl": false}, {"id": "M1.procedures.6", "field": "Procedures", "text": "- The first activation of the ATC Flight Plan (earliest EOBT-3 hr), or", "hl": false}, {"id": "M1.procedures.7", "field": "Procedures", "text": "- New or late submissions of the ATC Flight Plan, after cancellation or revised EOBT", "hl": false}, {"id": "M1.operational_status.1", "field": "Operational Status", "text": "INITIATED", "hl": false}, {"id": "M1.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT and EIBT updated for an arrival EOBT and ETOT updated for a departure The DPI process commences (if implemented - see section 3.7.3 for details).", "hl": true}]}, {"id": "g181", "task": "precision", "model": "m00", "milestone": 5, "milestone_name": "Final Approach", "element": {"path": "RadarSystem", "kind": "class", "content": {"name": "RadarSystem", "stereotype": "boundary", "package": "Systems", "definition": "The radar system associated with an airport that detects a flight based on its assigned SSR code."}, "class": null}, "sentences": [{"id": "M5.definition.1", "field": "Definition", "text": "The flight enters the Final Approach phase at the destination airport.", "hl": true}, {"id": "M5.origin_and_priority.1", "field": "Origin and priority", "text": "This information is normally available from ATC.", "hl": false}, {"id": "M5.origin_and_priority.2", "field": "Origin and priority", "text": "The radar system detects a flight based upon the assigned SSR code and identifies when the flight crosses either a defined range / position or passes/leaves a predetermined level.", "hl": true}, {"id": "M5.timing.1", "field": "Timing", "text": "Dependent upon local parameters that are defined by ATC.", "hl": false}, {"id": "M5.data_quality.1", "field": "Data Quality", "text": "Must be equal to the accuracy of the ATC system.", "hl": false}, {"id": "M5.effect.1", "field": "Effect", "text": "Update of the ELDT to determine a new TOBT.", "hl": false}, {"id": "M5.effect.2", "field": "Effect", "text": "When a flight reaches this stage it is usually between 2 and 5 minutes from landing (depending on the parameter set by ATC).", "hl": false}, {"id": "M5.effect.3", "field": "Effect", "text": "This is often the prompt for many partners to start moving resources connected with the flight, such as positioning a parking marshal and ground handling services.", "hl": false}, {"id": "M5.procedures.1", "field": "Procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": false}, {"id": "M5.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M5.procedures.3", "field": "Procedures", "text": "This check shall be performed to verify feasibility of the ATC Flight Plan given the up-dated TOBT.", "hl": false}, {"id": "M5.procedures.4", "field": "Procedures", "text": "The TTOT tolerance is respected before Network Operations is informed of updated TTOT.", "hl": false}, {"id": "M5.procedures.5", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M5.procedures.6", "field": "Procedures", "text": "- the detection of the flight by radar in either FIR, TMA, or on Final Approach.", "hl": true}, {"id": "M5.operational_status.1", "field": "Operational Status", "text": "FINAL", "hl": false}, {"id": "M5.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ELDT, EIBT, TOBT and TTOT updated", "hl": false}]}, {"id": "g182", "task": "precision", "model": "m15", "milestone": 16, "milestone_name": "Take Off", "element": {"path": "TimeQuantity.recordedAt", "kind": "attribute", "content": {"name": "recordedAt", "type": "DateTime", "description": "The time this value was recorded; successive values are appended rather than overwriting earlier ones so the turn-round can be analysed afterwards."}, "class": {"name": "TimeQuantity", "stereotype": "entity", "package": "Timings", "definition": "A general time value describing a flight's progress toward or through a milestone event, carrying its prefix, origin, accuracy, and successive updates."}}, "sentences": [{"id": "M16.definition.1", "field": "Definition", "text": "ATOT - Actual Take Off Time.", "hl": true}, {"id": "M16.definition.2", "field": "Definition", "text": "This is the time that an aircraft takes off from the runway.", "hl": true}, {"id": "M16.definition.3", "field": "Definition", "text": "(Equivalent to ATC ATD-Actual Time of Departure, ACARS = OFF).", "hl": false}, {"id": "M16.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by ATC system or from ACARS equipped aircraft.", "hl": false}, {"id": "M16.timing.1", "field": "Timing", "text": "The information is directly available as soon as possible after occurrence of the milestone.", "hl": false}, {"id": "M16.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M16.effect.1", "field": "Effect", "text": "FSA and MVT messages are sent.", "hl": false}, {"id": "M16.procedures.1", "field": "Procedures", "text": "To inform all relevant Airport CDM Partners about the actual take off.", "hl": false}, {"id": "M16.procedures.2", "field": "Procedures", "text": "An airborne message is generated and the flight is removed from the departure sequence.", "hl": false}, {"id": "M16.procedures.3", "field": "Procedures", "text": "This process is triggered by Tower FDPS, A-SMGCS / Radar detection or ACARS.", "hl": false}, {"id": "M16.operational_status.1", "field": "Operational Status", "text": "DEPARTED / TAKE OFF", "hl": false}, {"id": "M16.action_on_cdm.1", "field": "Action on CDM Operation", "text": "ATOT recorded", "hl": true}]}, {"id": "g183", "task": "precision", "model": "m00", "milestone": 9, "milestone_name": "Final Confirmation of the TOBT", "element": {"path": "Flight.direction", "kind": "attribute", "content": {"name": "direction", "type": "String", "description": "Whether the flight is an arrival or a departure within its turn-round."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flights", "definition": "An arriving or departing flight tracked through the CDM process from ATC Flight Plan activation to take-off."}}, "sentences": [{"id": "M9.definition.1", "field": "Definition", "text": "The time at which the Aircraft Operator or Ground Handler provide their most accurate TOBT taking into account the operational situation.", "hl": false}, {"id": "M9.origin_and_priority.1", "field": "Origin and priority", "text": "The Aircraft Operator / Ground Handler provides the information.", "hl": false}, {"id": "M9.timing.1", "field": "Timing", "text": "The information is provided t minutes before EOBT (t is a parameter time agreed locally).", "hl": false}, {"id": "M9.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M9.effect.1", "field": "Effect", "text": "The aim of the final TOBT is to give a timely, accurate and reliable assessment of the off-block time.", "hl": false}, {"id": "M9.effect.2", "field": "Effect", "text": "It is recognised that main benefits of sharing the TOBT are expected in case of disruptions (internal or external).", "hl": false}, {"id": "M9.effect.3", "field": "Effect", "text": "In such cases, the difference between EOBT (shared by ATC, Network Operations and Stand / Gate Management) and TOBT may be important.", "hl": false}, {"id": "M9.effect.4", "field": "Effect", "text": "An accurate TOBT at [EOBT-t minutes] is a pre-requisite for ATC to establish a push back / pre-departure sequence.", "hl": false}, {"id": "M9.effect.5", "field": "Effect", "text": "Emphasis is put on the need for the Aircraft Operator to integrate his own strategy to compute a TOBT related to the flight.", "hl": false}, {"id": "M9.effect.6", "field": "Effect", "text": "Following the receipt of the TOBT, the ATC system will calculate and provide the Estimated Taxi-Out Time (EXOT) based on the predicted traffic load, gate / stand location, runway in use, and waiting period at the Holding Position, etc. The flight is introduced into the pre-departure sequence.", "hl": true}, {"id": "M9.effect.7", "field": "Effect", "text": "The Aircraft Operator / Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": true}, {"id": "M9.procedures.1", "field": "Procedures", "text": "To check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "hl": true}, {"id": "M9.procedures.2", "field": "Procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "hl": false}, {"id": "M9.procedures.3", "field": "Procedures", "text": "This check should be performed at a predefined time (local parameter) to confirm TOBT prior to TSAT issue and verify feasibility of the ATC Flight Plan estimates given the updated TOBT.", "hl": false}, {"id": "M9.procedures.4", "field": "Procedures", "text": "A TTOT tolerance is respected before Network Operations is informed on updated TTOT.", "hl": false}, {"id": "M9.procedures.5", "field": "Procedures", "text": "This Milestone Process is actually constantly applicable in the CDM Platform, as soon as a TOBT is available.", "hl": false}, {"id": "M9.procedures.6", "field": "Procedures", "text": "However the confirmed TOBT prior to TSAT has special status, where AO/GH check the quality of TOBT before TSAT issue.", "hl": false}, {"id": "M9.operational_status.1", "field": "Operational Status", "text": "IN-BLOCK", "hl": false}, {"id": "M9.action_on_cdm.1", "field": "Action on CDM Operation", "text": "This process is triggered by - a new TOBT or TTOT update.", "hl": false}, {"id": "M9.action_on_cdm.2", "field": "Action on CDM Operation", "text": "No need to confirm an existing TOBT if it has been manually modified before.", "hl": false}]}, {"id": "g184", "task": "precision", "model": "m08", "milestone": 10, "milestone_name": "TSAT Issued", "element": {"path": "Flight.eobt", "kind": "attribute", "content": {"name": "eobt", "type": "DateTime", "description": "Estimated Off-Block Time, normally known 3 hours in advance and shared by ATC, Network Operations and Stand/Gate Management."}, "class": {"name": "Flight", "stereotype": "entity", "package": "Flight Management", "definition": "An individual flight (arrival or departure leg) tracked through the Airport CDM Platform from flight-plan activation to take off."}}, "sentences": [{"id": "M10.definition.1", "field": "Definition", "text": "The time ATC issues the Target Start Up Approval Time", "hl": true}, {"id": "M10.origin_and_priority.1", "field": "Origin and priority", "text": "ATC", "hl": true}, {"id": "M10.timing.1", "field": "Timing", "text": "The information is provided t-minutes before EOBT, where t is a parameter agreed locally", "hl": true}, {"id": "M10.data_quality.1", "field": "Data Quality", "text": "Accuracy is agreed locally.", "hl": false}, {"id": "M10.effect.1", "field": "Effect", "text": "The flight is stabilised into the pre-departure sequence.", "hl": false}, {"id": "M10.effect.2", "field": "Effect", "text": "The Aircraft Operator/ Ground Handler, in coordination with the aircrew, can manage the turn-round process accordingly.", "hl": false}, {"id": "M10.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant partners of the TSAT that has been allocated to the flight.", "hl": false}, {"id": "M10.procedures.2", "field": "Procedures", "text": "The Network Operations is informed by a T-DPI-s for non regulated flights.", "hl": false}, {"id": "M10.procedures.3", "field": "Procedures", "text": "Second step: To check whether the number of TOBT updates exceeds a tolerance defined locally, after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.4", "field": "Procedures", "text": "First: The TSAT will indicate to the partners the time when the start up approval can be expected.", "hl": false}, {"id": "M10.procedures.5", "field": "Procedures", "text": "Network Operations will be informed with a T-DPI-s for non regulated flights.", "hl": false}, {"id": "M10.procedures.6", "field": "Procedures", "text": "No check is performed.", "hl": false}, {"id": "M10.procedures.7", "field": "Procedures", "text": "Second: A check shall be performed to see the number of TOBT updates after TSAT has been issued.", "hl": false}, {"id": "M10.procedures.8", "field": "Procedures", "text": "In case the number of TOBT updates exceeds a threshold, then the TOBT input should be processed according to local procedure.", "hl": false}, {"id": "M10.procedures.9", "field": "Procedures", "text": "This process is triggered by", "hl": false}, {"id": "M10.procedures.10", "field": "Procedures", "text": "- A defined time (local parameter) before TOBT", "hl": false}, {"id": "M10.procedures.11", "field": "Procedures", "text": "- TOBT update after TSAT issue", "hl": false}, {"id": "M10.operational_status.1", "field": "Operational Status", "text": "SEQUENCED", "hl": false}, {"id": "M10.action_on_cdm.1", "field": "Action on CDM Operation", "text": "TTOT updated", "hl": false}]}, {"id": "g185", "task": "precision", "model": "m09", "milestone": 15, "milestone_name": "Off-Block", "element": {"path": "OffBlockMilestone->Milestone [generalization]", "kind": "relationship", "content": {"type": "generalization", "source": "OffBlockMilestone", "target": "Milestone", "label": "", "source_multiplicity": "", "target_multiplicity": ""}, "class": null}, "sentences": [{"id": "M15.definition.1", "field": "Definition", "text": "AOBT - Actual Off-Block Time.", "hl": true}, {"id": "M15.definition.2", "field": "Definition", "text": "The time the aircraft pushes back/vacates the parking position (Equivalent to Airline/Handler ATD - Actual Time of Departure ACARS=OUT).", "hl": false}, {"id": "M15.origin_and_priority.1", "field": "Origin and priority", "text": "ACARS equipped aircraft or automated docking systems or ATC systems (e.g. A-SMGCS) or by manual input.", "hl": false}, {"id": "M15.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M15.data_quality.1", "field": "Data Quality", "text": "Data is available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M15.effect.1", "field": "Effect", "text": "TTOT updated considering the EXOT.", "hl": false}, {"id": "M15.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Off-Block Time (AOBT) in the Airport CDM Platform and that the aircraft has commenced push-back / taxi from parking position.", "hl": false}, {"id": "M15.procedures.2", "field": "Procedures", "text": "Second step: To check if TTOT changes by more than the agreed tolerance and inform Network Operations.", "hl": false}, {"id": "M15.procedures.3", "field": "Procedures", "text": "Inform of AOBT when it occurs.", "hl": false}, {"id": "M15.procedures.4", "field": "Procedures", "text": "AOBT always triggers an A-DPI message to Network Operations or in the case of remote holding at a defined time prior to TTOT.", "hl": false}, {"id": "M15.procedures.5", "field": "Procedures", "text": "After a first A-DPI is sent this check shall be performed to check TTOT updates against the TTOT tolerance before Network Operations is informed, with a new A-DPI, of the updated TTOT.", "hl": false}, {"id": "M15.procedures.6", "field": "Procedures", "text": "This process is triggered by AOBT detection.", "hl": false}, {"id": "M15.operational_status.1", "field": "Operational Status", "text": "OFF-BLOCK", "hl": true}, {"id": "M15.action_on_cdm.1", "field": "Action on CDM Operation", "text": "AOBT recorded", "hl": true}]}, {"id": "g186", "task": "precision", "model": "m02", "milestone": 12, "milestone_name": "Aircraft Ready", "element": {"path": "TimeQuantity", "kind": "class", "content": {"name": "TimeQuantity", "stereotype": "entity", "package": "Timings", "definition": "A named time value describing a flight's progress toward a milestone event, distinguished by a prefix (Scheduled, Estimated, Target, Actual, Calculated) and an event (e.g. Off-Block, In-Block, Landing, Take-Off, Start-Up Approval, Boarding, Ready, Start-Up Request, Ground Handling Start); every successive value is appended with its originator and time of update rather than overwritten."}, "class": null}, "sentences": [{"id": "M12.definition.1", "field": "Definition", "text": "The time when all doors are closed, boarding bridge removed, push back vehicle connected, ready to taxi immediately upon reception of TWR instructions (ARDT).", "hl": false}, {"id": "M12.origin_and_priority.1", "field": "Origin and priority", "text": "Provided by the Aircraft Operator/ Ground Handler.", "hl": false}, {"id": "M12.timing.1", "field": "Timing", "text": "The information is directly available after occurrence of the milestone.", "hl": false}, {"id": "M12.data_quality.1", "field": "Data Quality", "text": "Data is directly available with an accuracy of +/- 1 minute.", "hl": false}, {"id": "M12.effect.1", "field": "Effect", "text": "ATC refines the pre-departure sequence.", "hl": false}, {"id": "M12.effect.2", "field": "Effect", "text": "The pilot requests start up just before TSAT, following coordination with the Ground Handler.", "hl": true}, {"id": "M12.effect.3", "field": "Effect", "text": "(Dispatcher / Supervisor / Redcap).", "hl": false}, {"id": "M12.procedures.1", "field": "Procedures", "text": "First step: To inform all relevant Airport CDM Partners of Actual Ready Time (ARDT) in the Airport CDM Platform and that the aircraft is ready for start up / push-back.", "hl": false}, {"id": "M12.procedures.2", "field": "Procedures", "text": "Second step: To inform the AO/GH that TOBT has passed and the Airport CDM Platform has not yet received ARDT or Ready Status (RDY).", "hl": true}, {"id": "M12.procedures.3", "field": "Procedures", "text": "Inform of ARDT or RDY confirming that the flight follows the indicated TOBT.", "hl": true}, {"id": "M12.procedures.4", "field": "Procedures", "text": "At TOBT + tolerance the AO/GH are informed that TOBT has passed and there has not been a ready status message yet.", "hl": false}, {"id": "M12.procedures.5", "field": "Procedures", "text": "This procedure is triggered by", "hl": false}, {"id": "M12.procedures.6", "field": "Procedures", "text": "- an input to the Airport CDM Platform.", "hl": false}, {"id": "M12.operational_status.1", "field": "Operational Status", "text": "READY", "hl": false}, {"id": "M12.action_on_cdm.1", "field": "Action on CDM Operation", "text": "N.A", "hl": false}]}, {"id": "g187", "task": "precision", "model": "m04", "milestone": 2, "milestone_name": "EOBT - 2 hr", "element": {"path": "DurationEstimate", "kind": "class", "content": {"name": "DurationEstimate", "stereotype": "entity", "package": "Timings", "definition": "A duration used to calculate other time quantities, such as estimated taxi-out time (EXOT), estimated taxi-in time (EXIT), minimum turn-round time (MTTT), estimated turn-round time (ETTT), or the flight plan's estimated elapsed time."}, "class": null}, "sentences": [{"id": "M2.definition.1", "field": "Definition", "text": "At EOBT-2 hr most flights will be known in the Airport CDM Platform including if they are regulated or not.", "hl": false}, {"id": "M2.definition.2", "field": "Definition", "text": "All regulated flights receive a CTOT from Network Operations.", "hl": false}, {"id": "M2.origin_and_priority.1", "field": "Origin and priority", "text": "The CTOT is issued by the Network Operations and is sent to relevant ATS units as well as the departure aerodrome.", "hl": false}, {"id": "M2.origin_and_priority.2", "fie
