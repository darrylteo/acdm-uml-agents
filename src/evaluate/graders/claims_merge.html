  .rule label { color:var(--muted); font-size:12px; padding-top:3px; white-space:nowrap; }

r and distributed by the IFPS.", "judge": {"decision": "keep", "reason": "States originator and distributor of the ATC Flight Plan."}, "claims": [{"id": "M1.origin_and_priority.1.c1", "text": "The ATC Flight Plan", "kind": "class", "owner": "", "rel_type": "", "duplicate_of": ""}, {"id": "M1.origin_and_priority.1.c2", "text": "The ATC Flight Plan is submitted by the Aircraft Operator", "kind": "relationship", "owner": "", "rel_type": "other", "duplicate_of": ""}, {"id": "M1.origin_and_priority.1.c3", "text": "The ATC Flight Plan is ... distributed by the IFPS", "kind": "relationship", "owner": "", "rel_type": "other", "duplicate_of": ""}], "repeats": []}, {"id": "M1.origin_and_priority.2", "milestone": 1, "field": "origin_and_priority", "text": "All involved ATC units receive the flight plan, including departure and destination aerodromes.", "judge": {"decision": "keep", "reason": "States recipients of the flight plan."}, "claims": [{"id": "M1.origin_and_priority.2.c1", "text": "All involved ATC units receive the flight plan", "kind": "relationship", "owner": "", "rel_type": "other", "duplicate_of": ""}, {"id": "M1.origin_and_priority.2.c2", "text": "including departure and destination aerodromes", "kind": "relationship", "owner": "", "rel_type": "other", "duplicate_of": ""}], "repeats": []}, {"id": "M1.timing.1", "milestone": 1, "field": "timing", "text": "Normally this takes place 3 hours before EOBT, however it may be later.", "judge": {"decision": "keep", "reason": "States a timing rule relative to EOBT."}, "claims": [{"id": "M1.timing.1.c1", "text": "Normally this takes place 3 hours before EOBT, however it may be later", "kind": "operation", "owner": "Milestone 1: ATC Flight Plan Activated", "rel_type": "", "duplicate_of": ""}, {"id": "M1.timing.1.c2", "text": "EOBT", "kind": "class", "owner": "", "rel_type": "", "duplicate_of": ""}], "repeats": []}, {"id": "M1.timing.2", "milestone": 1, "field": "timing", "text": "In some cases a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights.", "judge": {"decision": "keep", "reason": "Names a repetitive flight plan as a kind of flight plan with a coverage property."}, "claims": [{"id": "M1.timing.2.c1", "text": "a repetitive flight plan (RFPL)", "kind": "class", "owner": "", "rel_type": "", "duplicate_of": ""}, {"id": "M1.timing.2.c2", "text": "a repetitive flight plan (RFPL) has been submitted, covering daily or weekly flights", "kind": "relationship", "owner": "", "rel_type": "generalization", "duplicate_of": ""}], "repeats": []}, {"id": "M1.data_quality.1", "milestone": 1, "field": "data_quality", "text": "The ATC Flight Plan corresponds to the airport slot programme.", "judge": {"decision": "keep", "reason": "States a consistency rule against the airport slot programme."}, "claims": [{"id": "M1.data_quality.1.c1", "text": "The ATC Flight Plan corresponds to the airport slot programme", "kind": "operation", "owner": "Milestone 1: ATC Flight Plan Activated", "rel_type": "", "duplicate_of": ""}, {"id": "M1.data_quality.1.c2", "text": "the airport slot programme", "kind": "class", "owner": "", "rel_type": "", "duplicate_of": ""}], "repeats": []}, {"id": "M1.effect.1", "milestone": 1, "field": "effect", "text": "One aircraft turn-round normally includes an arriving and a departing flight, meaning that it will have two related flight plans.", "judge": {"decision": "keep", "reason": "States turn-round structure linking two flights and two flight plans."}, "claims": [{"id": "M1.effect.1.c1", "text": "One aircraft turn-round normally includes an arriving and a departing flight", "kind": "relationship", "owner": "", "rel_type": "other", "duplicate_of": ""}, {"id": "M1.effect.1.c2", "text": "it will have two related flight plans", "kind": "relationship", "owner": "", "rel_type": "other", "duplicate_of": ""}], "repeats": []}, {"id": "M1.effect.2", "milestone": 1, "field": "effect", "text": "For coordinated airports, the outbound flight is already known.", "judge": {"decision": "keep", "reason": "States a condition on coordinated airports concerning the outbound flight."}, "claims": [{"id": "M1.effect.2.c1", "text": "For coordinated airports, the outbound flight is already known", "kind": "operation", "owner": "Milestone 1: ATC Flight Plan Activated", "rel_type": "", "duplicate_of": ""}], "repeats": []}, {"id": "M1.effect.3", "milestone": 1, "field": "effect", "text": "The flight plan may be used to update certain information such as type of aircraft.", "judge": {"decision": "keep", "reason": "States an update rule and an aircraft attribute."}, "claims": [{"id": "M1.effect.3.c1", "text": "The flight plan may be used to update certain information such as type of aircraft", "kind": "operation", "owner": "Milestone 1: ATC Flight Plan Activated", "rel_type": "", "duplicate_of": ""}, {"id": "M1.effect.3.c2", "text": "type of aircraft", "kind": "attribute", "owner": "Aircraft", "rel_type": "", "duplicate_of": ""}], "repeats": []}, {"id": "M1.effect.4", "milestone": 1, "field": "effect", "text": "For long distance flights, the ELDT may differ from the airport slot.", "judge": {"decision": "keep", "reason": "Names ELDT and states a tolerance condition against the airport slot."}, "claims": [{"id": "M1.effect.4.c1", "text": "ELDT", "kind": "class", "owner": "", "rel_type": "", "duplicate_of": ""}, {"id": "M1.effect.4.c2", "text": "For long distance flights, the ELDT may differ from the airport slot", "kind": "operation", "owner": "Milestone 1: ATC Flight Plan Activated", "rel_type": "", "duplicate_of": ""}], "repeats": []}, {"id": "M1.effect.5", "milestone": 1, "field": "effect", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight.", "judge": {"decision": "keep", "reason": "States a trigger rule for non coordinated airports."}, "claims": [{"id": "M1.effect.5.c1", "text": "For non coordinated airports, the flight plan is used to initiate the outbound flight", "kind": "operation", "owner" ar Update", "rel_type": "", "duplicate_of": ""}, {"id": "M4.origin_and_priority.1.c2", "text": "Area Control Centre (ACC)", "kind": "class", "owner": "", "rel_type": "", "duplicate_of": ""}, {"id": "M4.origin_and_priority.1.c3", "text": "Approach Control Unit", "kind": "class", "owner": "", "rel_type": "", "duplicate_of": ""}, {"id": "M4.origin_and_priority.1.c4", "text": "This information is normally available from the Area Control Centre (ACC) or Approach Control Unit", "kind": "relationship", "owner": "", "rel_type": "other", "duplicate_of": ""}], "repeats": []}, {"id": "M4.origin_and_priority.2", "milestone": 4, "field": "origin_and_priority", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "judge": {"decision": "keep", "reason": "Describes the detection rule performed by the radar system and the identifier it relies on."}, "claims": [{"id": "M4.origin_and_priority.2.c1", "text": "The radar system is able to detect a flight based upon the assigned SSR code when the flight crosses a defined FIR/ATC boundary.", "kind": "operation", "owner": "Radar system", "rel_type": "", "duplicate_of": "", "owner_as_proposed": "radar system"}, {"id": "M4.origin_and_priority.2.c2", "text": "The radar system", "kind": "class", "owner": "", "rel_type": "", "duplicate_of": ""}, {"id": "M4.origin_and_priority.2.c3", "text": "the assigned SSR code", "kind": "attribute", "owner": "Flight", "rel_type": "", "duplicate_of": "", "owner_as_proposed": "flight"}], "repeats": []}, {"id": "M4.timing.1", "milestone": 4, "field": "timing", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "judge": {"decision": "keep", "reason": "States the timing property of the milestone."}, "claims": [{"id": "M4.timing.1.c1", "text": "Dependent upon the position of the airport in relation to the FIR boundary.", "kind": "attribute", "owner": "Milestone 4: Local Radar Update", "rel_type": "", "duplicate_of": ""}], "repeats": []}, {"id": "M4.data_quality.1", "milestone": 4, "field": "data_quality", "text": "Must be equal to the accuracy of the ATC system.", "judge": {"decision": "keep", "reason": "States the accuracy requirement of the milestone."}, "claims": [{"id": "M4.data_quality.1.c1", "text": "Must be equal to the accuracy of the ATC system.", "kind": "attribute", "owner": "Milestone 4: Local Radar Update", "rel_type": "", "duplicate_of": ""}], "repeats": []}, {"id": "M4.effect.1", "milestone": 4, "field": "effect", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "judge": {"decision": "keep", "reason": "States a trigger from ELDT update to TOBT, names the time quantities, and who enters or calculates TOBT."}, "claims": [{"id": "M4.effect.1.c1", "text": "Update of the ELDT can trigger a new TOBT to be entered by the AO/GH, or calculated automatically by the Airport CDM Platform.", "kind": "operation", "owner": "Milestone 4: Local Radar Update", "rel_type": "", "duplicate_of": ""}, {"id": "M4.effect.1.c6", "text": "a new TOBT to be entered by the AO/GH", "kind": "relationship", "owner": "", "rel_type": "other", "duplicate_of": ""}, {"id": "M4.effect.1.c7", "text": "calculated automatically by the Airport CDM Platform", "kind": "operation", "owner": "Airport CDM Platform", "rel_type": "", "duplicate_of": ""}], "repeats": ["M1.effect.4.c1", "M2.procedures.5.c2", "M2.procedures.1.c5", "M1.definition.2.c1"]}, {"id": "M4.effect.2", "milestone": 4, "field": "effect", "text": "The accuracy of ELDT is particularly important at this stage since downstream decisions are taken, such as stand /gate / aircraft changes, preparation of arrival sequence, preparation of ground handling operations, decisions for connecting passengers.", "judge": {"decision": "drop", "reason": "Explanatory rationale about why ELDT accuracy matters; no element to realise."}, "claims": [], "repeats": []}, {"id": "M4.effect.3", "milestone": 4, "field": "effect", "text": "Uncertainty and ELDT non-accuracy at this stage significantly increase risks for bad and last minute decisions and internal disruptions.", "judge": {"decision": "drop", "reason": "Explanatory rationale about risks; no element to realise."}, "claims": [], "repeats": []}, {"id": "M4.effect.4", "milestone": 4, "field": "effect", "text": "The objective to decrease the number of stand and gate changes in the last 30 minutes requires high accuracy regarding departure and arrival times.", "judge": {"decision": "drop", "reason": "States an objective/rationale rather than a rule, value, or thing."}, "claims": [], "repeats": []}, {"id": "M4.effect.5", "milestone": 4, "field": "effect", "text": "Therefore, taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "judge": {"decision": "keep", "reason": "States a rule about stand/gate changes relative to ELDT and names the taxi-in time quantity."}, "claims": [{"id": "M4.effect.5.c1", "text": "taking into account the taxi-in time (EXIT), any change to a stand or gate is not preferred after ELDT-30'.", "kind": "operation", "owner": "Milestone 4: Local Radar Update", "rel_type": "", "duplicate_of": ""}, {"id": "M4.effect.5.c2", "text": "the taxi-in time (EXIT)", "kind": "class", "owner": "", "rel_type": "", "duplicate_of": ""}], "repeats": []}, {"id": "M4.effect.6", "milestone": 4, "field": "effect", "text": "The update of TOBT for the related departing flight takes place following this milestone.", "judge": {"decision": "keep", "reason": "States the TOBT update following the milestone and links the arriving flight to its related departing flight."}, "claims": [{"id": "M4.effect.6.c2", "text": "the related departing flight", "kind": "relationship", "owner": "", "rel_type": "other", "duplicate_of": ""}], "repeats": ["M4.effect.1.c1"]}, {"id": "M4.effect.7", "milestone": 4, "field": "effect", "text": "Decisions such as the turn-round period, connecting passengers etc are taken and need to be stable at this event.", "judge": {"decision": "drop", "reason": "Explanatory statement about decision stability; no checkable rule, value, or thing."}, "claims": [], "repeats": []}, {"id": "M4.effect.8", "milestone": 4, "field": "effect", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "judge": {"decision": "keep", "reason": "Gives the EIBT calculation and names the time quantities involved."}, "claims": [{"id": "M4.effect.8.c1", "text": "An estimated in-block time (EIBT) is computed using the ELDT and the estimated taxi-in time.", "kind": "operation", "owner": "Airport CDM Platform", "rel_type": "", "duplicate_of": ""}], "repeats": ["M1.action_on_cdm.1.c2", "M4.effect.1.c2", "M4.effect.5.c2"]}, {"id": "M4.procedures.1", "milestone": 4, "field": "procedures", "text": "To commence the TOBT process and check whether the AO/GH TOBT is consistent with the ATC Flight Plan.", "judge": {"decision": "keep", "reason": "States two procedures under the milestone: commencing the TOBT process and a consistency check against the ATC Flight Plan."}, "claims": [{"id": "M4.procedures.1.c1", "text": "To commence the TOBT process", "kind": "operation", "owner": "Milestone 4: Local Radar Update", "rel_type": "", "duplicate_of": ""}, {"id": "M4.procedures.1.c2", "text": "check whether the AO/GH TOBT is consistent with the ATC Flight Plan", "kind": "operation", "owner": "Milestone 4: Local Radar Update", "rel_type": "", "duplicate_of": ""}], "repeats": ["M1.origin_and_priority.1.c1"]}, {"id": "M4.procedures.2", "milestone": 4, "field": "procedures", "text": "Network Operations is informed when the TTOT changes by more than the agreed TTOT tolerance.", "judge": {"decision": "keep", "reason": "States a notification rule with a tolerance condition and names the receiving stakeholder and time quantity."}, "claims": [{"id": "M4.procedures.2.c1", "te   // the seed: a consensus wherever the two reviews need no discussion, null where they differ; additions as the union

  for (const [id, e] of Object.entries(DATA.seed.claims)) claims[id] = e.consensus ? {...e.consensus} : null;
  const added = {};
  for (const [sid, list] of Object.entries(DATA.seed.added)) added[sid] = list.map(a => ({...a}));
  return {claims, added, pairs: {}, extra: [], families: {}, cur: 'overview', ms: 1};
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.claims) return s; } catch (e) {}

}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); document.getElementById('saved').textContent = 'saved ' + new Date().toLocaleTimeString(); }

}

  let html = `<h2>Near-miss pairs</h2><p class="q">Pairs of kept class or enumeration claims whose normalised names are nested, one inside the other, sharing two or more words (the exact-repeat rule cannot decide them). <b>one thing</b>: they name the same thing and the later is counted as a repeat of the earlier. <b>two things</b>: both stay. The test: could a model hold one and lack the other, and would the document say something about the one it lacks? If not, one thing (two names for one object, such as the ICAO flight plan and the ATC flight plan). If so, two things; and when one is a kind of the other (a repetitive flight plan is a kind of flight plan), the kind-of link should itself be a relationship claim of type <i>generalization</i>, kept or added under the sentence that states it. If one member is not a class at all (ATC beside a time called ATC ATA), two things, or reject the one that is not. ${moot ? `${moot} pair${moot > 1 ? 's are' : ' is'} not shown because one member is rejected, dropped, still undecided, or no longer a class.` : ''}</p>`;
  html += live.map(pairRow).join('') || '<p class="help">nothing open here</p>';
  const opts = keptThings().map(uid => { const t = thing(uid); return `<option value="${esc(uid)}">${esc(uid)} · ${esc(t.kind)} · ${esc(t.text)}</option>`; }).join('');
  html += `<h3>Two other claims that name one thing</h3><p class="help">The list above holds only pairs whose normalised names are nested (e.g. "flight plan" in "ATC flight plan"). Two names for the same thing that share no words, such as "The ICAO flight plan" and "The ATC Flight Plan", are not on it; add such a pair here and it is treated like any other.</p>
    <div class="rule"><label>claim</label><input list="things" id="pa" placeholder="type an id or a word of the claim, then pick from the list"><label>and</label><input list="things" id="pb" placeholder="the other claim"><label></label><div><button id="addpair" class="quick-add">add as a pair</button></div></div><datalist id="things">${opts}</datalist>`;
  return html;
}
function renderAll() {
  const only = document.getElementById('openonly').checked;
  const mss = [...new Set(DATA.sentences.map(s => s.milestone))].sort((a, b) => a - b);
  let html = `<h2>All claims</h2><div class="mslist">${mss.map(m => { const o = DATA.sentences.filter(s => s.milestone === m).flatMap(s => s.claims).filter(c => isOpen(c.id)).length + DATA.sentences.filter(s => s.milestone === m).flatMap(s => S.added[s.id] || []).filter(a => a.keep == null).length; return `<button class="${S.ms === m ? 'cur' : ''}" data-ms="${m}">M${m}${o ? ` (${o})` : ''}</button>`; }).join('')}</div>
    <p class="help">Milestone ${S.ms}: ${esc(DATA.names[S.ms] || '')}, reviewed by ${R.filter(n => DATA.assigned[n].includes(S.ms)).join(' and ')}.</p>`;
  for (const fld of FIELDS_ORDER) {
    const sents = DATA.sentences.filter(s => s.milestone === S.ms && s.field === fld);
    if (!sents.length) continue;
    let blocks = '';
    for (const s of sents) {
      const ids = s.claims.map(c => c.id).filter(id => !only || isOpen(id));
      const idx = (S.added[s.id] || []).map((a, i) => i).filter(i => !only || S.added[s.id][i].keep == null);
      if (only && !ids.length && !idx.length) continue;
      blocks += sentenceBlock(s, ids, idx);
    }
    if (blocks) html += `<h3>${esc(FIELD[fld])}</h3>` + blocks;
  }
  return html;
}
function renderMain() {
  const main = document.getElementById('main');
  const cur = S.cur || 'overview';
  if (cur === 'final' && DATA.final) main.innerHTML = renderFinal();
  else if (cur === 'overview') main.innerHTML = renderOverview();
  else if (cur.startsWith('fam:')) main.innerHTML = renderFamily(DATA.families.find(f => f.key === cur.slice(4)));
  else if (cur === 'conflicts') main.innerHTML = renderConflicts();
  else if (cur === 'added') main.innerHTML = renderAdded();
  else if (cur === 'pairs') main.innerHTML = renderPairs();
  else main.innerHTML = renderAll();
  main.querySelectorAll('.claim[data-cid]').forEach(wireClaim);
  main.querySelectorAll('.claim[data-uid]').forEach(wireAdded);
  main.querySelectorAll('.pair').forEach(wirePair);
  const ap = main.querySelector('#addpair');
  if (ap) ap.onclick = () => {
    let a = main.querySelector('#pa').value.trim(), b = main.querySelector('#pb').value.trim();
    if (!(a in ORDER) || !(b in ORDER) || a === b) { alert('pick two different claims from the list'); return; }
    if (!thingKept(a) || !thingKept(b) || !thingIsThing(a) || !thingIsThing(b)) { alert('both must be kept class or enumeration claims'); return; }
    if (ORDER[a] > ORDER[b]) [a, b] = [b, a];
    if (allPairs().some(p => p.a === a && p.b === b)) { alert('that pair is already listed'); return; }
    (S.extra = S.extra || []).push({a, b, shared: [], manual: true});
    save(); renderMain();
  };
  main.querySelectorAll('textarea[data-fam]').forEach(t => t.addEventListener('input', () => { S.families[t.dataset.fam] = t.value; save(); }));
  main.querySelectorAll('.quick button').forEach(b => b.onclick = () => {
    const f = DATA.families.find(x => x.key === b.dataset.fam);
    for (const id of f.ids) if (CLAIM[id].kind === b.dataset.kind) setDecision(id, b.dataset.dec, true);
    save(); renderMain();
  });
  main.querySelectorAll('.mslist button').forEach(b => b.onclick = () => { S.ms = +b.dataset.ms; save(); renderMain(); });
  main.querySelectorAll('a[data-go]').forEach(a => a.onclick = ev => { ev.preventDefault(); S.cur = a.dataset.go; save(); renderMain(); });
  main.querySelectorAll('.add').forEach(b => b.onclick = () => {
    (S.added[b.dataset.sid] = S.added[b.dataset.sid] || []).push({text:'', kind:'operation', owner:'', rel_type:'', note:'', by:['meeting'], keep:true, _edit:true});
    save(); renderMain();
    const rows = main.querySelectorAll(`.claim[data-uid^="${b.dataset.sid}.add."]`); rows[rows.length - 1]?.querySelector('textarea')?.focus();
  });
}
function setDecision(id, dec, force) {
  const c = CLAIM[id], cur = S.claims[id];
  if (!force && cur && cur.decision === dec) return;          // already so
  if (dec === 'reject') S.claims[id] = {decision: 'reject', note: cur && cur.note || ''};
  else if (dec === 'accept') S.claims[id] = {decision: 'accept', kind: c.kind, owner: c.owner, text: c.text, rel_type: c.rel_type, note: cur && cur.note || ''};
  else {  // edit: start from the current consensus fields if any, else from a reviewer's edit, else the proposal
    const base = (cur && cur.decision === 'edit') ? cur : (Object.values(views(id)).find(v => v.decision === 'edit') || c);
    S.claims[id] = {decision: 'edit', kind: base.kind, owner: base.owner, text: base.text, rel_type: base.rel_type, note: cur && cur.note || ''};
  }
}
function wireClaim(row) {
  const id = row.dataset.cid;
  const set = dec => { setDecision(id, dec, true); save(); rerender(row); };
  row.querySelector('.a').onclick = () => set('accept');
  row.querySelector('.e').onclick = () => set('edit');
  row.querySelector('.r').onclick = () => set('reject');
  row.querySelectorAll('.take').forEach(b => b.onclick = () => {
    const v = views(id)[b.dataset.take];
    S.claims[id] = v.decision === 'reject' ? {decision: 'reject', note: v.note || ''}
      : {decision: v.decision, kind: v.kind, owner: v.owner, text: v.text, rel_type: v.rel_type, note: v.note || ''};
    save(); rerender(row);
  });
  row.querySelectorAll('[data-k]').forEach(inp => inp.addEventListener('input', () => {
    const k = inp.dataset.k;
    if (k === 'note') { (S.claims[id] = S.claims[id] || {decision: null}).note = inp.value; save(); return; }
    const t = S.claims[id];
    if (k === 'owner') {
      const other = row.querySelector('[data-k=owner_other]');
      if (inp.value === '__other__') { other.style.display = ''; t.owner = other.value; other.focus(); }
      else { other.style.display = 'none'; t.owner = inp.value; }
    } else if (k === 'owner_other') t.owner = inp.value;
    else t[k] = inp.value;
    save();
    if (k === 'kind') rerender(row, true);
  }));
  row.addEventListener('keydown', ev => {
    if (ev.target.matches('input, textarea, select')) return;
    if (ev.key === 'a') set('accept'); else if (ev.key === 'e') set('edit'); else if (ev.key === 'r') set('reject'); else return;
    ev.preventDefault();
  });
}
function wireAdded(row) {
  const uid = row.dataset.uid, a = addEntry(uid);
  const set = keep => { a.keep = keep; save(); rerender(row); };
  row.querySelector('.k').onclick = () => set(true);
  row.querySelector('.d').onclick = () => set(false);
  row.querySelector('.x').onclick = () => { a._edit = !a._edit; save(); rerender(row); };
  row.querySelectorAll('[data-k]').forEach(inp => inp.addEventListener('input', () => {
    const k = inp.dataset.k;
    if (k === 'owner') {
      const other = row.querySelector('[data-k=owner_other]');
      if (inp.value === '__other__') { other.style.display = ''; a.owner = other.value; other.focus(); }
      else { other.style.display = 'none'; a.owner = inp.value; }
    } else if (k === 'owner_other') a.owner = inp.value;
    else a[k] = inp.value;
    save();
    if (k === 'kind') rerender(row, true);
  }));
  row.addEventListener('keydown', ev => {
    if (ev.target.matches('input, textarea, select')) return;
    if (ev.key === 'a') set(true); else if (ev.key === 'r') set(false); else return;
    ev.preventDefault();
  });
}
function wirePair(row) {
  const pk = row.dataset.pk;
  const set = d => { S.pairs[pk] = S.pairs[pk] === d ? undefined : d; save(); renderMain(); };
  row.querySelector('.s').onclick = () => set('same');
  row.querySelector('.d').onclick = () => set('distinct');
}
function rerender(row, keepFocus) {
  const tmp = document.createElement('div');
  if (row.dataset.cid) tmp.innerHTML = claimRow(row.dataset.cid, !!row.querySelector('.cid .ms'));
  else { const m = row.dataset.uid.match(/^(.*)\.add\.(\d+)$/); tmp.innerHTML = addedRow(m[1], +m[2]); }
  const fresh = tmp.firstElementChild; row.replaceWith(fresh);
  if (fresh.dataset.cid) wireClaim(fresh); else wireAdded(fresh);
  if (keepFocus) fresh.querySelector('select[data-k=kind]')?.focus();
  else { fresh.focus(); if (fresh.querySelector('.editor') && fresh.dataset.cid && S.claims[fresh.dataset.cid]?.decision === 'edit') fresh.querySelector('select[data-k=kind]')?.focus(); }
  renderNav(); renderCount();
}
document.addEventListener('keydown', ev => {
  if (ev.target.matches('input, textarea, select')) return;
  const rows = [...document.querySelectorAll('.claim, .pair')];
  const i = rows.indexOf(document.activeElement);
  if (ev.key === 'j') { (rows[i + 1] || rows[0])?.focus(); ev.preventDefault(); }
  else if (ev.key === 'k') { (rows[i - 1] || rows[rows.length - 1])?.focus(); ev.preventDefault(); }
});
document.getElementById('openonly').onchange = renderMain;
document.getElementById('who').textContent = `reviews: ${R.join(' and ')}`;

// ---- export: the file inventory.py freeze --consensus reads
document.getElementById('export').onclick = () => {
  const openN = openClaims().length + openAdds().length + openPairs().length + (DATA.final ? finalOpen() : 0);
  if (openN && !confirm(`${openN} items are still unresolved. Export anyway? (freeze will not accept an unresolved file)`)) return;
  const claims = {};
  for (const [id, st] of Object.entries(S.claims)) {
    if (!st || !st.decision) continue;
    if (st.decision === 'reject') { claims[id] = {decision: 'reject', note: st.note || ''}; continue; }
    const c = CLAIM[id];
    const changed = FIELDS_OF.some(k => (st[k] || '') !== (c[k] || ''));
    claims[id] = {decision: changed ? 'edit' : 'accept', kind: st.kind, owner: st.owner || '', text: st.text, rel_type: st.rel_type || '', note: st.note || ''};
  }
  const added = {}, finalId = {};
  for (const [sid, list] of Object.entries(S.added)) {
    const keep = [];
    list.forEach((a, i) => { if (a.keep === true && a.text.trim()) { keep.push({kind: a.kind, owner: a.owner || '', text: a.text, rel_type: a.rel_type || '', note: a.note || '', by: a.by}); finalId[addUid(sid, i)] = `${sid}.a${keep.length}`; } });
    if (keep.length) added[sid] = keep;
  }
  const fid = uid => finalId[uid] || uid;
  const merges = {}, pairs = {};
  const parent = {}; const find = x => parent[x] === undefined || parent[x] === x ? x : (parent[x] = find(parent[x]));
  for (const p of livePairs()) { const d = S.pairs[pairKey(p)]; if (!d) continue; pairs[fid(p.a) + '|' + fid(p.b)] = d; if (d === 'same') { const ra = find(p.a), rb = find(p.b); if (ra !== rb) parent[ORDER[ra] <= ORDER[rb] ? rb : ra] = ORDER[ra] <= ORDER[rb] ? ra : rb; } }
  const contra = livePairs().filter(p => S.pairs[pairKey(p)] === 'distinct' && find(p.a) === find(p.b));
  if (contra.length && !confirm(`${contra.length} pair(s) are called two things although each member is one thing with a common partner (${contra.map(p => p.a + ' / ' + p.b).join('; ')}). Export anyway?`)) return;
  for (const x of Object.keys(parent)) { const r = find(x); if (r !== x) merges[fid(x)] = fid(r); }
  const out = {reviewers: R, exported: new Date().toISOString(), draft_generated: DATA.generated,
               reviews_exported: DATA.exported, families: S.families, claims, added, merges, pairs,
               unresolved: {claims: openClaims().length, additions: openAdds().length, pairs: openPairs().length},
               changed_at_meeting: Object.keys(S.claims).filter(id => changedFromSeed(id) || (conflict(id) && S.claims[id])).length, state: S};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'claims_consensus.json'; a.click();
};
document.getElementById('import').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); if (!d.state || !d.state.claims) { alert('not a consensus export'); return; } S = d.state; save(); renderMain(); });
};
renderNav(); renderCount(); renderMain();
</script>
